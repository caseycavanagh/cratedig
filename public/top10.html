/* A top 10 of 2026: ten numbered places, each a soft bar. Every place is quiet at rest; tap any number to search
   there instead, so a list can have gaps. Drag a row from anywhere on it (on a touch screen, hold it for a beat first): the other places,
   empty ones too, part under it as it passes, and it settles where you let go. × takes one out (with Undo).
   Your name is typed into the title; a glass bar at the bottom holds three icons (colors, Copy link, Share) and changes shape for each;
   a glass note over it says what last changed, with Undo, until the next change. The list lives in its
   link (vinyl/visitor-crate.js), gaps closed up, and the link opens it on the crate page, ranked. Tokens: /vinyl/tokens.css */
*,*::before,*::after{box-sizing:border-box}*{margin:0}

button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ring);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}
[hidden]{display:none!important}

/* one column, laptop and phone */
.t{max-width:560px;margin:0 auto;padding:96px 0 160px;min-height:100vh;min-height:100dvh}
/* on a laptop the title and the list sit in the middle of the screen, both ways, in the room the header and the bar leave; taller than the screen, they start at the top and scroll */
@media(min-width:901px){.t{display:flex;flex-direction:column;justify-content:center;padding:72px 0 150px}.from{height:0;margin-top:20px}} /* Start from a list hangs under the list without counting toward the middle */
.side{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;min-width:0;margin-bottom:28px}
.side h1{flex:1 1 auto;min-width:0}
/* Start over: just words, on the title's line, ending at the rows' right edge (on a phone, under the title). It comes in with the first pick, and its room is kept so nothing moves */

.lk{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2);font-weight:500;line-height:1.3;color:var(--t2);white-space:nowrap;transition:color .2s}
.lk svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(hover:hover){.lk:hover{color:var(--fg)}}
.lk:active{opacity:.6}
.lk:focus-visible{outline:1px solid var(--ring);outline-offset:3px;border-radius:2px}
.clr{flex:none;margin-left:auto;transition:opacity .6s var(--ease),color .2s}
.clr[aria-disabled=true]{opacity:0;visibility:hidden;transition:opacity .15s var(--out),visibility 0s .15s}
h1{font-size:var(--fs-6);font-weight:500;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
main{position:relative;min-width:0;--nw:34px;--gap:8px;--pl:12px;--cv:48px} /* the bar starts --gap past the number, and the cover sits --pl inside the bar on every side.
   Corners nest: the bar's 14 is the cover's 2 plus the 12 around it, so the two curves run parallel */

/* the ten places: soft bars, a little apart, no lines. A bar's color is the page's with a touch of the text's, so every color scheme has them */
.ls{--bar:color-mix(in srgb,var(--fg) 5%,var(--bg));--bar-e:color-mix(in srgb,var(--fg) 2.5%,var(--bg));
  list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
/* the number hangs outside the bar, in the margin; the bar starts at the cover */
.row{--rb:var(--bar);position:relative;display:flex;align-items:center;gap:var(--gap);min-height:calc(var(--cv) + 2*var(--pl));padding:0 calc(var(--pl) - 2px) 0 0;border-radius:var(--r-in);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.n{flex:none;width:var(--nw);font-size:var(--fs-5);font-weight:500;line-height:1;letter-spacing:-.02em;text-align:left;color:var(--rank-n,var(--fg))}
.row::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;right:0;left:calc(var(--nw) + var(--gap));border-radius:var(--r-in);background:var(--rb);transition:background-color .2s,box-shadow .2s var(--ease)}
.row>.cv{margin-left:var(--pl);margin-right:calc(var(--pl) - var(--gap))} /* the same room on every side of the cover, the words included */

.cv{flex:none;width:var(--cv);height:var(--cv);border-radius:var(--r-cover);overflow:hidden;background:var(--soft)}

@media(hover:hover){.ib:hover{color:var(--fg);background:var(--hov)}}

@media(hover:hover) and (pointer:fine){.row .x{opacity:0;transition:opacity .15s,color .2s,background-color .2s}.row:hover .x,.row .x:focus-visible{opacity:1}}

/* the open place is the search */
.fld{flex:1;min-width:0;position:relative}
.fld svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--m);pointer-events:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.fld input{display:block;width:100%;height:44px;border:0;border-radius:var(--r-pill);background:var(--soft);font-size:var(--fs-3);outline:none;padding:0 16px 0 40px;transition:box-shadow .2s}

/* results float over the places below, so nothing moves */
/* the whole way across, under the place it fills */
.found{position:absolute;z-index:4;left:calc(var(--nw) + var(--gap));right:0;list-style:none;padding:6px;max-height:min(480px,60vh);max-height:min(480px,60dvh);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:var(--r-in);background:var(--sheet);box-shadow:var(--float);display:grid}

/* Start from a list: critics' year-end lists (vinyl/lists-2026.json). One tap fills the ten, with Undo */

.from[hidden]{display:grid!important;visibility:hidden} /* it keeps its room, so the list never moves when it goes */

.cust .ok{all:unset;cursor:pointer;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--on-fg);transition:transform .35s var(--ease),opacity .2s}
.cust .ok svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cust .ok:active{transform:scale(.9)}
.cust .ok:focus-visible{outline:1px solid var(--ring);outline-offset:2px}
.pc{transition:background-color .2s}
/* the bar's tooltip: one glass label (the crate's .tip) that waits a beat, rises over the icon, then glides from icon to icon as the pointer moves
   along the bar instead of each one fading out and in; it leaves on a quick fade. Only where there's a pointer: on a phone the icons say what they did */
.tip{position:absolute;left:0;bottom:calc(100% + 10px);padding:8px 12px;border-radius:var(--r-in);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--float);color:var(--fg);font-size:var(--fs-2);line-height:1.3;white-space:nowrap;pointer-events:none;
  opacity:0;translate:calc(var(--x,0px) - 50%) 4px;transition:opacity .1s var(--out),translate 0s .1s}
.tip.on{opacity:1;translate:calc(var(--x,0px) - 50%) 0;transition:opacity .2s,translate .45s var(--ease)}
@media(prefers-reduced-motion:reduce){.tip,.tip.on{translate:calc(var(--x,0px) - 50%) 0;transition:opacity .15s}}
/* where there's a pointer, everything in the bar answers it: icons and buttons get the soft hover fill, the dots lift a little */
@media(hover:hover){
  .fb,.cols .x{transition:color .2s,background-color .2s,opacity .2s}
  .fb:hover{background:radial-gradient(circle closest-side,var(--hov) 84%,transparent 86%)}
  .dot:hover{transform:scale(1.12)}
  .dot[aria-pressed=true]:hover{transform:none}
  .pc:hover{background:var(--hov)}
  .cust .ok:hover{transform:scale(1.08)}
  .note button:hover{background:var(--hov)}
  .pl:hover{border-color:var(--line2)}
}
.pc{display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 14px;border-radius:var(--r-pill);background:var(--soft);font-size:var(--fs-2);cursor:pointer;white-space:nowrap}
.pc input{flex:none;width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.pc input::-webkit-color-swatch-wrapper{padding:0}
.pc input::-webkit-color-swatch{border:1px solid var(--t3);border-radius:50%}
.pc input::-moz-color-swatch{border:1px solid var(--t3);border-radius:50%}

/* the note: the crate's bar note (.dsay), glass over the glass bar. It stays until your next change, so Undo is always there */
.note{position:fixed;z-index:var(--z-bar);left:50%;bottom:calc(var(--db) + var(--H) + 14px);--db:calc(env(safe-area-inset-bottom) + 28px);--H:54px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);box-sizing:border-box;height:40px;padding:0 6px 0 16px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--float);color:var(--fg);font-size:var(--fs-3);
  opacity:0;visibility:hidden;translate:-50% 10px;transition:opacity .15s var(--out),visibility 0s .15s,translate 0s .15s}
.note.on{opacity:1;visibility:visible;translate:-50% 0;transition:opacity .2s,translate .5s var(--ease)}
.note span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.note button{all:unset;flex:none;cursor:pointer;height:28px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line2);font-size:var(--fs-2);transition:transform .5s var(--ease)}
.note button:active{transform:scale(.97);transition-duration:.08s}
.note button:focus-visible{outline:1px solid var(--ring);outline-offset:2px}
/* × lets it go at once; so does a tap on the words */
.note{padding-right:4px;gap:8px}
.note span{cursor:default;margin-right:4px}
.note .nu{display:inline-flex;align-items:center;height:28px;padding:0 6px;border:0;border-radius:0;font-size:var(--fs-2);font-weight:500;color:var(--t2);transition:color .2s}
.note .nx{width:28px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;color:var(--t2);transition:color .2s,background-color .2s}
.note .nx svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
@media(hover:hover){.note .nx:hover{color:var(--fg);background:var(--hov)}.note .nu:hover{background:none;color:var(--fg)}}
body.colors .note{opacity:0;visibility:hidden;transition:opacity .12s,visibility 0s .12s}

@media(max-width:900px){
  .t{display:block;padding:calc(env(safe-area-inset-top) + 72px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 150px) max(16px,env(safe-area-inset-left))}
  .dock,.note{--H:58px;--db:calc(env(safe-area-inset-bottom) + 24px)}
  /* searching: room below so even number 10 can rise to the top, and the bar and note step aside for the results */
  body.searching .t{padding-bottom:100vh}
  body.searching .dock,body.searching .note,body.searching .hdr{opacity:0;visibility:hidden;transition:opacity .15s,visibility 0s .15s}
  .side{position:static;gap:6px 20px;margin-bottom:16px}
  h1{font-size:var(--fs-5)}
  main{--nw:28px}
  .n{font-size:22px}
  .fld input{font-size:var(--fs-4)}
}
@media(max-width:369px){main{--nw:26px;--gap:8px;--pl:10px;--cv:42px}.n{font-size:20px}.cols .sc,.dots{gap:6px}.dot{width:26px;height:26px}}
/* reduced motion: things fade, nothing moves */
@media(prefers-reduced-motion:reduce){.btn,.btn:active,.pl:active{transform:none}.row.w .cv{animation:none}.ls.dragging .row:not(.drag){transition:none}.row.drag{scale:none}.note,.note.on{translate:-50% 0;transition:opacity .2s}.one{transition:none}}

<script>
const $=(s,r=document)=>r.querySelector(s);
const V=window.VisitorCrate,KEY='top10-2026',TEN=10,YEAR='2026';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=r=>r.src==='m'&&r.group?'g'+r.group:(r.src||'a')+r.id; // one per album
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,fine=matchMedia('(pointer:fine)').matches;
const EASE='cubic-bezier(.22,1,.36,1)';
const IC={
  q:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  link:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
// slots: the ten places, a record or null. A list can have gaps while you make it; its link closes them up
let slots=Array(TEN).fill(null),at=0,name='',look={t:'a'},from='';
const filled=()=>slots.filter(Boolean);
const firstGap=(from=0)=>{for(let k=0;k<TEN;k++){const i=(from+k)%TEN;if(!slots[i])return i}return -1};
// the presets: [name, background, text, numbers]. a is the crate's own colors. Keep in step with PRESETS in src/lib/top10.ts
const SC={a:['Night','#121212','#ffffff','#ffffff'],b:['Paper','#f2ede2','#1f1b16','#1f1b16'],c:['Cobalt','#1f33c7','#ffffff','#ffffff'],d:['Tomato','#e2462c','#fff6ea','#fff6ea'],
  e:['Forest','#16382a','#f1e9d2','#d8b968'],f:['Bubblegum','#ffd3e3','#3a0d28','#c2185b'],g:['Mustard','#f1c232','#1c1708','#1c1708']};
const HEX=/^[0-9a-f]{6}$/i;
// the bar offers black and three colors; the others still open from links made before
const SHOW=['a','c','d','e'];
const colors=()=>SC[look.t]?{bg:SC[look.t][1],fg:SC[look.t][2],n:SC[look.t][3]}:{bg:look.bg,fg:look.fg,n:look.n||look.fg};
// every other token comes from the two colors, mixed; Night keeps tokens.css as it is. A light page gets softer shadows
const TOK=['--glass','--bg','--fg','--on-fg','--t1','--t2','--m','--t3','--t4','--line','--line2','--soft','--sheet','--hov','--prs','--sel','--ring','--rank-n','--lift','--float'];
const light=h=>{h=h.slice(1);return(.2126*parseInt(h.slice(0,2),16)+.7152*parseInt(h.slice(2,4),16)+.0722*parseInt(h.slice(4,6),16))/255>.6};
function paint(){
  const st=document.documentElement.style,c=colors();
  if(look.t==='a'){TOK.forEach(k=>st.removeProperty(k))}
  else{const mix=p=>`color-mix(in srgb,${c.fg} ${p}%,${c.bg})`,a=p=>`color-mix(in srgb,${c.fg} ${p}%,transparent)`;
    Object.entries({'--bg':c.bg,'--fg':c.fg,'--on-fg':c.bg,'--t1':mix(85),'--t2':mix(68),'--m':mix(60),'--t3':mix(46),'--t4':mix(38),'--line':a(14),'--line2':a(22),'--soft':mix(9),'--sheet':mix(7),'--hov':a(6),'--prs':a(8),'--sel':a(12),'--ring':a(26),'--rank-n':c.n,'--glass':`color-mix(in srgb,${mix(9)} 72%,transparent)`}).forEach(([k,v])=>st.setProperty(k,v));
    if(light(c.bg)){st.setProperty('--lift','0 12px 24px -12px #0003,0 2px 6px -2px #0002');st.setProperty('--float','0 12px 32px #0002')}else{st.removeProperty('--lift');st.removeProperty('--float')}}
  document.querySelector('meta[name=theme-color]').content=c.bg;
}
// H: colors from number one's cover, a darkened average for the page and a brightened one for the numbers
let hFor='';
async function fromCover(){
  const r=filled()[0];if(!r?.thumb)return null;
  const im=new Image();im.crossOrigin='anonymous';im.src=r.thumb;await im.decode();
  const cv=document.createElement('canvas');cv.width=cv.height=8;const x=cv.getContext('2d');x.drawImage(im,0,0,8,8);
  const d=x.getImageData(0,0,8,8).data;let s=[0,0,0];for(let i=0;i<d.length;i+=4)for(let j=0;j<3;j++)s[j]+=d[i+j];
  const avg=s.map(v=>v/(d.length/4)),hex=a=>a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''),top=Math.max(...avg,1);
  return {bg:'#'+hex(avg.map(v=>v*.5)),fg:'#ffffff',n:'#'+hex(avg.map(v=>v*235/top))};
}
async function sampleCover(){
  const one=filled()[0],k=one?key(one):'';if(look.t!=='h'||hFor===k)return;hFor=k;
  if(!k){look={t:'a'};paint();drawBar();save();return}
  try{const c=await fromCover();if(c&&look.t==='h'&&hFor===k){Object.assign(look,c);paint();drawBar();save()}}catch{hFor='';if(look.t==='h'){look={t:'a'};paint();drawBar();save()}}
}
const suffix=()=>/s$/i.test(name.trim())?'’ top 10 of '+YEAR:'’s top 10 of '+YEAR;
const whose=()=>name.trim()?`${name.trim()}${suffix()}`:`Your top 10 of ${YEAR}`;
const cover=r=>`<span class="cv">${r.thumb?`<img src="${esc(r.thumb)}" alt="" draggable="false"${r.fallback?` data-fallback="${esc(r.fallback)}"`:''}>`:''}</span>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify({name,slots:slots.map(r=>r?.src==='w'?null:r),look,from}))}catch{}}
// the link: the list in its address, gaps closed up, opened on the crate page, ranked
function link(){const u=new URL(V.link(name,filled().filter(r=>r.src!=='w'),'/2026')),c=colors();
  if(look.t!=='a')u.searchParams.set('t',look.t);
  if(!SC[look.t]){u.searchParams.set('bg',c.bg.slice(1));u.searchParams.set('fg',c.fg.slice(1));if(c.n!==c.fg)u.searchParams.set('n',c.n.slice(1))}
  return u.href}

// ---- the ten places ----
const ls=$('#ls'),fd=$('#found');let found=[],busy=new Set();
function draw(focus){
  const q=$('#q'),had=q?.value||'',was=document.activeElement===q;
  if(at>=0&&slots[at])at=-1;
  ls.innerHTML=slots.map((r,i)=>{
    if(r)return `<li class="row f${r.src==='w'?' w':''}" data-i="${i}" tabindex="0" aria-label="${i+1}. ${esc(r.title)} by ${esc(r.artist)}. Up and down arrows move it"><span class="n" aria-hidden="true">${i+1}</span>${cover(r)}<span class="tx" aria-hidden="true"><b>${esc(r.title)}</b><span>${esc(r.artist)}</span></span><button class="ib x" type="button" data-x aria-label="Take out ${esc(r.title)}">${IC.x}</button></li>`;
    if(i===at)return `<li class="row q" data-e="${i}"><span class="n">${i+1}</span><span class="cv qi" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></svg></span><div class="fld"><label class="sr" for="q">Find a record for number ${i+1}</label><input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Artist or album"></div></li>`;
    return `<li class="row e" data-e="${i}" role="button" tabindex="0" aria-label="Add number ${i+1}"><span class="n" aria-hidden="true">${i+1}</span></li>`;
  }).join('');
  const nq=$('#q');if(nq){nq.value=had;if(focus||was)nq.focus({preventScroll:!focus})}
  showFound();
  document.body.classList.toggle('none',!filled().length);document.body.classList.toggle('searching',at>=0);
  drawBar();save();sampleCover();drawFrom();
}
// a pressing without its own cover borrows the album's; with neither, the square stays blank
document.addEventListener('error',e=>{const i=e.target;if(i.dataset?.fallback){i.src=i.dataset.fallback;delete i.dataset.fallback}else if(i.tagName==='IMG')i.style.visibility='hidden'},true);

// ---- search: only albums out this year, the artist's own first ----
let timer=0,seq=0,status='',shown=[],suggestions=[];const cache={};
// suggestions: the critics' list for the year (AOTY) in its order, then Spotify's own albums out this year; asked for once
fetch(`/api/spotify?new=1&year=${YEAR}`).then(r=>r.ok?r.json():null).then(d=>{suggestions=(d?.results||[]).map(r=>({...r,src:'s'}));showFound()}).catch(()=>{});
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function showFound(){
  const q=$('#q'),row=q?.closest('.row');
  if(!row){fd.innerHTML='';return}
  const typed=q.value.trim().length>=3;
  // before you type: this year's new albums, the ones not in your list yet
  shown=typed?found:suggestions.filter(r=>!slots.some(x=>x&&key(x)===key(r)));
  if(!typed&&q.value.trim()){fd.innerHTML='';return}
  fd.style.top=(row.offsetTop+row.offsetHeight+6)+'px';
  if(typed&&status){fd.innerHTML=`<li class="st">${esc(status)}</li>`;return}
  fitFound();
  fd.innerHTML=shown.slice(0,typed?8:25).map((r,i)=>{const k=key(r),on=slots.some(x=>x&&key(x)===k);
    return `<li><button class="hit" type="button" data-f="${i}"${on?' aria-disabled="true"':''}${busy.has(k)?' aria-busy="true"':''}>${cover(r)}<span class="tx"><b>${esc(r.title)}</b><span>${esc(r.artist)}${r.year?' · '+esc(r.year):''}</span></span>${on?`<span class="add">${IC.check}</span>`:''}</button></li>`}).join('');
}
// "Bad Bunny" or "rosalia lux": the artist's own records first (newest first), then this year's, then the rest as they came
function rank(res,term){
  const want=fold(term),own=r=>{const a=fold(r.artist);return a&&(want===a||want.startsWith(a+' '))?0:1},yr=r=>+String(r.year||'').slice(0,4)||0;
  return res.map((r,i)=>({r,i,o:own(r),y:yr(r)})).sort((a,b)=>a.o-b.o||(a.o?(b.y===+YEAR)-(a.y===+YEAR):b.y-a.y)||a.i-b.i).map(x=>x.r);
}
async function find(term){
  const id=++seq;
  if(term.length<3){status='';found=[];showFound();return}
  if(cache[term]){status='';found=cache[term];showFound();return}
  try{
    const res=await V.search(term,{albums:true,year:YEAR});if(id!==seq)return;
    found=cache[term]=rank(res,term);
    status=found.length?'':'Nothing from 2026 by that name. Try the artist or the album.';showFound();
  }catch{if(id===seq){status='Search isn’t answering. Try again in a minute.';showFound()}}
}
// the last search's results go as soon as you type, so a quick tap can't add the wrong record
ls.addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(timer);seq++;const v=e.target.value.trim();
  found=[];status=v.length>=3&&!cache[v]?'Searching…':'';showFound();timer=setTimeout(()=>find(v),250)});
ls.addEventListener('keydown',e=>{
  if(e.target.id==='q'){if(e.key==='Enter'){e.preventDefault();$('#found .hit:not([aria-disabled])')?.click()}else if(e.key==='Escape'){if(e.target.value){e.target.value='';found=[];status='';showFound()}else{const i=at;closeSearch();ls.querySelector(`[data-e="${i}"]`)?.focus()}}return}
  // an empty place: Enter or space opens the search there
  const em=e.target.closest('.row.e');if(em&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openAt(+em.dataset.e);return}
  // a filled place: up and down move it, one place at a time (into a gap, or trading with the record there)
  const f=e.target.closest('.row.f');if(!f||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
  const i=+f.dataset.i,j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=TEN)return;[slots[i],slots[j]]=[slots[j],slots[i]];if(at===j)at=i;draw();ls.querySelector(`[data-i="${j}"]`).focus()});
// the search closes on Esc or a press anywhere else
function closeSearch(){if(at<0)return;at=-1;found=[];status='';const q=$('#q');if(q)q.value='';draw()}
document.addEventListener('pointerdown',e=>{if(at>=0&&!e.target.closest('.row.q,#found,.row.e'))closeSearch()});
function openAt(i){if(slots[i])return;at=i;found=[];status='';const q=$('#q');if(q)q.value='';draw(true);lift()}
// on a phone the keyboard takes half the screen: the open place goes to the top, and its results fill what's left above the keyboard
const phone=matchMedia('(max-width:700px)');
function lift(){if(!phone.matches)return;const row=$('#q')?.closest('.row');if(!row)return;
  const y=row.getBoundingClientRect().top-(visualViewport?.offsetTop||0)-12;if(Math.abs(y)>4)scrollBy({top:y,behavior:reduce?'auto':'smooth'})}
function fitFound(){if(at<0)return;const bottom=visualViewport?visualViewport.offsetTop+visualViewport.height:innerHeight;
  fd.style.maxHeight=phone.matches?Math.max(150,bottom-fd.getBoundingClientRect().top-10)+'px':''}
// the keyboard coming up (or going) changes the visual viewport: place the row again once it settles
let liftT=0;visualViewport?.addEventListener('resize',()=>{fitFound();clearTimeout(liftT);liftT=setTimeout(()=>{lift();setTimeout(fitFound,350)},120)});
visualViewport?.addEventListener('scroll',fitFound);addEventListener('scroll',fitFound,{passive:true});
const under=()=>document.body.classList.toggle('under',scrollY>4);addEventListener('scroll',under,{passive:true});under();
fd.addEventListener('click',async e=>{
  const h=e.target.closest('.hit');if(!h||h.getAttribute('aria-disabled')==='true')return;
  let r=shown[+h.dataset.f];const k=key(r),i=at;if(busy.has(k)||i<0||slots[i])return;
  if(r.group){busy.add(k);showFound();try{r=await V.pick(r)}catch{busy.delete(k);status='';showFound();return}busy.delete(k)}
  if(slots.some(x=>x&&key(x)===k)||slots[i])return;
  slots[i]=r;found=[];status='';const q=$('#q');if(q)q.value='';hush();
  // done: the search closes, and every place is quiet again
  at=-1;draw();
  const li=ls.querySelector(`[data-i="${i}"]`);if(li)li.animate(reduce?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:200,easing:EASE});
});
ls.addEventListener('click',e=>{
  if(justDragged)return;
  const x=e.target.closest('[data-x]');if(x){takeOut(+x.closest('[data-i]').dataset.i);return}
  const em=e.target.closest('.row.e');if(em){openAt(+em.dataset.e);return}
  if(e.target.closest('.row.q'))$('#q')?.focus();
});
// × takes one out, with Undo for a few seconds; its place stays empty
const note=$('#note');let undo=null;
function takeOut(i){
  const r=slots[i];slots[i]=null;draw();
  ls.querySelector(`[data-e="${i}"]`)?.focus({preventScroll:true});
  tell(`Took out ${r.title}`,()=>{if(slots.some(x=>x&&key(x)===key(r)))return;const j=slots[i]?firstGap(i):i;if(j<0)return;slots[j]=r;draw()});
}
// the note says what just changed, with Undo, and stays until the next change
// the note goes by itself: 4s when it holds an Undo, 2s when it doesn't (the crate's is 1.8s); a pointer resting on it holds it; × or a tap on the words lets it go at once
let noteT=0;const noteFor=()=>{clearTimeout(noteT);noteT=setTimeout(hush,undo?4000:2000)};
function tell(t,fn){undo=fn;note.firstElementChild.textContent=t;note.querySelector('.nu').hidden=!fn;note.classList.remove('on');void note.offsetWidth;note.classList.add('on');noteFor()}
const hush=()=>{clearTimeout(noteT);undo=null;note.classList.remove('on')};
note.querySelector('.nu').addEventListener('click',()=>{if(!undo)return;const fn=undo;hush();fn()});
note.querySelector('.nx').addEventListener('click',hush);
note.firstElementChild.addEventListener('click',hush);
note.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')clearTimeout(noteT)});
note.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&note.classList.contains('on'))noteFor()});
// Start over: the whole list goes, with Undo
$('#rs').addEventListener('click',()=>{if(!filled().length)return;const was={slots:slots.slice(),from};fillSeq++;slots=Array(TEN).fill(null);from='';at=-1;draw();
  tell('Cleared your list',()=>{slots=was.slots;from=was.from;draw()})});

// ---- Start from a list: a critic's ten fill the places at once (each found by name, so it opens like one you searched for), with Undo ----
// The lists are data, /vinyl/lists-2026.json: add a publication's list there the day it comes out
let LISTS=[],fillSeq=0;
const fromEl=$('#from'),fromB=$('#fromB'),fromM=$('#fromM');
// lists to come, shown greyed until they're in the data file
const SOON=['NPR','NYT','Pitchfork','NME'];
function drawFrom(){
  fromEl.hidden=!LISTS.length; // always there: picking a list fills the ten in its order, with Undo
  if(fromEl.hidden)menuFrom(false);
  const have=new Set(LISTS.map(l=>l.name.toLowerCase()));
  fromM.innerHTML=LISTS.map(l=>`<button type="button" role="menuitemradio" data-l="${esc(l.id)}" aria-checked="${from===l.id}" aria-label="${esc(l.title)}">${esc(l.name)}</button>`).join('')
    +SOON.filter(n=>!have.has(n.toLowerCase())).map(n=>`<button type="button" role="menuitem" aria-disabled="true">${n}</button>`).join('');
}
function menuFrom(on){fromM.hidden=!on;fromB.setAttribute('aria-expanded',on);if(on)fromM.querySelector('[data-l]')?.focus({preventScroll:true})}
fromB.addEventListener('click',()=>menuFrom(fromM.hidden));
document.addEventListener('pointerdown',e=>{if(!fromM.hidden&&!fromEl.contains(e.target))menuFrom(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!fromM.hidden){menuFrom(false);fromB.focus({preventScroll:true})}});
// the best match for a critic's line: same artist and the same title (or one starting with it), else the same artist's first album
// The suggestions already hold the critics' list matched on the server, so most places fill at once from them
async function findOne(c){
  const a=fold(c.artist),t=fold(c.title);
  const same=r=>{const x=fold(r.artist);return x===a||x.startsWith(a+' ')||a.startsWith(x+' ')};
  const pick=res=>res.find(r=>same(r)&&(fold(r.title)===t||fold(r.title).startsWith(t+' ')))||res.find(r=>same(r)&&t.startsWith(fold(r.title)+' '));
  const had=pick(suggestions);if(had)return had;
  const res=await V.search(`${c.artist} ${c.title}`.replace(/[’‘]/g,"'"),{albums:true,year:YEAR}).catch(()=>[]);
  let r=pick(res);
  if(r?.group)r=await V.pick(r).catch(()=>null);
  return r||null;
}
async function fillFrom(id){
  const l=LISTS.find(l=>l.id===id);if(!l)return;
  const was={slots:slots.slice(),from,at},seq=++fillSeq;
  from=id;slots=Array.from({length:TEN},(_,i)=>{const c=l.records[i];return c?{src:'w',id:id+i,title:c.title,artist:c.artist}:null});
  at=-1;drawFrom();draw();
  tell(`Filled from ${l.name}`,()=>{fillSeq++;slots=was.slots;from=was.from;at=was.at;drawFrom();draw()});
  // three at a time; each place takes its record when it's found, unless it was moved or taken out meanwhile
  const todo=slots.map((r,i)=>r&&{r,c:l.records[i]}).filter(Boolean);
  const work=async()=>{for(let x;(x=todo.shift());){const r=await findOne(x.c);if(seq!==fillSeq)return;
    const i=slots.indexOf(x.r);if(i<0)continue;
    // not found under that name (or already on the list): the place is left empty, to search for by hand
    if(!r||slots.some(y=>y&&y!==x.r&&key(y)===key(r))){slots[i]=null;draw();continue}
    slots[i]=r;draw()}};
  await Promise.all([work(),work(),work()]);
}
fromM.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b){menuFrom(false);fillFrom(b.dataset.l)}});
fetch('/vinyl/lists-'+YEAR+'.json').then(r=>r.ok?r.json():null).then(d=>{LISTS=(d?.lists||[]).filter(l=>l.id&&l.name&&l.records?.length);drawFrom()}).catch(()=>{});

// ---- drag: from anywhere on a filled row. A mouse just presses and moves; a finger holds still for a beat first ----
// The row follows exactly, and the other places (empty ones too) part under it as it passes, so the list is always in its
// after-the-drop order. Letting go settles it into the open place.
const reorder=(s,i,t)=>{s=s.slice();const [r]=s.splice(i,1);s.splice(t,0,r);return s};
let dragging=false,justDragged=false;
function startDrag(li,pid,y0){
  const i=+li.dataset.i,rows=[...ls.children],tops=rows.map(r=>r.offsetTop);let t=i;dragging=true;
  const order=slots.map((_,k)=>k); // which row sits in each place
  li.classList.add('drag');ls.classList.add('dragging');fd.innerHTML='';
  const mv=ev=>{if(ev.pointerId!==pid)return;
    const y=Math.max(tops[0]-24,Math.min(tops[TEN-1]+24,tops[i]+ev.clientY-y0));li.style.transform=`translateY(${y-tops[i]}px)`;
    const nt=tops.reduce((b,v,k)=>Math.abs(v-y)<Math.abs(tops[b]-y)?k:b,0);if(nt===t)return;t=nt;
    reorder(order,i,t).forEach((k,p)=>{const r=rows[k];r.querySelector('.n').textContent=p+1;if(k!==i)r.style.transform=p!==k?`translateY(${tops[p]-tops[k]}px)`:''})};
  const up=ev=>{if(ev.pointerId!==pid)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);dragging=false;
    justDragged=true;setTimeout(()=>justDragged=false,0);
    if(ev.type==='pointercancel')t=i;
    // settle: glide from where it was let go into its place, then lay the list out for real
    li.style.transform=`translateY(${tops[t]-tops[i]}px)`;li.classList.add('land');
    setTimeout(()=>{const was=at;if(t!==i)hush();slots=reorder(slots,i,t);if(was>=0)at=reorder(order,i,t).indexOf(was);if(at>=0&&slots[at])at=-1;
      ls.classList.remove('dragging');draw()},reduce?0:220)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
ls.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const li=e.target.closest('.row.f');if(!li||e.target.closest('button'))return;
  const y0=e.clientY,x0=e.clientX,pid=e.pointerId;let t=0;
  const off=()=>{clearTimeout(t);removeEventListener('pointermove',watch);removeEventListener('pointerup',off);removeEventListener('pointercancel',off)};
  const watch=ev=>{if(ev.pointerId!==pid)return;const d=Math.hypot(ev.clientX-x0,ev.clientY-y0);
    if(e.pointerType==='touch'){if(d>8)off()}else if(d>4){off();startDrag(li,pid,y0)}};
  if(e.pointerType==='touch')t=setTimeout(()=>{off();navigator.vibrate?.(6);startDrag(li,pid,y0)},180);
  else e.preventDefault(); // no text selection while pressing
  addEventListener('pointermove',watch);addEventListener('pointerup',off);addEventListener('pointercancel',off);
});
// while a row is held, the page doesn't scroll under it
addEventListener('touchmove',e=>{if(dragging)e.preventDefault()},{passive:false});
ls.addEventListener('contextmenu',e=>{if(e.target.closest('.row.f'))e.preventDefault()});

// ---- the name, typed into the title; colors and the link in a bar at the bottom ----
const nm=$('#nm'),mir=$('.mir');
const drawName=()=>{nm.value=name;mir.textContent=name||nm.placeholder;$('#suf').textContent=name.trim()?suffix():'’s top 10 of '+YEAR;document.title=whose()};
const lookName=()=>SC[look.t]?.[0]||(look.t==='h'?'From your number one’s cover':'Your own');
const one=$('#one'),cols=$('#cols'),lays=[...one.querySelectorAll('.lay')];
// the tooltip (icons, color dots, Done, the check): shown after a beat on the first one, then it glides to each next one at once
{const dock=one.closest('.dock'),tip=document.createElement('div');tip.className='tip';tip.setAttribute('aria-hidden','true');dock.append(tip);
  let on=false,wait=0;
  const at=b=>{const r=b.getBoundingClientRect(),d=dock.getBoundingClientRect();tip.textContent=b.getAttribute('aria-label');tip.style.setProperty('--x',(r.left+r.width/2-d.left)+'px')};
  const S='.icons .fb,.cols .dot,.cols .x,.ok';
  const show=b=>{if(!b.closest('.lay.on')||b.getAttribute('aria-disabled')==='true'){hide();return}clearTimeout(wait);
    if(on){at(b);return}wait=setTimeout(()=>{tip.style.transition='none';at(b);void tip.offsetWidth;tip.style.transition='';tip.classList.add('on');on=true},400)};
  const hide=()=>{clearTimeout(wait);tip.classList.remove('on');on=false};
  // the gaps between swatches and icons keep it up, so it glides from one to the next; it goes only when the pointer leaves the bar
  one.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest(S);if(b)show(b);else if(!e.target.closest('.lay.on'))hide()});
  one.addEventListener('pointerleave',hide);one.addEventListener('pointerdown',hide);
  one.addEventListener('focusin',e=>{const b=e.target.closest(S);if(b&&b.matches(':focus-visible'))show(b)});
  one.addEventListener('focusout',hide);
  window.hideTip=hide}
let shape='icons',doneT=0;
// the bar takes the width of what it shows, so it grows and shrinks between them
const fit=()=>{const l=one.querySelector('.lay.on');if(!l)return;
  // the colors scroll inside the bar when there are more than fit, so their full width is the row of dots, the × and the padding around them
  const w=l===cols?cols.querySelector('.sc').scrollWidth-8+13+8+40+6:l.scrollWidth;one.style.width=Math.min(w+2,innerWidth-24)+'px'};
function morph(k){shape=k;window.hideTip?.();clearTimeout(doneT);lays.forEach(l=>l.classList.toggle('on',l.classList.contains(k)));
  document.body.classList.toggle('colors',k==='cols'||k==='cust');one.querySelector('[data-k=col]').setAttribute('aria-expanded',k==='cols'||k==='cust');fit()}
function drawBar(){
  const c=colors(),first=filled()[0],n=filled().length;
  one.querySelectorAll('[data-k=copy],[data-k=share]').forEach(b=>b.setAttribute('aria-disabled',!n));
  $('#rs').setAttribute('aria-disabled',!n);
  const f=document.activeElement;if(f&&cols.contains(f)&&f.matches('.pc input'))return; // don't redraw a color picker while it's open
  cols.setAttribute('aria-label',`Colors: ${lookName()}`);
  cols.innerHTML=`<div class="sc">${SHOW.map(k=>{const [nm,bg]=SC[k];return `<button class="dot" type="button" data-t="${k}" aria-label="${nm}" aria-pressed="${look.t===k}" style="background-color:${bg}"></button>`}).join('')}<button class="dot mine" type="button" data-t="x" aria-label="Your own colors" aria-pressed="${look.t==='x'}"></button></div><button class="x" type="button" data-k="close" aria-label="Done">${IC.x}</button>`;
  if(f?.dataset?.t)cols.querySelector(`.dot[data-t="${f.dataset.t}"]`)?.focus({preventScroll:true});
  if(shape==='cols')fit();
}
nm.addEventListener('input',()=>{name=nm.value;drawName();save()});
nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nm.blur()}});
async function copied(){try{await navigator.clipboard.writeText(link())}catch{prompt('Copy this link',link());return}morph('done');doneT=setTimeout(()=>morph('icons'),1600)}
one.addEventListener('click',async e=>{
  const b=e.target.closest('[data-k]'),k=b?.dataset.k;
  if(k==='col'){morph('cols');cols.querySelector('.dot[aria-pressed=true]')?.focus({preventScroll:true});return}
  if(k==='close'){morph('icons');one.querySelector('[data-k=col]').focus({preventScroll:true});return}
  if(k==='copy'){copied();return}
  if(k==='share'){if(navigator.share){try{await navigator.share({title:whose(),url:link()})}catch{}}else copied();return}
  // a color dot; your own opens text and page pickers, starting from the colors on screen
  const d=e.target.closest('.dot');
  if(d){const t=d.dataset.t;if(t==='x'){openCust();return}if(t===look.t)return;look={t};hFor='';d.focus({preventScroll:true});paint();drawBar();save()}
  if(k==='apply'){custWas=null;save();drawBar();morph('icons');one.querySelector('[data-k=col]').focus({preventScroll:true});return}
});
// your own colors: just text and page, starting from what's on screen, shown as you pick; ✓ keeps them, a tap outside or Esc puts back what was there
const cust=$('#cust');let custWas=null;
function openCust(){const c=colors();custWas=JSON.parse(JSON.stringify(look));look={t:'x',bg:c.bg,fg:c.fg};paint();
  cust.innerHTML=`<label class="pc">Text<input type="color" data-c="fg" value="${c.fg}"></label><label class="pc">Page<input type="color" data-c="bg" value="${c.bg}"></label><button class="ok" type="button" data-k="apply" aria-label="Use these colors">${IC.check}</button>`;
  morph('cust');cust.querySelector('input').focus({preventScroll:true})}
function cancelCust(){if(custWas){look=custWas;custWas=null;paint();drawBar()}}
cust.addEventListener('input',e=>{const k=e.target.dataset?.c;if(!k)return;look[k]=e.target.value;delete look.n;paint()});
document.addEventListener('pointerdown',e=>{if((shape==='cols'||shape==='cust')&&!one.contains(e.target)){cancelCust();morph('icons')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(shape==='cols'||shape==='cust')){cancelCust();morph('icons');one.querySelector('[data-k=col]').focus({preventScroll:true})}});
addEventListener('resize',fit);
requestAnimationFrame(fit);document.fonts?.ready.then(fit);

// ---- start: a list in the address (to change it), else the one made on this device ----
(async()=>{
  const p=new URLSearchParams(location.search);let list=null;
  if(p.get('d')||p.get('m')||p.get('c')||p.get('s')){name=(p.get('by')||'').slice(0,40);try{list=(await V.fromAddress(p)).slice(0,TEN)}catch{}
    const t=p.get('t')||'a',bg=p.get('bg'),fg=p.get('fg'),n=p.get('n');
    look=SC[t]?{t}:(t==='h'||t==='x')&&HEX.test(bg||'')&&HEX.test(fg||'')?{t,bg:'#'+bg,fg:'#'+fg,...(HEX.test(n||'')?{n:'#'+n}:{})}:{t:'a'}}
  else try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){name=s.name||'';
    if(Array.isArray(s.slots))slots=Array.from({length:TEN},(_,i)=>s.slots[i]||null);else list=(s.list||[]).slice(0,TEN); // lists saved before gaps
    from=s.from||'';
    if(s.look&&(SC[s.look.t]||HEX.test((s.look.bg||'').slice(1))))look=s.look}}catch{}
  if(list)slots=Array.from({length:TEN},(_,i)=>list[i]||null);
  if(look.t==='h'){const one=filled()[0];hFor=one?key(one):''}
  at=-1;paint();drawName();draw();
})();
</script>
