/* A top 10 of 2026: ten numbered places. The first empty place is the search; a pick lands there and the search moves down.

.t{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:64px;max-width:1120px;margin:0 auto;padding:56px max(56px,env(safe-area-inset-right)) 120px max(56px,env(safe-area-inset-left));min-height:100vh;min-height:100dvh}

/* the list: ten places */

.row{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;background:var(--bg)}
.row+.row{border-top:1px solid #ffffff0d}
.n{flex:none;width:40px;font:500 var(--fs-5)/1 var(--mono);text-align:right;color:var(--rank-n,var(--fg))}
.row.e .n{color:var(--t4)}
.cv{flex:none;width:48px;height:48px;border-radius:var(--r-cover);overflow:hidden;background:var(--soft)}
.cv img{display:block;width:100%;height:100%;object-fit:cover}
.row.e .cv{background:none;border:1px dashed var(--line2)}
.tx{flex:1;min-width:0;display:grid;line-height:1.25}

.fld{flex:1;min-width:0;position:relative}
.fld svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--m);pointer-events:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

@media(hover:hover){.hit:hover{background:var(--hov)}}
.hit:focus-visible{outline:1px solid var(--ring);outline-offset:-1px}
.hit .cv{width:44px;height:44px}

.hit .add svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.hit[aria-disabled=true]{cursor:default}
.hit[aria-disabled=true] .add{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}

/* a name, then the link */
.who{display:grid;gap:6px}

.who input{display:block;width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--bg);font-size:var(--fs-4);outline:none;transition:border-color .2s}

.bottom{display:none}
/* colors: eight presets and your own; the list recolors as you pick, and the colors ride in the link */
.col{display:grid;gap:8px;width:100%}
.col .lab{font-size:var(--fs-2);color:var(--m)}
.dots{display:grid;grid-template-columns:repeat(9,minmax(0,36px));gap:6px}
.dot{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center;font:500 var(--fs-2)/1 var(--mono);transition:box-shadow .2s}

.pc input::-webkit-color-swatch-wrapper{padding:0}

@media(max-width:900px){
  .t{display:block;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px,env(safe-area-inset-left))}
  .side{position:static;gap:20px;margin-bottom:12px}
  .side .share{display:none}
  h1{font-size:var(--fs-5)}
  .n{width:30px}
  .found{margin-left:0}
  .bottom{display:flex;margin-top:28px;align-items:stretch}
  .bottom .btn{width:100%}
  .who input{font-size:var(--fs-4)}
}

<div class="t">
  <div class="side">
    <a class="home" href="/" aria-label="Crate Dig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>Crate Dig</a>
    <h1 id="h">Your top 10 of 2026</h1>
    <div class="share" id="shareA"></div>
  </div>
  <main>
    <ol class="ls" id="ls" aria-labelledby="h"></ol>
    <div class="share bottom" id="shareB"></div>
  </main>
</div>
<script src="/vinyl/visitor-crate.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const V=window.VisitorCrate,KEY='top10-2026',TEN=10,YEAR='2026';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=r=>r.src==='m'&&r.group?'g'+r.group:(r.src||'a')+r.id; // one per album
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IC={
  q:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  grip:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>',
  link:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
let list=[],name='',look={t:'a'};
// the presets: [name, background, text, numbers]. a is the crate's own colors
const SC={a:['Night','#121212','#ffffff','#ffffff'],b:['Paper','#f2ede2','#1f1b16','#1f1b16'],c:['Cobalt','#1f33c7','#ffffff','#ffffff'],d:['Tomato','#e2462c','#fff6ea','#fff6ea'],
  e:['Forest','#16382a','#f1e9d2','#d8b968'],f:['Bubblegum','#ffd3e3','#3a0d28','#c2185b'],g:['Mustard','#f1c232','#1c1708','#1c1708']};
const HEX=/^[0-9a-f]{6}$/i;
const colors=()=>SC[look.t]?{bg:SC[look.t][1],fg:SC[look.t][2],n:SC[look.t][3]}:{bg:look.bg,fg:look.fg,n:look.n||look.fg};
// every other token comes from the two colors, mixed; Night keeps tokens.css as it is
const TOK=['--bg','--fg','--on-fg','--t1','--t2','--m','--t3','--t4','--line','--line2','--soft','--sheet','--hov','--prs','--sel','--ring','--rank-n'];
function paint(){
  const st=document.documentElement.style,c=colors();
  if(look.t==='a'){TOK.forEach(k=>st.removeProperty(k))}
  else{const mix=p=>`color-mix(in srgb,${c.fg} ${p}%,${c.bg})`,a=p=>`color-mix(in srgb,${c.fg} ${p}%,transparent)`;
    Object.entries({'--bg':c.bg,'--fg':c.fg,'--on-fg':c.bg,'--t1':mix(85),'--t2':mix(68),'--m':mix(60),'--t3':mix(46),'--t4':mix(38),'--line':a(14),'--line2':a(22),'--soft':mix(9),'--sheet':mix(7),'--hov':a(6),'--prs':a(8),'--sel':a(12),'--ring':a(26),'--rank-n':c.n}).forEach(([k,v])=>st.setProperty(k,v))}
  document.querySelector('meta[name=theme-color]').content=c.bg;
}
// H: colors from number one's cover, a darkened average for the page and a brightened one for the numbers
let hFor='';
async function fromCover(){
  const r=list[0];if(!r?.thumb)return null;
  const im=new Image();im.crossOrigin='anonymous';im.src=r.thumb;await im.decode();
  const cv=document.createElement('canvas');cv.width=cv.height=8;const x=cv.getContext('2d');x.drawImage(im,0,0,8,8);
  const d=x.getImageData(0,0,8,8).data;let s=[0,0,0];for(let i=0;i<d.length;i+=4)for(let j=0;j<3;j++)s[j]+=d[i+j];
  const avg=s.map(v=>v/(d.length/4)),hex=a=>a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''),top=Math.max(...avg,1);
  return {bg:'#'+hex(avg.map(v=>v*.5)),fg:'#ffffff',n:'#'+hex(avg.map(v=>v*235/top))};
}
async function sampleCover(){
  const k=list[0]?key(list[0]):'';if(look.t!=='h'||hFor===k)return;hFor=k;
  try{const c=await fromCover();if(c&&look.t==='h'&&hFor===k){Object.assign(look,c);paint();drawShare();save()}}catch{hFor='';if(look.t==='h'){look={t:'a'};paint();drawShare();save()}}
}
const whose=()=>name.trim()?`${name.trim()}${/s$/i.test(name.trim())?'’':'’s'} top 10 of ${YEAR}`:`Your top 10 of ${YEAR}`;
const cover=r=>`<span class="cv">${r.thumb?`<img src="${esc(r.thumb)}" alt=""${r.fallback?` data-fallback="${esc(r.fallback)}"`:''}>`:''}</span>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify({name,list,look}))}catch{}}
// the link: the list in its address, opened on the crate page, ranked
function link(){const u=new URL(V.link(name,list,'/2026')),c=colors();
  if(look.t!=='a')u.searchParams.set('t',look.t);
  if(!SC[look.t]){u.searchParams.set('bg',c.bg.slice(1));u.searchParams.set('fg',c.fg.slice(1));if(c.n!==c.fg)u.searchParams.set('n',c.n.slice(1))}
  return u.href}

// ---- the ten places ----
const ls=$('#ls');let found=[],busy=new Set();
function draw(focus){
  const q=$('#q'),had=q?.value||'',was=document.activeElement===q;
  ls.innerHTML=Array.from({length:TEN},(_,i)=>{
    const r=list[i];
    if(r)return `<li class="row" data-i="${i}"><button class="ib x" type="button" data-x aria-label="Take out ${esc(r.title)}">${IC.x}</button><span class="n">${i+1}</span>${cover(r)}<span class="tx"><b>${esc(r.title)}</b><span>${esc(r.artist)}</span></span><button class="ib grip" type="button" aria-label="Move ${esc(r.title)}. Up and down arrows move it">${IC.grip}</button></li>`;
    if(i===list.length)return `<li class="row q"><span class="ib x" aria-hidden="true"></span><span class="n">${i+1}</span><div class="fld">${IC.q}<label class="sr" for="q">Find a record for number ${i+1}</label><input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Artist or album"></div></li><li class="found-w" style="list-style:none"><ul class="found" id="found" aria-live="polite"></ul></li>`;
    return `<li class="row e" data-e><span class="ib x" aria-hidden="true"></span><span class="n">${i+1}</span><span class="cv"></span><span class="tx"></span></li>`;
  }).join('');
  const nq=$('#q');if(nq){nq.value=had;if(focus||was)nq.focus({preventScroll:!focus})}
  if(nq&&had)showFound();
  $('#h').textContent=whose();document.title=whose();
  drawShare();save();sampleCover();
}
// a pressing without its own cover borrows the album's; with neither, the square stays blank
document.addEventListener('error',e=>{const i=e.target;if(i.dataset?.fallback){i.src=i.dataset.fallback;delete i.dataset.fallback}else if(i.tagName==='IMG')i.style.visibility='hidden'},true);

// ---- search: this year's records first ----
let timer=0,seq=0,status='';const cache={};
function showFound(){
  const f=$('#found');if(!f)return;
  if(status){f.innerHTML=`<li class="st">${esc(status)}</li>`;return}
  f.innerHTML=found.slice(0,6).map((r,i)=>{const k=key(r),on=list.some(x=>key(x)===k);
    return `<li><button class="hit" type="button" data-f="${i}"${on?' aria-disabled="true"':''}${busy.has(k)?' aria-busy="true"':''}>${cover(r)}<span class="tx"><b>${esc(r.title)}</b><span>${esc(r.artist)}${r.year?' · '+esc(r.year):''}</span></span><span class="add">${on?IC.check:IC.plus}</span></button></li>`}).join('');
}
async function find(term){
  const id=++seq;
  if(term.length<2){status='';found=[];showFound();return}
  if(cache[term]){status='';found=cache[term];showFound();return}
  status='Searching…';showFound();
  try{
    const res=await V.search(term);if(id!==seq)return;
    const ys=r=>String(r.year||'').startsWith(YEAR)?0:1;
    found=cache[term]=res.map((r,i)=>[r,i]).sort((a,b)=>ys(a[0])-ys(b[0])||a[1]-b[1]).map(x=>x[0]);
    status=found.length?'':'Nothing found. Try the artist’s name.';showFound();
  }catch{if(id===seq){status='Search isn’t answering. Try again in a minute.';showFound()}}
}
ls.addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(timer);const v=e.target.value.trim();timer=setTimeout(()=>find(v),400)});
ls.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'){e.preventDefault();const b=$('#found .hit:not([aria-disabled])');if(b)b.click()}});
ls.addEventListener('click',async e=>{
  const h=e.target.closest('.hit');
  if(h){if(h.getAttribute('aria-disabled')==='true')return;let r=found[+h.dataset.f];const k=key(r);if(busy.has(k)||list.length>=TEN)return;
    if(r.group){busy.add(k);showFound();try{r=await V.pick(r)}catch{busy.delete(k);status='';showFound();return}busy.delete(k)}
    if(list.some(x=>key(x)===k)||list.length>=TEN)return;
    list.push(r);found=[];status='';const q=$('#q');if(q)q.value='';draw(true);
    const li=ls.children[list.length-1];if(li&&!reduce)li.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});
    return}
  const x=e.target.closest('[data-x]');
  if(x){const i=+x.closest('[data-i]').dataset.i;flip(()=>{list.splice(i,1);draw()});const n=ls.querySelector(`[data-i="${Math.min(i,list.length-1)}"] [data-x]`);(n||$('#q'))?.focus({preventScroll:true});return}
  if(e.target.closest('[data-e]'))$('#q')?.focus();
});
// the rows that move slide to their new places
function flip(fn){
  const was=new Map([...ls.querySelectorAll('[data-i]')].map(li=>[li.querySelector('.tx b').textContent,li.getBoundingClientRect().top]));fn();
  if(reduce)return;ls.querySelectorAll('[data-i]').forEach(li=>{const a=was.get(li.querySelector('.tx b').textContent);if(a==null)return;const d=a-li.getBoundingClientRect().top;if(d)li.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'})});
}
const move=(from,to)=>{if(from===to)return;const [r]=list.splice(from,1);list.splice(to,0,r)};
// drag by the lines; the others make room as it passes
ls.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g||e.button>0)return;e.preventDefault();
  const li=g.closest('[data-i]'),i=+li.dataset.i,rows=[...ls.querySelectorAll('[data-i]')],h=li.getBoundingClientRect().height,y0=e.clientY;let to=i;
  li.classList.add('drag');ls.classList.add('dragging');g.setPointerCapture(e.pointerId);
  const mv=ev=>{const dy=ev.clientY-y0;li.style.transform=`translateY(${dy}px)`;to=Math.max(0,Math.min(rows.length-1,i+Math.round(dy/h)));
    rows.forEach((r,j)=>{if(r!==li)r.style.transform=j>i&&j<=to?`translateY(${-h}px)`:j<i&&j>=to?`translateY(${h}px)`:''})};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
    const top=li.getBoundingClientRect().top;ls.classList.remove('dragging');rows.forEach(r=>r.style.transform='');move(i,to);draw();
    const now=ls.children[to];if(!reduce&&now){now.classList.add('drag');now.animate([{transform:`translateY(${top-now.getBoundingClientRect().top}px)`},{transform:'none'}],{duration:260,easing:'cubic-bezier(.22,1,.36,1)'}).onfinish=()=>now.classList.remove('drag')}
    now?.querySelector('.grip')?.focus({preventScroll:true});now?.querySelector('.grip')?.blur()};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});
// or with the keyboard: up and down on the lines
ls.addEventListener('keydown',e=>{const g=e.target.closest('.grip');if(!g||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
  const i=+g.closest('[data-i]').dataset.i,j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=list.length)return;flip(()=>{move(i,j);draw()});ls.querySelector(`[data-i="${j}"] .grip`).focus()});

// ---- a name, then the link ----
const lookName=()=>SC[look.t]?.[0]||(look.t==='h'?'From your number one':'Your own');
function dotsHTML(){
  const c=colors(),one=!list[0];
  return `<div class="col"><span class="lab">Colors: ${lookName()}</span><div class="dots" role="group" aria-label="Colors">${Object.entries(SC).map(([k,[n,bg,fg]])=>`<button class="dot" type="button" data-t="${k}" aria-label="${n}" aria-pressed="${look.t===k}" style="background:${bg}"></button>`).join('')}<button class="dot" type="button" data-t="h" aria-label="From your number one" aria-pressed="${look.t==='h'}"${one?' aria-disabled="true"':''} style="background:${look.t==='h'?c.bg:'#3a3a3c'};color:${look.t==='h'?c.n:'#fff'}">1</button><button class="dot mine" type="button" data-t="x" aria-label="Your own" aria-pressed="${look.t==='x'}"></button></div>${look.t==='x'?`<div class="pcs"><label class="pc">Text<input type="color" data-c="fg" value="${c.fg}"></label><label class="pc">Background<input type="color" data-c="bg" value="${c.bg}"></label></div>`:''}</div>`;
}
function drawShare(){
  const n=list.length,html=`<div class="who" style="width:100%"><label for="nm-SIDE">Whose top 10 is it?</label><input id="nm-SIDE" class="nm" maxlength="40" autocomplete="given-name" placeholder="Your name" value="${esc(name)}"></div>${dotsHTML()}<button class="btn" type="button" data-copy aria-disabled="${!n}">${IC.link}<span>Copy link</span></button>`;
  for(const [id,s] of [['shareA','a'],['shareB','b']]){const el=$('#'+id),f=document.activeElement?.closest?.('#'+id);
    if(f&&document.activeElement.classList.contains('nm')){el.querySelector('[data-copy]').setAttribute('aria-disabled',!n);continue}
    el.innerHTML=html.replaceAll('SIDE',s)}
}
// a color dot; your own opens text and background pickers, starting from the colors on screen
document.addEventListener('click',e=>{const d=e.target.closest('.dot');if(!d||d.getAttribute('aria-disabled')==='true')return;const t=d.dataset.t;if(t===look.t&&t!=='x')return;
  const c=colors();look=t==='x'?{t,bg:c.bg,fg:c.fg}:t==='h'?{t,...c}:{t};hFor='';paint();drawShare();save();sampleCover();
  document.querySelectorAll(`.dot[data-t="${t}"]`).forEach(b=>{if(b.closest('.share').offsetParent)b.focus({preventScroll:true})})});
document.addEventListener('input',e=>{const k=e.target.dataset?.c;if(!k)return;look[k]=e.target.value;delete look.n;paint();save();
  document.querySelectorAll(`.pc input[data-c="${k}"]`).forEach(i=>{if(i!==e.target)i.value=e.target.value})});
document.addEventListener('input',e=>{if(!e.target.classList.contains('nm'))return;name=e.target.value;$('#h').textContent=whose();document.title=whose();
  document.querySelectorAll('.nm').forEach(n=>{if(n!==e.target)n.value=name});save()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b||b.getAttribute('aria-disabled')==='true')return;
  const s=b.querySelector('span');try{await navigator.clipboard.writeText(link());b.firstElementChild.outerHTML=IC.check;s.textContent='Copied'}catch{prompt('Copy this link',link())}
  setTimeout(()=>{if(b.isConnected){b.firstElementChild.outerHTML=IC.link;s.textContent='Copy link'}},1600)});

// ---- start: a list in the address (to change it), else the one made on this device ----
(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('d')||p.get('m')||p.get('c')){name=(p.get('by')||'').slice(0,40);try{list=(await V.fromAddress(p)).slice(0,TEN)}catch{}
    const t=p.get('t')||'a',bg=p.get('bg'),fg=p.get('fg'),n=p.get('n');
    look=SC[t]?{t}:(t==='h'||t==='x')&&HEX.test(bg||'')&&HEX.test(fg||'')?{t,bg:'#'+bg,fg:'#'+fg,...(HEX.test(n||'')?{n:'#'+n}:{})}:{t:'a'};
    if(look.t==='h')hFor=list[0]?key(list[0]):''}
  else try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){name=s.name||'';list=(s.list||[]).slice(0,TEN);if(s.look&&(SC[s.look.t]||HEX.test((s.look.bg||'').slice(1))))look=s.look;if(look.t==='h')hFor=list[0]?key(list[0]):''}}catch{}
  paint();draw();
})();
</script>
</body>
