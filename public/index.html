<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Records</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* A thought experiment after the Cosmos app: not its screens, its feel. One quiet dark wall of covers, white type,
   pills and circles that float over it, and a record that lifts out on a spring. Data comes from vinyl-prototype.html
   (RECORDS), vinyl/covers.json and Casey's saved edits. */
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 500;font-display:swap}
:root{--bg:#121212;--fg:#fff;--m:#8e8e93;--m2:#626267;--card:#1f1f21;--line:rgba(255,255,255,.12);--glass:rgba(30,30,32,.7);
  --spring:cubic-bezier(.2,1.25,.35,1);--ease:cubic-bezier(.25,.8,.3,1);--pad:16px;--gap:6px;--safe:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
html{background:var(--bg);color-scheme:dark}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:16px;line-height:1.35;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100svh;overflow-x:hidden}
body.held{overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0}
button,a{-webkit-tap-highlight-color:transparent;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}
svg{display:block}
.circ,.pill,.chip,.tile{transition:transform .5s var(--spring),background-color .2s,color .2s,opacity .2s}
.circ:active{transform:scale(.92)}
.pill:active,.chip:active,.tile:active{transform:scale(.97)}

/* head: a name, a count, and the ways in as a row of pills */
header{max-width:1400px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) var(--pad) 18px}
h1{font-size:clamp(34px,6vw,56px);font-weight:500;letter-spacing:-.025em;line-height:1}
h1 span{color:var(--m2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:22px calc(var(--pad) * -1) 0;padding:2px var(--pad) 4px;scroll-padding:var(--pad)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--line);font-size:15px;color:#cfcfd2;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--card)}
.chip[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.chip small{font-size:13px;opacity:.55}

/* the wall: covers of two sizes, packed tight */
main{max-width:1400px;margin:0 auto;padding:0 var(--pad) calc(130px + var(--safe))}
.wall{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-flow:row dense;gap:var(--gap)}
.tile{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--card);display:block}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s var(--ease)}
.tile img.in{opacity:1}
.tile .plain{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-weight:500;font-size:15px;line-height:1.15}
.tile .plain small{font-weight:400;opacity:.7;margin-top:2px}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:14px;line-height:1.2;opacity:0;transition:opacity .2s}
.tile .cap b{display:block;font-weight:500}.tile .cap span{color:#c9c9cc}
@media (hover:hover){.tile:hover .cap,.tile:focus-visible .cap{opacity:1}}
.none{color:var(--m);padding:60px 0;text-align:center;font-size:18px}

/* floating search and shuffle */
.float{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe));z-index:20;display:flex;justify-content:center;gap:10px;padding:0 var(--pad);pointer-events:none}
.float>*{pointer-events:auto}
.find{flex:0 1 460px;min-width:0;height:60px;border-radius:99px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.find svg{width:22px;height:22px;color:#a5a5aa;flex:none}
.find input{flex:1;min-width:0;height:100%;font-size:18px;outline:none}
.find input::placeholder{color:#7d7d82}
.find input::-webkit-search-cancel-button{display:none}
.find .clr{width:28px;height:28px;border-radius:50%;background:#6c6c71;display:grid;place-items:center;flex:none}
.find .clr svg{width:14px;height:14px;color:#1b1b1d}
.find .clr[hidden]{display:none}
.circ{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(0,0,0,.5);flex:none}
.circ:hover{background:#2a2a2d}
.circ svg{width:24px;height:24px}

/* a record, lifted out over the wall */
.open{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:max(80px,env(safe-area-inset-top)) var(--pad) calc(24px + var(--safe));overflow-y:auto;visibility:hidden}
.open.on{visibility:visible}
.open::before{content:'';position:fixed;inset:0;background:rgba(12,12,12,.78);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);opacity:0;transition:opacity .25s}
.open.on::before{opacity:1}
.open .x{position:fixed;top:max(16px,env(safe-area-inset-top));right:var(--pad);z-index:2}
.open .nav{position:fixed;top:50%;z-index:2;margin-top:-30px}
.open .prev{left:var(--pad)}.open .next{right:var(--pad)}
@media (max-width:899px){.open .nav{display:none}}
.rec{position:relative;width:min(100%,1040px);display:grid;gap:24px 56px;align-items:center;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.rec{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);padding:0 64px}}
.flip{display:block;width:100%;max-width:min(560px,62vh);margin:0 auto;perspective:1600px}
.flip .card{position:relative;aspect-ratio:1;transform-style:preserve-3d;transition:transform .8s var(--spring)}
.flip.back .card{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 40px 80px -24px rgba(0,0,0,.8)}
.flip .face img{width:100%;height:100%;object-fit:cover;display:block}
.flip .face.b{transform:rotateY(180deg)}
.flip .plain{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;font-size:28px;font-weight:500;line-height:1.1}
.flip .plain small{font-size:18px;font-weight:400;opacity:.7;margin-top:6px}
.info h2{font-size:clamp(28px,5vw,40px);font-weight:500;letter-spacing:-.02em;line-height:1.08}
.info .by{display:inline-block;font-size:19px;color:var(--m);margin-top:8px}
.info .by:hover{color:var(--fg)}
.info .meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px}
.info .meta .chip{height:36px;font-size:14px;padding:0 14px}
.info .meta span.chip{cursor:default}.info .meta span.chip:hover{background:none}
.play{position:relative;display:flex;gap:10px}
.pill{height:54px;padding:0 28px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:500;background:#fff;color:#111;flex:1;max-width:320px}
.pill:hover{background:#e7e7e8}
.pill svg{width:16px;height:16px}
.play .circ{width:54px;height:54px;box-shadow:none;background:none}
.play .circ:hover{background:var(--card)}
.menu{position:absolute;left:0;bottom:64px;min-width:240px;padding:8px;border-radius:24px;background:#232325;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.6);transform-origin:bottom left;transform:scale(.92);opacity:0;visibility:hidden;transition:transform .45s var(--spring),opacity .15s,visibility 0s .15s}
.menu.on{transform:none;opacity:1;visibility:visible;transition:transform .45s var(--spring),opacity .15s}
.menu a{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 16px;border-radius:16px;font-size:16px}
.menu a:hover,.menu a:focus-visible{background:#303033}
.menu small{color:var(--m);font-size:13px}
.turn{color:var(--m);font-size:14px;text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}}
@media (min-width:700px){:root{--pad:28px;--gap:8px}}
</style>
</head>
<body>
<header>
  <h1>Records <span id="count"></span></h1>
  <div class="chips" id="chips" role="group" aria-label="Show"></div>
</header>
<main><div class="wall" id="wall"></div><p class="none" id="none" hidden>Nothing in the crate for that yet</p></main>
<div class="float">
  <label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.6-4.6"/></svg><span class="sr">Search the records</span><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Artist, title, label or year"><button class="clr" id="clr" aria-label="Clear the search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></label>
  <button class="circ" id="shuffle" aria-label="Open a record at random"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 3.8C14.3 15 15.5 17 17.5 17H21M18 14l3 3-3 3M3 17h3.5c1.4 0 2.4-.6 3.2-1.5M21 7h-3.5c-1.4 0-2.4.6-3.2 1.5M18 4l3 3-3 3"/></svg></button>
</div>
<div class="open" id="open" role="dialog" aria-modal="true" aria-label="Record">
  <button class="circ x" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button class="circ nav prev" id="prev" aria-label="Previous record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="circ nav next" id="next" aria-label="Next record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  <div class="rec" id="rec"></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NEW_TAB='<span class="sr"> (opens in a new tab)</span>';
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.6v14.8c0 .8.9 1.3 1.6.8l11.3-7.4a1 1 0 0 0 0-1.6L8.6 3.8C7.9 3.3 7 3.8 7 4.6Z"/></svg>';
const DOTS='<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></g></svg>';
const SERVICES=[['spotify','Spotify'],['appleMusic','Apple Music'],['youtubeMusic','YouTube Music'],['tidal','Tidal'],['amazonMusic','Amazon Music'],['deezer','Deezer']];
const PICK='records-play'; // shared with vinyl-prototype.html: the service a visitor played on last
const picked=()=>{try{return localStorage.getItem(PICK)}catch{return null}};
const img=f=>/^(https?:|\/)/.test(f)?f:'vinyl/'+f;
const sortKey=r=>(r.sortAs||r.artist).replace(/^the\s+/i,'').toLowerCase();
const ink=hex=>{const n=parseInt((hex||'#333').slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255>.6?'#111':'#fff'};
const slugOf=r=>(r.artist+' '+r.title).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');

let R=[],SETS=[],set='all',q='',shown=[],cur=-1;

// ---- data: the crate's own list and covers, plus Casey's saved edits when the server has them ----
async function load(){
  const [src,meta,ed]=await Promise.all([
    fetch('vinyl-prototype.html').then(r=>r.text()),
    fetch('vinyl/covers.json').then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch('/api/crate').then(r=>r.ok?r.json():null).catch(()=>null)]);
  const m=src.match(/const RECORDS=\[([\s\S]*?)\]\.map\(/);
  let recs=(m?Function('return ['+m[1]+']')():[]).map(r=>({...meta[slugOf(r)],...r,slug:slugOf(r)}));
  const E=ed&&ed.edits;
  if(E){
    recs=recs.concat((E.added||[]).map(a=>({...a})));
    const out=new Set(E.removed||[]);recs=recs.filter(r=>!out.has(r.slug));
    for(const r of recs){const p=(E.patch||{})[r.slug];if(!p)continue;if(p.front)r.front=p.front;if(p.back)r.back=p.back;if(p.bg)r.spine=p.bg}
  }
  recs.forEach(r=>{r.links={...r.links};if(r.spotify)r.links.spotify='https://open.spotify.com/album/'+r.spotify;if(r.apple)r.links.appleMusic=r.apple});
  R=recs.sort((a,b)=>sortKey(a).localeCompare(sortKey(b))||(a.year||0)-(b.year||0));
  // the ways in: what records share, as pills
  const add=(id,label,test)=>{const n=R.filter(test).length;if(n>=2)SETS.push({id,label,test,n})};
  add('all','All',()=>true);
  for(const d of [...new Set(R.map(r=>r.year&&Math.floor(r.year/10)*10).filter(Boolean))].sort())add('d'+d,d+'s',r=>r.year>=d&&r.year<d+10);
  add('live','Live',r=>/\blive\b|at newport/i.test(r.title));
  add('hits','Greatest hits',r=>/greatest|best of/i.test(r.title));
  const many=[...R.reduce((m,r)=>m.set(r.artist,(m.get(r.artist)||0)+1),new Map())].filter(([a,n])=>n>=3&&!/^various/i.test(a));
  for(const [a] of many)add('a:'+a,a,r=>r.artist===a);
}

// ---- the wall ----
const cols=()=>innerWidth>=1200?6:innerWidth>=900?5:innerWidth>=600?4:3;
// every so often a record takes up four spaces, on a steady rhythm so the wall feels laid out, not random
const big=i=>i%9===0||i%9===5;
function face(r){
  if(r.front)return`<img src="${esc(img(r.front))}" alt="" loading="lazy" decoding="async" onload="this.classList.add('in')">`;
  const bg=r.spine||'#2c2c2e';return`<div class="plain" style="background:${bg};color:${ink(bg)}">${esc(r.title)}<small>${esc(r.artist)}</small></div>`;
}
const nodes=new Map();
function tile(r){
  let n=nodes.get(r.slug);if(n)return n;
  n=document.createElement('a');n.className='tile';n.href='#'+r.slug;n.dataset.slug=r.slug;
  n.innerHTML=`${face(r)}<span class="cap"><b>${esc(r.title)}</b><span>${esc(r.artist)}</span></span>`;
  n.setAttribute('aria-label',`${r.title} by ${r.artist}`);
  nodes.set(r.slug,n);return n;
}
function render(animate){
  const s=SETS.find(x=>x.id===set)||SETS[0],t=q.trim().toLowerCase();
  shown=R.filter(s.test).filter(r=>!t||[r.artist,r.title,r.label,r.year,r.format].some(v=>String(v??'').toLowerCase().includes(t)));
  const wall=$('#wall'),before=new Map();
  if(animate&&!reduce.matches)for(const [k,n] of nodes)if(n.isConnected)before.set(k,n.getBoundingClientRect());
  wall.style.setProperty('--cols',cols());
  // a short list stays all one size; a long one gets the big covers
  const frag=document.createDocumentFragment();
  shown.forEach((r,i)=>{const n=tile(r);n.classList.toggle('big',shown.length>6&&big(i));frag.append(n)});
  wall.replaceChildren(frag);
  $('#none').hidden=!!shown.length;
  $('#count').textContent=shown.length;
  if(!before.size)return;
  // records glide from where they were; new ones grow in
  for(const r of shown){const n=nodes.get(r.slug),a=before.get(r.slug),b=n.getBoundingClientRect();
    if(a)n.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width})`,transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:620,easing:'cubic-bezier(.2,1.15,.35,1)'});
    else n.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.2,1.2,.35,1)'})}
}
function chips(){
  $('#chips').innerHTML=SETS.map(s=>`<button class="chip" data-set="${esc(s.id)}" aria-pressed="${s.id===set}">${esc(s.label)}${s.id==='all'?'':` <small>${s.n}</small>`}</button>`).join('');
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b)return;set=set===b.dataset.set&&set!=='all'?'all':b.dataset.set;
  $$('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.set===set));render(true)});
let qt;// a search looks through every record, whatever pill was on
$('#q').addEventListener('input',e=>{q=e.target.value;if(q&&set!=='all'){set='all';$$('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.set==='all'))}$('#clr').hidden=!q;clearTimeout(qt);qt=setTimeout(()=>render(true),120)});
$('#clr').addEventListener('click',e=>{e.preventDefault();q='';$('#q').value='';$('#clr').hidden=true;render(true);$('#q').focus()});
$('#shuffle').addEventListener('click',()=>{const list=shown.length?shown:R;location.hash=list[Math.random()*list.length|0].slug});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>$('#wall').style.setProperty('--cols',cols()),100)});

// ---- a record, lifted out ----
let from=null;
function show(slug){
  const i=shown.findIndex(r=>r.slug===slug),r=i>=0?shown[i]:R.find(r=>r.slug===slug);
  if(!r){hide();return}
  cur=i;
  const on=SERVICES.filter(([k])=>r.links[k]),mine=on.find(([k])=>k===picked())||on[0];
  const back=r.back?`<img src="${esc(img(r.back))}" alt="">`:`<div class="plain" style="background:${r.spine||'#2c2c2e'}"></div>`;
  const pill=(label,s)=>`<button class="chip" data-find="${esc(s)}">${esc(label)}</button>`;
  $('#rec').innerHTML=`<div><button class="flip" id="flip" aria-label="Turn the record over" aria-pressed="false"><div class="card"><div class="face">${face(r).replace(' loading="lazy"','')}</div><div class="face b">${back}</div></div></button><p class="turn">Tap to turn it over</p></div>
    <div class="info"><h2>${esc(r.title)}</h2><a class="by" href="#" data-find="${esc(r.artist)}">${esc(r.artist)}</a>
      <div class="meta">${r.year?pill(r.year,String(r.year)):''}${r.label?pill(r.label,r.label):''}${r.format?`<span class="chip">${esc(r.format)}</span>`:''}</div>
      ${mine?`<div class="play"><a class="pill" href="${esc(r.links[mine[0]])}" target="_blank" rel="noopener" data-k="${mine[0]}">${PLAY}Play on ${mine[1]}${NEW_TAB}</a>${on.length>1?`<button class="circ" id="more" aria-label="Play somewhere else" aria-expanded="false" aria-controls="menu">${DOTS}</button><div class="menu" id="menu">${on.map(([k,n])=>`<a href="${esc(r.links[k])}" target="_blank" rel="noopener" data-k="${k}">${n}${NEW_TAB}${k===mine[0]?'<small>Last used</small>':''}</a>`).join('')}</div>`:''}</div>`:''}
    </div>`;
  $('#prev').hidden=$('#next').hidden=cur<0||shown.length<2;
  document.title=`${r.title} · Records`;
  const o=$('#open'),was=o.classList.contains('on');
  if(!was){from=document.activeElement;o.classList.add('on');document.body.classList.add('held')}
  // the record rises from its tile on the wall, or slides in from the side when you step through
  const card=$('#flip'),t=nodes.get(r.slug);
  if(!reduce.matches){
    if(!was&&t&&t.isConnected){const a=t.getBoundingClientRect(),b=card.getBoundingClientRect();
      card.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width})`,transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:700,easing:'cubic-bezier(.2,1.12,.35,1)'})}
    else card.animate([{opacity:0,transform:`translateX(${(step||1)*40}px)`},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.2,1.2,.35,1)'});
    $('.info').animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:500,delay:80,fill:'backwards',easing:'cubic-bezier(.2,1.2,.35,1)'});
  }
  step=0;
  if(!was)$('#close').focus({preventScroll:true});
}
let step=0;
function hide(){
  const o=$('#open');if(!o.classList.contains('on'))return;
  o.classList.remove('on');document.body.classList.remove('held');document.title='Records';
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  const t=nodes.get((shown[cur]||{}).slug);(t&&t.isConnected?t:from)?.focus({preventScroll:true});cur=-1;
}
const go=d=>{if(cur<0||!shown.length)return;step=d;location.replace('#'+shown[(cur+d+shown.length)%shown.length].slug)};
addEventListener('hashchange',()=>{const s=decodeURIComponent(location.hash.slice(1));s?show(s):hide()});
$('#close').onclick=hide;$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
$('#open').addEventListener('click',e=>{
  if(e.target===e.currentTarget||e.target.classList.contains('rec')){hide();return}
  const f=e.target.closest('#flip');if(f){f.classList.toggle('back');f.setAttribute('aria-pressed',f.classList.contains('back'));return}
  const m=e.target.closest('#more');if(m){const on=!$('#menu').classList.contains('on');$('#menu').classList.toggle('on',on);m.setAttribute('aria-expanded',on);if(on&&e.detail===0)$('#menu a').focus();return}
  const k=e.target.closest('[data-k]');if(k){try{localStorage.setItem(PICK,k.dataset.k)}catch{}}
  // an artist, year or label searches the wall for it
  const s=e.target.closest('[data-find]');if(s){e.preventDefault();q=s.dataset.find;$('#q').value=q;$('#clr').hidden=false;set='all';$$('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.set==='all'));hide();render(true);scrollTo({top:0,behavior:reduce.matches?'auto':'smooth'})}
  if(!e.target.closest('.play'))$('#menu')?.classList.remove('on');
});
addEventListener('keydown',e=>{
  if(!$('#open').classList.contains('on')){if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}return}
  if(e.key==='Escape'){if($('#menu.on')){$('#menu').classList.remove('on');$('#more').focus()}else hide()}
  if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);
});
// on a phone, swipe sideways between records and pull down to put one back
let sx=null,sy=0;
$('#open').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#open').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)go(dx<0?1:-1);else if(dy>90&&dy>Math.abs(dx)*1.4&&$('#open').scrollTop<=0)hide()});

load().then(()=>{chips();render(false);const s=decodeURIComponent(location.hash.slice(1));if(s)show(s)})
  .catch(err=>{$('#none').hidden=false;$('#none').textContent='The records didn’t load: '+err.message});
</script>
</body>
