<style>
/* tokens: /vinyl/tokens.css. The leaning stacks are the landing page's; a pinned crate, or the only one, leads big. */
*,*::before,*::after{box-sizing:border-box}*{margin:0}
*{font-variant-numeric:tabular-nums}
html{background:var(--bg)}
body{font-family:var(--sans);font-size:var(--fs-3);line-height:1.45;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ring);outline-offset:4px;border-radius:4px}

.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:var(--fs-3)}
.brand svg{width:24px;height:24px;display:block}

main{max-width:1184px;margin:0 auto;padding:72px max(24px,env(safe-area-inset-right)) 72px max(24px,env(safe-area-inset-left))}
h1{font-size:var(--fs-6);font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-bottom:40px}

.stk{position:relative;display:block;aspect-ratio:1/1.28;width:100%;max-width:100%}
.stk .r{position:absolute;left:0;right:0;bottom:0;aspect-ratio:1;transform-origin:50% 100%;transform:translateY(calc(var(--j) * -9%)) scale(calc(1 - var(--j) * .05));filter:brightness(calc(1 - var(--j) * .14));box-shadow:0 10px 24px #0007;border-radius:var(--r-cover);overflow:hidden;background:var(--soft);transition:transform .5s var(--ease)}
.stk img{display:block;width:100%;height:100%;object-fit:cover}
a:hover .stk .r,a:focus-visible .stk .r{transform:translateY(calc(var(--j) * -11%)) scale(calc(1 - var(--j) * .05))}
a:active .stk .r{transition-duration:.15s;transform:translateY(calc(var(--j) * -8%)) scale(calc(1 - var(--j) * .05))}
.stk.empty .r{background:transparent;box-shadow:none;border:1px dashed var(--line2);filter:none;display:grid;place-items:center}
.stk.empty .r:not(.j0){border-color:var(--line)}
.plus{width:40px;height:40px;color:var(--t2);transition:color .2s}
a:hover .plus,button:hover .plus{color:var(--fg)}

.meta{display:grid;gap:4px;min-width:0}
.nm{font-weight:500;font-size:var(--fs-4);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ab{font-size:var(--fs-2);color:var(--t2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}

/* the crate that leads: a big stack with its name and words beside it */
.hero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:end;margin-bottom:64px}
.hero .meta{gap:10px;padding-bottom:16px}
.hero .nm{font-size:var(--fs-6);letter-spacing:-.02em;line-height:1.1;-webkit-line-clamp:3}
.hero .ab{font-size:var(--fs-4);-webkit-line-clamp:4;max-width:48ch}

/* the rest, all the same size */
.crates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 32px;list-style:none;padding:0}
.tile{display:grid;gap:12px;min-width:0;align-content:start}
.new{all:unset;cursor:pointer;display:grid;gap:12px;min-width:0;align-content:start}
.new .nm{color:var(--t2)}

/* making a crate (Casey only) */
.mk{margin:auto;width:min(380px,calc(100vw - 32px));padding:24px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--bg);color:var(--fg);box-shadow:var(--float)}
.mk::backdrop{background:#0000004d}
.mk h2{font-size:var(--fs-4);font-weight:500;margin-bottom:16px}
.mk label{display:block;font-size:var(--fs-1);color:var(--m);margin:0 0 6px}
.mk input,.mk textarea{display:block;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--bg);color:var(--fg);font:inherit;font-size:var(--fs-4);margin-bottom:14px;resize:none}
.mk textarea{height:84px}
.mk .err{min-height:1.4em;font-size:var(--fs-2);color:var(--t2)}
.mk .row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{all:unset;cursor:pointer;height:40px;padding:0 18px;border-radius:var(--r-pill);border:1px solid var(--line);display:inline-flex;align-items:center;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.go{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}

footer{max-width:1184px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));font-family:var(--mono);font-size:var(--fs-2);color:var(--t3)}
footer a:hover{color:var(--t1)}

@media (max-width:700px){
  .nav{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  main{padding:44px max(20px,env(safe-area-inset-right)) 56px max(20px,env(safe-area-inset-left))}
  h1{font-size:var(--fs-5);margin-bottom:24px}
  .hero{grid-template-columns:1fr;gap:16px;margin-bottom:40px}
  .hero .stk{width:78%}
  .hero .meta{padding:0;gap:6px}
  .hero .nm{font-size:var(--fs-5)}
  .hero .ab{font-size:var(--fs-3)}
  .crates{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}
  .nm{font-size:var(--fs-3)}
  .mk input,.mk textarea{font-size:var(--fs-4)}
  footer{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main>
  <h1>Casey’s crates</h1>
  <!--crates-->
</main>
<footer><a href="https://caseycavanagh.com">Made by Casey Cavanagh</a></footer>
<dialog class="mk" id="mk" aria-labelledby="mkH">
  <form id="mkF">
    <h2 id="mkH">New crate</h2>
    <label for="mkN">Name</label>
    <input id="mkN" maxlength="60" autocomplete="off" required>
    <label for="mkA">Description</label>
    <textarea id="mkA" maxlength="300"></textarea>
    <p class="err" id="mkE" aria-live="polite"></p>
    <div class="row"><button type="button" class="btn" id="mkX">Cancel</button><button class="btn go" id="mkB">Make it</button></div>
  </form>
</dialog>
<script>
// Casey's own, on a device unlocked in a crate (?edit): a "New crate" at the end of the list. Nobody else sees it.
(()=>{
  let key=null;try{key=localStorage.getItem('records-key')}catch{}
  const list=document.querySelector('.crates');if(!key||!list)return;
  const PLUS='<svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const li=document.createElement('li');
  li.innerHTML=`<button type="button" class="new" id="newC"><span class="stk empty" aria-hidden="true"><span class="r" style="--j:2"></span><span class="r" style="--j:1"></span><span class="r j0" style="--j:0">${PLUS}</span></span><span class="meta"><span class="nm">New crate</span></span></button>`;
  list.append(li);
  const d=document.getElementById('mk'),f=document.getElementById('mkF'),err=document.getElementById('mkE');
  document.getElementById('newC').onclick=()=>{d.showModal();document.getElementById('mkN').focus()};
  document.getElementById('mkX').onclick=()=>d.close();
  d.addEventListener('close',()=>{f.reset();err.textContent=''});
  f.addEventListener('submit',async e=>{
    e.preventDefault();const b=document.getElementById('mkB'),name=document.getElementById('mkN').value.trim();if(!name)return;b.disabled=true;err.textContent='';
    const r=await fetch('/api/crate',{method:'POST',headers:{'Content-Type':'application/json','X-Crate-Key':encodeURIComponent(key)},
      body:JSON.stringify({op:'crate-new',name,about:document.getElementById('mkA').value})}).catch(()=>null);
    const out=await r?.json().catch(()=>null);b.disabled=false;
    if(!r?.ok){err.textContent=r?.status===401?'Your key stopped working. Open a crate with ?edit to unlock again':out?.error?out.error[0].toUpperCase()+out.error.slice(1):'That didn’t save';return}
    const made=out.edits.crates.list.at(-1);
    try{sessionStorage.setItem('records-editing','1')}catch{}
    location.href='/casey/'+made.slug;
  });
})();
</script>
