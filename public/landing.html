<style>
/* tokens: /vinyl/tokens.css. The headline is the one size off the scale: it's the page's name. */
*,*::before,*::after{box-sizing:border-box}*{margin:0}
*{font-variant-numeric:tabular-nums}
html{background:var(--bg)}
body{font-family:var(--sans);font-size:var(--fs-3);line-height:1.45;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ring);outline-offset:4px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:var(--fs-3)}
.brand svg{width:24px;height:24px;display:block}
.btn{flex:none;height:40px;padding:0 18px;border-radius:var(--r-pill);display:inline-flex;align-items:center;font-weight:500;font-size:var(--fs-3);white-space:nowrap;background:var(--fg);color:var(--on-fg);transition:transform .5s var(--ease),opacity .2s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98);transition-duration:.08s}

/* the sentence and the make page's search box on the left; one of Casey's crates beside it, as the example */
main{max-width:1184px;margin:0 auto;padding:72px max(48px,env(safe-area-inset-right)) 64px max(48px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:72px;align-items:center}
main:not(:has(.ex)){grid-template-columns:minmax(0,1fr)}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
h1{font-size:48px;font-weight:500;letter-spacing:-.025em;line-height:1.05;max-width:15ch;text-wrap:balance}
.lede{font-size:var(--fs-4);color:var(--t2)}
.q{position:relative;display:flex;align-items:center;gap:12px;height:56px;max-width:560px;padding:0 8px 0 20px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--sheet);transition:border-color .2s}
.q:focus-within{border-color:#ffffff38}
.q svg{width:20px;height:20px;color:var(--t3);flex:none}
.q input{flex:1;width:0;min-width:0;height:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:var(--fs-4);outline:none}
.q input::placeholder{color:var(--t3)}
.q input::-webkit-search-cancel-button{display:none}
.q button{border:0;font-family:inherit;cursor:pointer}

/* the example crate: the front record upright, the next few peeking over it */
.ex{display:grid;gap:14px;min-width:0}
.stk{position:relative;display:block;aspect-ratio:1/1.24;width:100%}
.stk .r{position:absolute;left:0;right:0;bottom:0;aspect-ratio:1;transform-origin:50% 100%;transform:translateY(calc(var(--j) * -6%)) scale(calc(1 - var(--j) * .04));filter:brightness(calc(1 - var(--j) * .14));box-shadow:var(--rest);border-radius:var(--r-cover);overflow:hidden;background:var(--soft);transition:transform .5s var(--ease)}
.stk img{display:block;width:100%;height:100%;object-fit:cover}
.ex:hover .stk .r,.ex:focus-visible .stk .r{transform:translateY(calc(var(--j) * -7.5%)) scale(calc(1 - var(--j) * .04))}
.ex:active .stk .r{transition-duration:.15s;transform:translateY(calc(var(--j) * -5.5%)) scale(calc(1 - var(--j) * .04))}
.meta{position:relative;display:grid;gap:2px;min-width:0}
.who{font-weight:500;font-size:var(--fs-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arts{font-size:var(--fs-2);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{font-weight:500;color:var(--t1);white-space:nowrap;transition:color .2s}
.tl:hover{color:var(--fg)}

footer{max-width:1184px;margin:0 auto;padding:0 max(48px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(48px,env(safe-area-inset-left));font-family:var(--mono);font-size:var(--fs-2);color:var(--t3)}
footer a:hover{color:var(--t1)}

@media (max-width:700px){
  .nav{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  main{grid-template-columns:minmax(0,1fr);gap:40px;padding:40px max(20px,env(safe-area-inset-right)) 56px max(20px,env(safe-area-inset-left))}
  h1{font-size:var(--fs-6)}
  .lede{font-size:var(--fs-3)}
  .q{height:52px;padding:0 6px 0 16px}
  .q .btn{flex:none;height:40px;padding:0 16px}
  .ex{padding:0 28px}
  footer{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
