<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Records</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>var PHONE_Q='(max-width:600px),(pointer:coarse) and (max-height:500px)';document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.toggle('phone',matchMedia(PHONE_Q).matches)</script>
<style>
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Paper Mono';src:url('/fonts/paper-mono.woff2') format('woff2');font-weight:100 800;font-display:swap}
:root{--bg:#f4f2ee;--fg:#1a1a1a;--m:#666;--line:#cfccc6;--soft:#ebe8e2;--sheet:#fbfaf7;--accent:#661864;--mono:'Paper Mono',ui-monospace,monospace;--flip:cubic-bezier(.25,1.2,.4,1);--R:min(62vh,46vw);--R:min(62svh,46vw);--S:calc(var(--R)*.965)}
html[data-theme=dark]{--bg:#121212;--fg:#ecebe8;--m:#8f8f93;--line:#3a3a3d;--soft:#1c1c1e;--sheet:#1e1e20;--accent:#ca72c7}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
*{font-variant-numeric:tabular-nums}
html{background:var(--bg);overscroll-behavior:none}
body{font-family:'Instrument Sans',sans-serif;font-size:16px;line-height:1.55;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.page{height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden}
.page .crate{width:100%;height:100%;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.top h1{font:500 15px var(--mono)}
.top h1 span{color:var(--m)}
.icon{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--m);transition:transform .5s var(--flip)}
.icon:hover{color:var(--fg)}
.icon:active{transform:scale(.96);transition-duration:.08s}
.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:14px;transition:transform .5s var(--flip),border-color .2s,opacity .2s}
.btn:hover{border-color:var(--m)}
.btn:active{transform:scale(.99);transition-duration:.08s}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed=true]{border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}
.sort{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:28px}

/* the crate */
.crate{position:relative;height:calc(var(--S)*1.95);margin-top:8px;perspective:calc(var(--S)*2.9);perspective-origin:50% calc(50% - var(--S)*1.13);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.crate.dragging{cursor:grabbing}
/* hover nudges the front cover a few pixels toward the pointer's side: on the cover, so it never disturbs the crate's motion, and on its own spring in JS (see "nudge") */
.rc .fr{transition:opacity .4s}
.stack{position:absolute;left:50%;bottom:calc(50% - var(--S)/2);width:0;height:0;transform-style:preserve-3d;transform:rotateX(var(--tilt,-16deg))}
.rc{position:absolute;left:calc(var(--S)/-2);bottom:0;width:var(--S);height:var(--S);transform-origin:50% 100%;transform-style:preserve-3d;cursor:pointer}
/* fade the covers, never the record itself: opacity on a 3D record flattens it, and a flipped one would show its front mirrored */
.rc .face{transition:opacity .4s}
.crate.lifted .rc:not(.cur) .face{opacity:0}
.crate.still .rc .face{transition:none} /* cycling in the open view: the hidden crate changes without fading */
.crate.lifted .floor{opacity:0}
.floor{transition:opacity .4s}
.rc.held{visibility:hidden}
.rc.gone{display:none} /* out of sight: no layer at all */
/* a flipped record sits in the shadow of the one it fell onto, darkest where they touch */
.rc.fell .bk::after{background:linear-gradient(0deg,#00000070,#0000 22%),linear-gradient(180deg,#0000 70%,#0000002a),var(--shade,transparent)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:2px;container-type:inline-size}
.face::after{content:'';position:absolute;inset:0;background:var(--shade,transparent);pointer-events:none;box-shadow:inset 1px 1px 0 #ffffff30,inset -1px -1px 0 #0000002e}
.bk{transform:rotateY(180deg)}
/* every jacket has thickness: faces pushed apart, cardboard edges between them */
.rc{--T:max(2px,calc(var(--S)*.005));--W:var(--S)}
.rc .face,.sleeve .face{border-radius:1px}
.rc .fr,.sleeve .fr{transform:translateZ(calc(var(--T)/2))}
.rc .bk,.sleeve .bk{transform:rotateY(180deg) translateZ(calc(var(--T)/2))}
.edge{position:absolute;top:0;left:calc(50% - var(--T)/2);width:var(--T);height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.edge::after{content:'';position:absolute;inset:0;background:var(--grain),linear-gradient(90deg,#0000003a,#ffffff30 40%,#ffffff12 60%,#00000040),linear-gradient(var(--dk),var(--dk));background-size:120px,auto,auto}
.rc .edge::before{content:'';position:absolute;inset:0;background:var(--shade,transparent)}
/* edges darken by how far they turn from the light (plain layers, no filters: cheap to composite) */
.edge.l{transform:rotateY(-90deg) translateZ(calc(var(--W)/2));--dk:#0000005e}
.edge.r{transform:rotateY(90deg) translateZ(calc(var(--W)/2));--dk:#00000047}
.edge.t,.edge.b{left:0;top:calc(50% - var(--T)/2);width:100%;height:var(--T)}
.edge.t{transform:rotateX(90deg) translateZ(calc(var(--W)/2));--dk:#00000014}
.edge.t::after{background:var(--grain),linear-gradient(180deg,#00000030,#ffffff4a 45%,#ffffff1a 60%,#00000038),linear-gradient(var(--dk),var(--dk));background-size:120px,auto,auto}
.edge.b{transform:rotateX(-90deg) translateZ(calc(var(--W)/2));--dk:#00000080}
/* cardboard: a fine grain, light from the top left, and worn edges that catch it */
.sleeve .face::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:inherit;
  background:var(--grain),linear-gradient(115deg,#ffffff16,#0000 35%,#0000 70%,#0000001c);background-size:128px,auto;
  box-shadow:inset 1px 1px 0 #ffffff40,inset -1px -1px 0 #00000030,inset 0 0 0 2px #ffffff0d}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
img.art{object-fit:cover;pointer-events:none;-webkit-user-drag:none;user-select:none}
.cover-type{position:absolute;left:7cqw;right:7cqw;top:6.5cqw;line-height:1.2}
.cover-type b{display:block;font:500 6cqw 'Instrument Sans',sans-serif}
.cover-type i{display:block;font:400 4.4cqw var(--mono);font-style:normal;opacity:.85;margin-top:1.2cqw}
.back-in{position:absolute;inset:0;padding:8cqw;font:400 3.6cqw/1.6 var(--mono);display:flex;flex-direction:column;justify-content:space-between}
.back-in b{display:block;font:500 5cqw/1.25 'Instrument Sans',sans-serif;margin-bottom:3cqw}
.back-in dl{display:grid;grid-template-columns:auto 1fr;gap:.6cqw 4cqw}
.back-in dt{opacity:.7}
.back-in dd{margin:0}
.floor{position:absolute;left:50%;bottom:calc(50% - var(--S)/2 - 2px);width:calc(var(--S)*1.3);height:calc(var(--S)*.5);transform:translate(-50%,0);background:radial-gradient(50% 30% at 50% 10%,#0000002a,#0000);pointer-events:none}
html[data-theme=dark] .floor{background:radial-gradient(50% 30% at 50% 10%,#00000080,#0000)}

.flips{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:-8px;font-size:14px}
.flips .count{min-width:64px;text-align:center;color:var(--m);font-family:var(--mono);font-size:13px}
.hint{text-align:center;color:var(--m);font-size:13px;margin-top:10px}

/* the record in front */
.caption{text-align:center;margin-top:22px;min-height:50px}
.caption b{display:block;font-weight:500;font-size:18px}
.caption span{color:var(--m);font-size:15px}

/* a record lifted out of the crate */
.open{--O:var(--R);position:fixed;inset:0;z-index:10;overflow:auto;overscroll-behavior:contain}
.open[hidden]{display:none}
.open:focus{outline:none}
#close{position:fixed;top:24px;left:24px;z-index:3;opacity:0;transition:opacity .3s,transform .5s var(--flip)}
.open.in #close{opacity:1}
.o-page{min-height:100%;display:grid;place-items:center;padding:80px 24px}
.o-grid{display:flex;align-items:center;justify-content:center;gap:64px}
.stage{position:relative;z-index:2;flex:none;width:var(--O);height:var(--O);perspective:2600px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.stage:focus-visible{outline:none}
.lift{width:100%;height:100%;transform-style:preserve-3d;transform-origin:50% 50%}
.lift.ghost{position:absolute;inset:0;pointer-events:none}
.lift.moving{transition:transform .9s var(--flip)}
.lift.back{transition:transform .55s cubic-bezier(.4,0,.2,1)}
.sleeve{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.sleeve{--T:max(3px,calc(var(--O)*.007));--W:var(--O)}
.sleeve .face{border-radius:1px}
/* one shadow behind each side, each seen only from its own side, so it turns with the sleeve and never shows in front */
.sleeve .sh{position:absolute;inset:3% 3% 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 2px #0002,0 6px 12px -4px #0002,0 24px 40px -14px #0005,0 60px 100px -36px #0008;transform:translateZ(calc(var(--T)/-2 - 1px));opacity:0;transition:opacity .6s}
.sleeve .sh.b{transform:rotateY(180deg) translateZ(calc(var(--T)/-2 - 1px))}
.open.in .sleeve .sh{opacity:1}
html[data-theme=dark] .sleeve .sh{box-shadow:0 1px 2px #0006,0 24px 40px -14px #000a,0 60px 100px -36px #000d}
/* the neighbors peek in from the page edges; hover pulls one out a little further */
.peek{all:unset;position:fixed;top:50%;z-index:2;width:var(--O);aspect-ratio:1;cursor:pointer;opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .25s;box-shadow:0 20px 40px -20px #0006}
.peek img,.peek>div{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.peek.prev{left:0;--x:calc(-100% + 28px);--h:calc(-100% + 96px)}
.peek.next{right:0;--x:calc(100% - 28px);--h:calc(100% - 96px)}
.peek{transform:translate(var(--x),-50%)}
.open.in .peek.on{opacity:.45;pointer-events:auto;transition:transform .85s var(--flip),opacity .5s .25s}
@media(hover:hover){.open.in .peek.on:hover{opacity:1;transform:translate(var(--h),-50%);transition:transform .6s var(--flip),opacity .25s}}
.open.in.swapping .peek{opacity:0;transition:none}
/* hovering a peek names it, quietly, just below the edge it's peeking from */
.phint{position:fixed;top:calc(50% + var(--R)/2 + 18px);z-index:2;display:grid;gap:2px;max-width:min(260px,40vw);pointer-events:none;opacity:0;transition:opacity .15s,transform .2s;font-size:14px;line-height:1.3}
.phint.prev{left:28px;transform:translateX(-6px)}
.phint.next{right:28px;text-align:right;transform:translateX(6px)}
.phint b{font-weight:500}
.phint i{font-style:normal;color:var(--m)}
.phint.prev::before,.phint.next::before{font:400 12px/1 var(--mono);color:var(--m);margin-bottom:6px}
.phint.prev::before{content:'← Previous'}
.phint.next::before{content:'Next →'}
/* gone the instant a record moves, and quiet until you hover a peek afresh, so a hint never shows the record after next */
.open.swapping .phint,.open.hush .phint{opacity:0;transition:none}
.open.in:not(.swapping):not(.hush) .peek.prev.on:hover~.phint.prev,.open.in:not(.swapping):not(.hush) .peek.next.on:hover~.phint.next{opacity:1;transform:none;transition:opacity .25s .05s,transform .5s var(--flip) .05s}
@media(hover:none){.phint{display:none}}
/* the details start tucked under the record and slide out to the right */
.o-info{position:relative;z-index:1;flex:none;width:min(340px,30vw);opacity:0;transform:translateX(-60%) scale(.96);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .2s}
.open.in .o-info{opacity:1;transform:none;transition:transform .85s var(--flip) .1s,opacity .4s .1s}
.open.in.swapping .o-info{opacity:0;transform:translateX(-60%) scale(.96);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .1s}
@media(max-width:860px){
  .o-grid{flex-direction:column;gap:32px}
  .o-info{width:var(--O);transform:translateY(-50%) scale(.96)}
  .open.in.swapping .o-info{transform:translateY(-50%) scale(.96)}
}
.o-info h2{font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.o-info .by{font-size:19px;color:var(--m);margin-top:4px}
.facts{display:grid;grid-template-columns:96px 1fr;gap:6px 16px;margin-top:22px;font:400 14px/1.5 var(--mono)}
.facts dt{color:var(--m)}
.facts dd{margin:0}
.facts div{display:contents}
.play{position:relative;margin-top:28px}
.play .btn{height:40px;padding:0 20px 0 16px;font-size:15px;gap:8px}
.play .btn svg{flex:none}
.play .mk{flex:none;display:block}
/* after a pick: Play carries the service's logo, and a small round button beside it switches */
.pair{display:inline-flex;align-items:center;gap:6px}
.pm-h,.o-count,.dhint{display:none}
.sw{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--m);transition:transform .5s var(--flip),background-color .2s,color .2s}
.sw:hover,.sw[aria-expanded=true]{background:var(--soft);color:var(--fg)}
.sw:active{transform:scale(.96);transition-duration:.08s}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw svg{transition:transform .45s var(--flip)}
.sw[aria-expanded=true] svg{transform:rotate(180deg)}
/* where there's hover, the caret waits tucked behind Play and slides out when you come near it (or tab to it); it leaves on a quick fade */
@media(hover:hover){
  html:not(.phone) .pair .btn{position:relative;z-index:1;background:var(--bg)}
  html:not(.phone) .pair .sw{opacity:0;translate:-26px 0;transition:opacity .12s,translate 0s .12s,transform .5s var(--flip),background-color .2s,color .2s}
  html:not(.phone) .pair:hover .sw,html:not(.phone) .pair:focus-within .sw,html:not(.phone) .pair .sw[aria-expanded=true]{opacity:1;translate:0;transition:opacity .2s,translate .55s var(--flip),transform .5s var(--flip),background-color .2s,color .2s}
}
@media(hover:hover) and (prefers-reduced-motion:reduce){html:not(.phone) .pair .sw{translate:0}}
/* the caret's tooltip: after a short wait on it, a small label rises above it; it leaves on a quick fade and stays away while the menu is open */
.sw{position:relative}
.sw .tip{position:absolute;bottom:calc(100% + 8px);left:50%;padding:5px 9px;border-radius:6px;background:var(--fg);color:var(--bg);font-size:12px;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;translate:-50% 4px;transition:opacity .1s,translate 0s .1s}
@media(hover:hover){html:not(.phone) .sw:is(:hover,:focus-visible):not([aria-expanded=true]) .tip{opacity:1;translate:-50% 0;transition:opacity .2s .35s,translate .5s var(--flip) .35s}}
html.phone .sw .tip{display:none}
@media(prefers-reduced-motion:reduce){.sw .tip{translate:-50% 0}}
/* Play opens a short list of services; it arrives on a spring and leaves on a quick fade */
.play-m{position:absolute;left:0;top:calc(100% + 8px);z-index:3;min-width:200px;display:grid;padding:6px;border-radius:14px;background:var(--bg);border:1px solid var(--line);
  box-shadow:0 1px 2px #0001,0 12px 32px -12px #0003;transform-origin:20px 0;opacity:0;visibility:hidden;transform:translateY(-4px) scale(.97);
  transition:opacity .12s,visibility 0s .12s,transform 0s .12s}
.play.up .play-m{top:auto;bottom:calc(100% + 8px);transform-origin:20px 100%;transform:translateY(4px) scale(.97)}
.o-info:has(.play.on){z-index:3}
.play.on .play-m{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .45s var(--flip)}
.play-m a{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px;transition:transform .5s var(--flip),background-color .15s}
.play-m a:hover{background:var(--soft)}
.play-m a[aria-current]::after{content:'✓';margin-left:auto;padding-left:16px;color:var(--m)}
.play-m a:active{transform:scale(.99);transition-duration:.08s}
.play-m a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
html[data-theme=dark] .play-m{box-shadow:0 12px 32px -12px #000c}

@media(max-width:600px){
  .page{padding:24px 16px 80px}
  :root{--R:min(78vw,50vh);--R:min(78vw,50svh)}
  .o-info h2{font-size:26px}
}
/* Phones: the crate becomes a pile of records facing you; an open record stacks its details underneath, Play within reach of a thumb */
html.phone{--S:min(calc(100vw - 48px),calc(100svh - 200px));-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html.phone .page{padding:0}
/* eye level with the bottom of the pile, so a record tipped all the way toward you is edge on and gone, not lying there */
html.phone .crate{perspective:1500px;perspective-origin:50% calc(50% + 12px + var(--S)/2);cursor:default;-webkit-touch-callout:none}
html.phone .stack{transform:none;bottom:calc(50% - 12px - var(--S)/2)} /* the pile, with the records peeking out above, sits dead center */
html.phone .rc{transform-origin:50% 50%}
html.phone .floor{display:none}
html.phone .rc .fr{box-shadow:0 1px 2px #0000001f,0 14px 28px -14px #00000059;transition:scale .5s var(--flip),opacity .4s}
html.phone[data-theme=dark] .rc .fr{box-shadow:0 1px 2px #0000008c,0 14px 28px -12px #000000b3}
html.phone .crate.pressing .rc.cur .fr{scale:.985;transition:scale .08s}
/* no labels on the pile, only a first-time hint that goes once you've flipped */
html.phone .dhint{display:block;position:absolute;left:0;right:0;top:calc(50% + 12px + var(--S)/2 + 28px);text-align:center;font:400 12px/1.4 var(--mono);color:var(--m);pointer-events:none;transition:opacity .4s}
.crate.swiped .dhint,.crate.lifted .dhint{opacity:0}
html.phone .open{--O:min(calc(100vw - 48px),calc(100svh - 330px))}
html.phone .o-page{display:flex;padding:calc(env(safe-area-inset-top) + 64px) 24px calc(env(safe-area-inset-bottom) + 20px)}
html.phone .o-grid{flex:1;flex-direction:column;justify-content:flex-start;gap:22px}
html.phone .stage{touch-action:none}
html.phone .sleeve .sh{box-shadow:0 1px 2px #0002,0 8px 16px -6px #0003,0 24px 40px -18px #0005}
html.phone[data-theme=dark] .sleeve .sh{box-shadow:0 1px 2px #0006,0 12px 24px -8px #0009,0 28px 44px -18px #000c}
/* the details slide down from under the record */
html.phone .o-info{flex:1;display:flex;flex-direction:column;width:var(--O);transform:translateY(-56px) scale(.98)}
html.phone .open.in .o-info{transform:none}
html.phone .open.in.swapping .o-info{transform:translateY(-32px) scale(.98);transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .12s}
html.phone .o-info h2{font-size:25px}
html.phone .o-info .by{font-size:17px;margin-top:2px}
html.phone .facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px;font-size:13px}
html.phone .facts div{display:grid;gap:1px;min-width:0}
html.phone #close{top:calc(env(safe-area-inset-top) + 12px);left:calc(env(safe-area-inset-left) + 12px);width:40px;height:40px;padding:0;box-sizing:border-box;justify-content:center;font-size:18px}
html.phone #close .cl{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}
html.phone .o-count{display:block;position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 24px);font:400 13px/40px var(--mono);color:var(--m);opacity:0;transition:opacity .3s}
html.phone .open.in .o-count{opacity:1}
/* the neighbors wait as slivers at the edges, level with the record, and come in with your finger */
html.phone .peek{top:var(--py,50%);transform:translate(calc(var(--x) + var(--dx,0px)),-50%);box-shadow:none}
html.phone .peek.prev{--x:calc(-100% + 14px)}
html.phone .peek.next{--x:calc(100% - 14px)}
html.sliding .open.in .peek.on{transition:none}
/* pulling the record down fades the rest of the view and brings the pile back */
html.pulldown .open .o-info,html.pulldown .open.in #close,html.pulldown .open.in .o-count{opacity:calc(1 - var(--pull,0)*3);transition:none}
html.pulldown .open.in .peek.on{opacity:0;transition:opacity .15s}
html.pulldown .crate.lifted .rc:not(.cur) .face{opacity:1;transition:none}
/* the pile comes back from under a veil in the page color: all at once, never cover through cover, and cheap to fade */
.veil{display:none}
html.pulldown .veil{display:block;position:absolute;inset:0;background:var(--bg);pointer-events:none;will-change:opacity}
html.phone .play{margin-top:auto;padding-top:24px}
html.phone .play>.btn,html.phone .pair{width:100%}
html.phone .play .btn{box-sizing:border-box;height:52px;justify-content:center;font-size:16px;padding:0 20px}
html.phone .pair{display:flex;gap:8px}
html.phone .pair .btn{flex:1}
html.phone .sw{box-sizing:border-box;width:52px;height:52px;flex:none;border:1px solid var(--line);color:var(--fg)}
/* the services come up as a sheet from the bottom; pull it down or tap outside to put it away */
html.phone .play::before{content:'';position:fixed;inset:0;z-index:2;background:#0000004d;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
html.phone .play.on::before{opacity:1;visibility:visible;transition:opacity .3s}
html.phone .play-m{position:fixed;top:auto;left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;min-width:0;padding:6px 8px 8px;border:0;border-radius:24px;background:var(--sheet);box-shadow:0 -8px 40px -12px #0000004d;opacity:1;touch-action:none;
  transform:translateY(calc(100% + 16px));transition:transform .22s cubic-bezier(.4,0,1,1),visibility 0s .22s}
html.phone .play.on .play-m{visibility:visible;transform:none;transition:transform .5s var(--flip)}
html.phone .play-m::before{content:'';justify-self:center;width:36px;height:5px;border-radius:3px;background:var(--line);margin:2px 0 4px}
html.phone .pm-h{display:block;padding:6px 14px 8px;font:400 12px/1.4 var(--mono);color:var(--m)}
html.phone .play-m a{height:56px;padding:0 14px;gap:14px;font-size:17px;border-radius:14px}
html.phone .play-m .mk{width:26px;height:26px}
html.phone .play-m a:hover{background:none}

/* short phones: tighter spacing so the record stays big and Play stays on screen */
@media(max-height:620px){
  html.phone .open{--O:min(calc(100vw - 48px),calc(100svh - 290px))}
  html.phone .o-page{padding-top:calc(env(safe-area-inset-top) + 58px);padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
  html.phone .o-grid{gap:16px}
  html.phone .o-info h2{font-size:22px}
  html.phone .o-info .by{font-size:16px}
  html.phone .facts{margin-top:12px}
  html.phone .play{padding-top:16px}
}
/* phones on their side: the pile shrinks to fit, the details sit beside the record again */
@media(max-height:500px){
  html.phone{--S:calc(100svh - 90px)}
  html.phone .dhint{display:none}
  html.phone .open{--O:calc(100svh - 72px)}
  html.phone .o-page{padding:36px calc(env(safe-area-inset-right) + 32px) 36px calc(env(safe-area-inset-left) + 32px)}

}
@media(prefers-reduced-motion:reduce){html.phone .play-m,html.phone .play.on .play-m,html.phone .open.in.swapping .o-info}
@media(prefers-reduced-motion:reduce){.peek,.open.in .peek.on,.open.in .peek.on:hover,.rc,.rc .fr,.lift.moving,.lift.back,.o-info,.open.in .o-info,.play-m,.play.on .play-m,.sw svg{transition:none}}
/* loading: a quiet count, then the whole crate rises in at once */
.loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;font:400 13px/1 var(--mono);color:var(--m);transition:opacity .3s;pointer-events:none}
.loading .bar{width:120px;height:1px;background:var(--line);overflow:hidden}
.loading .bar i{display:block;height:100%;background:var(--fg);transform:scaleX(0);transform-origin:0 50%;transition:transform .3s}
.ready .loading{opacity:0}
.crate{opacity:0;transform:translateY(24px)}
.ready .crate{opacity:1;transform:none;transition:opacity .5s .15s,transform 1s var(--flip) .15s}
@media(prefers-reduced-motion:reduce){.ready .crate{transition:opacity .3s}}

<body>
<div class="loading" id="loading" aria-live="polite"><span>Gathering records…</span><span class="bar"><i id="loadBar"></i></span><span id="loadN"></span></div>
<main class="page">
  <h1 class="sr">Records</h1>
  <section class="crate" id="crate" tabindex="0" aria-roledescription="record crate" aria-label="Record crate. Arrow keys flip forward and back, Enter pulls out the front record.">
    <div class="floor"></div>
    <div class="stack" id="stack"></div>
    <p class="dhint" aria-hidden="true">Pull down to flip through, tap to pull one out</p>
    <div class="veil" id="veil"></div>
  </section>
  <p class="sr" id="pos" aria-live="polite"></p>
</main>

<div class="open" id="open" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="oTitle">
  <button class="peek prev" id="prevP" tabindex="-1" aria-hidden="true"></button>
  <button class="peek next" id="nextP" tabindex="-1" aria-hidden="true"></button>
  <span class="phint prev" aria-hidden="true"></span><span class="phint next" aria-hidden="true"></span>
  <div class="o-page">
    <button class="btn" id="close"><span>←<span class="cl"> Back to the crate</span></span></button>
    <span class="o-count" id="ocount" aria-hidden="true"></span>
    <div class="o-grid">
      <div class="stage" id="stage" tabindex="0" role="button" aria-label="Turn the sleeve over"><div class="lift" id="lift"><div class="sleeve" id="sleeve"></div></div></div>
      <div class="o-info" id="oinfo"></div>
    </div>
  </div>
</div>

<script src="vinyl/visitor-crate.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const RECORDS=[
  {artist:'Lucinda Williams',title:'Car Wheels on a Gravel Road',year:1998,label:'Mercury',format:'LP',added:'2024-03-02',pal:['#c9803c','#2a1a10','#f3e4c8'],art:'sun'},
  {artist:'Wilco',title:'Yankee Hotel Foxtrot',year:2002,label:'Nonesuch',format:'2×LP',added:'2023-11-18',pal:['#1f3b57','#e9e1d0','#8fb1c9'],art:'grid'},
  {artist:'Gillian Welch',title:'Time (The Revelator)',year:2001,label:'Acony',format:'LP',added:'2025-06-14',pal:['#d9c9a3','#3d2f22','#9a6b3f'],art:'arch'},
  {artist:'Jason Isbell',title:'Southeastern',year:2013,label:'Southeastern Records',format:'LP',added:'2022-08-09',pal:['#e8e4dc','#232323','#b23a2a'],art:'type'},
  {artist:'Townes Van Zandt',title:'Live at the Old Quarter, Houston, Texas',year:1977,label:'Tomato',format:'2×LP',added:'2021-12-24',pal:['#2b2b2b','#e7d8b8','#b98a4a'],art:'rings'},
  {artist:'Uncle Tupelo',title:'No Depression',year:1990,label:'Rockville',format:'LP',added:'2020-05-30',pal:['#6f7d5a','#f1ead8','#3a4430'],art:'bands'},
  {artist:'Emmylou Harris',title:'Pieces of the Sky',year:1975,label:'Reprise',format:'LP',added:'2025-01-11',pal:['#a9c3cf','#28323a','#f4efe6'],art:'sun'},
  {artist:'Gram Parsons',title:'Grievous Angel',year:1974,label:'Reprise',format:'LP',added:'2023-04-22',pal:['#efe3cf','#5a2a2a','#c79b5b'],art:'stripes'},
  {artist:'Neil Young',title:'Harvest',year:1972,label:'Reprise',format:'LP',added:'2019-09-07',pal:['#e6d6b0','#4a3a26','#a8743a'],art:'rings'},
  {artist:'Sturgill Simpson',title:'Metamodern Sounds in Country Music',year:2014,label:'High Top Mountain',format:'LP',added:'2024-10-05',pal:['#5b2f6b','#f2d36b','#e98a4f'],art:'grid'},
  {artist:'Whiskeytown',title:'Strangers Almanac',year:1997,label:'Outpost',format:'LP',added:'2022-02-19',pal:['#33424a','#e4ddd0','#9fb0a8'],art:'stripes'},
  {artist:'Margo Price',title:'Midwest Farmer’s Daughter',year:2016,label:'Third Man',format:'LP',added:'2025-09-27',pal:['#f0c84b','#1d1d1d','#d4472f'],art:'bands'},
].map(r=>({...r,slug:(r.artist+' '+r.title).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}));

// Made-up cover art: one of a few patterns in each record's colors
function art(r){
  const [bg,fg,ac]=r.pal;let g='';
  if(r.art==='sun'){g=`<circle cx="50" cy="60" r="21" fill="${ac}"/>`;for(let i=0;i<6;i++)g+=`<rect x="0" y="${72+i*5}" width="100" height="${1.2+i*.5}" fill="${fg}" opacity=".85"/>`}
  if(r.art==='grid'){for(let x=0;x<6;x++)for(let y=0;y<5;y++)g+=`<circle cx="${17+x*13.2}" cy="${38+y*13}" r="${(x+y)%3?3.2:5.4}" fill="${(x*y)%4?fg:ac}"/>`}
  if(r.art==='arch'){for(let i=0;i<5;i++){const w=78-i*14;g+=`<path d="M${50-w/2} 100V${62-i*0}a${w/2} ${w/2} 0 0 1 ${w} 0V100z" fill="${i%2?bg:(i?ac:fg)}"/>`}}
  if(r.art==='type'){g=`<text x="7" y="96" font-family="Instrument Sans,sans-serif" font-weight="500" font-size="54" fill="${ac}" letter-spacing="-3">${r.title[0]}</text><rect x="7" y="40" width="40" height="2" fill="${fg}"/>`}
  if(r.art==='rings'){for(let i=6;i>0;i--)g+=`<circle cx="64" cy="66" r="${i*6}" fill="none" stroke="${i%2?ac:fg}" stroke-width="2.4"/>`}
  if(r.art==='bands'){g=`<rect y="44" width="100" height="18" fill="${fg}"/><rect y="62" width="100" height="18" fill="${ac}"/><rect y="80" width="100" height="20" fill="${fg}" opacity=".6"/>`}
  if(r.art==='stripes'){for(let i=-10;i<12;i++)g+=`<path d="M${i*10} 100L${i*10+60} 40" stroke="${i%3?fg:ac}" stroke-width="2.6"/>`;g+=`<rect width="100" height="40" fill="${bg}"/>`}
  return `<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/>${g}</svg>`;
}
// local covers live in vinyl/; a visitor's crate uses Apple's artwork URLs
const img=f=>/^https?:/.test(f)?f:'vinyl/'+f;
const coverHTML=r=>r.front?`<img class="art" src="${img(r.front)}" alt="" decoding="sync" draggable="false">`:`${art(r)}<div class="cover-type" style="color:${r.pal[1]}"><b>${r.artist}</b><i>${r.title}</i></div>`;
const spineBg=r=>r.spine||r.pal[0];
const edgesHTML=(r,ks=['l','r','t','b'])=>ks.map(k=>`<div class="edge ${k}" style="background:${spineBg(r)}"></div>`).join('');
const spineHTML=r=>`<div class="spine-in" style="background:${r.pal[0]};color:${r.pal[1]}"><span><b>${r.artist}</b> <em>${r.title}</em></span><em>${r.year}</em></div>`;
const fmtDate=s=>new Date(s+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const backHTML=r=>r.back?`<img class="art" src="${img(r.back)}" alt="" decoding="sync" draggable="false">`:`<div class="art" style="background:${spineBg(r)}"></div>`; // no back on file: a plain jacket in the cover's color

// crate geometry, in px
const GAP=7,AHEAD=8,BEHIND=16,FGAP=3.5;
let order=[...RECORDS],cur=0,sortKey='artist';
const stack=$('#stack'),crate=$('#crate');

function sortBy(k){
  sortKey=k;const keep=order[cur];
  const name=a=>a.replace(/^the /i,'');
  // by artist (a leading "The" doesn't count), then each artist's records oldest first; a record without a year goes after that artist's dated ones
  const yr=r=>+r.year||9999;
  order=[...RECORDS].sort(k==='year'?(a,b)=>a.year-b.year:k==='added'?(a,b)=>b.added.localeCompare(a.added):(a,b)=>name(a.artist).localeCompare(name(b.artist),'en',{sensitivity:'base'})||yr(a)-yr(b)||a.title.localeCompare(b.title));
  build();go(0,true);
}
let nodes=[],jits=[],shown=[],frontBox=null;
function build(){
  stack.innerHTML=order.map((r,j)=>`<div class="rc" data-j="${j}"><div class="face fr">${coverHTML(r)}</div><div class="face bk">${backHTML(r)}</div></div>`).join('');
  nodes=[...stack.children];jits=order.map(jit);shown=nodes.map(()=>true); // cached so each frame does no lookups
}
// Records you've flipped past lean toward you, back cover up; the rest stand behind
// a hair of disorder, the same every visit: each record sits slightly off true
const jit=r=>{let h=0;for(const c of r.slug)h=(h*31+c.charCodeAt(0))|0;const f=k=>((Math.sin(h*(k+1)*12.9898)*43758.5453)%1+1)%1-.5;return{x:f(0)*1.6,z:f(1)*1.4,a:f(2)*1.6}};
// Phones: a pile of records facing you. Pull the top one down and it tips toward you, out of the way, the way a record flips in the crate;
// push up to stand the last one back up; tap to pull one out.
const root=document.documentElement,phoneQ=matchMedia(PHONE_Q);
let PHONE=phoneQ.matches,deckS=0,dd=null;
// the top record can also leave its track under your finger: a little give before the first one; it springs back
const off={x:0,y:0,vx:0,vy:0};
// where a record sits at a (fractional) distance d below the top of the pile; a flipped one tips toward you on its bottom edge until it's edge on, gone
function deckSeat(d,q){
  if(d>=0){const k=Math.min(d,4),w=Math.min(d,1,Math.max(0,4-d));return{x:q.x*5*w,y:-Math.min(k,3)*14,z:-k*3,s:1-k*.035,r:q.z*2.4*w,a:0}} // past the third, a record squares up and shrinks out of sight behind it
  return{x:0,y:0,z:1,s:1,r:0,a:-Math.acos(1-Math.min(-d,1))*180/Math.PI}; // its top edge keeps pace with your finger
}
// One spring drives the crate: pos chases aim, so a flip can be interrupted, retargeted or dragged without restarting
let pos=0,vel=0,aim=0,raf=0;
const K=220,C=27;
// where a record sits at a (fractional) distance d behind the front one
function seat(d){
  if(d>=1)return{z:-BEHIND-(d-1)*GAP,a:10+Math.min(d,6)*.5,m:1};
  if(d>=0)return{z:-BEHIND*d,a:10+.5*d,m:.5+.5*d};
  if(d>-1){const t=-d;return{z:AHEAD*t,a:10-70*t,m:.5+.5*t}} // falling forward
  const k=-d-1;return{z:AHEAD+k*FGAP,a:-(60+Math.min(k,8)*1.2),m:1}; // flipped records pile up, fanned a little, leaning far enough to show only their backs
}
function render(){
  frontBox=null;
  if(PHONE){
    if(!deckS)deckS=nodes[cur]?.offsetWidth||0;
    const h=deckS/2;
    nodes.forEach((n,j)=>{
      if(!shown[j])return;
      const p=deckSeat(j-pos,jits[j]),o=j===cur?off:{x:0,y:0},s=p.s*(1+Math.max(0,-o.y)/4000);
      const tip=p.a?` translateY(${h}px) rotateX(${p.a.toFixed(2)}deg) translateY(${-h}px)`:''; // hinged on the bottom edge
      n.style.transform=`translate3d(${(p.x+o.x).toFixed(1)}px,${(p.y+o.y).toFixed(1)}px,${p.z.toFixed(1)}px)${tip} rotate(${p.r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
    });
    return;
  }
  nodes.forEach((n,j)=>{
    if(!shown[j])return;
    const p=seat(j-pos),q=jits[j];
    n.style.transform=`translateX(${(q.x*p.m).toFixed(2)}%) translateZ(${p.z.toFixed(1)}px) rotateX(${(p.a+q.a*p.m).toFixed(2)}deg) rotateZ(${(q.z*p.m).toFixed(2)}deg)`;
  });
}
function tick(t){
  const dt=tick.t?Math.min(.032,(t-tick.t)/1000):1/60;tick.t=t;
  vel+=(-K*(pos-aim)-C*vel)*dt;pos+=vel*dt;
  let rest=Math.abs(pos-aim)<.0005&&Math.abs(vel)<.005;
  if(PHONE&&!dd){
    off.vx+=(-K*off.x-C*off.vx)*dt;off.x+=off.vx*dt;off.vy+=(-K*off.y-C*off.vy)*dt;off.y+=off.vy*dt;
    if(Math.abs(off.x)+Math.abs(off.y)<.1&&Math.abs(off.vx)+Math.abs(off.vy)<1)off.x=off.y=off.vx=off.vy=0;else rest=false;
  }
  if(rest){pos=aim;vel=0;render();raf=0;tick.t=0;if(PHONE)place(true);else queueNudge();return}
  render();raf=requestAnimationFrame(tick);
}
function kick(){if(reduce){pos=aim;vel=0;off.x=off.y=0;place(true);render();return}if(!raf){tick.t=0;raf=requestAnimationFrame(tick)}}
// shading and classes follow the whole-number position, and snap (animating them repaints every cover)
// Only records you could see are drawn: the pile hides all but its top few, and past 10 deep nothing shows.
// Shading is two flat steps (behind, flipped), so a flip repaints only the records that change sides.
function place(rest){
  nodes.forEach((n,j)=>{
    const d=j-cur;let show=PHONE?d>=-2&&d<=7:d>=-3&&d<=10;
    // on a phone the pile only gains or drops records at rest, out of sight: changing what's drawn mid-flip can make iOS flash the whole pile
    if(PHONE&&!rest&&show!==shown[j]&&(d<-1||d>3))show=shown[j];
    const shade=PHONE?'#0000':d<0?'rgb(0 0 0/.06)':d===0?'#0000':'rgb(0 0 0/.16)'; // the pile goes unshaded: no record brightens as it reaches the top
    if(n.dataset.shade!==shade){n.dataset.shade=shade;n.style.setProperty('--shade',shade)}
    n.classList.toggle('cur',d===0);n.classList.toggle('fell',!PHONE&&d<0);
    if(shown[j]!==show){shown[j]=show;n.classList.toggle('gone',!show)}
  });
  if(!PHONE)queueNudge();
}
const setHash=()=>{clearTimeout(setHash.t);setHash.t=setTimeout(()=>{if(open.hidden)history.replaceState(null,'','#'+order[cur].slug)},250)};
function go(i,now){
  i=Math.max(0,Math.min(order.length-1,i));
  if(now){cur=i;aim=pos=i;vel=0;place(true);render()}
  else{aim=i;kick();if(i===cur)return;cur=i;place()}
  if(open.hidden)setHash();
  say();
}
// the record on top, for screen readers
function say(){const r=order[cur];$('#pos').textContent=`${r.title}, ${r.artist}, ${r.year}. ${cur+1} of ${order.length}`}

// Pull a record out: big sleeve to turn over (drag, click, arrow keys), details and a Spotify link beside it
// resting angle of a pulled-out sleeve: barely turned, unless you turn it
let REST,TILT;const restFor=()=>{REST=PHONE?0:-3;TILT=PHONE?0:-1};restFor(); // on a phone it faces you square
const open=$('#open'),sleeve=$('#sleeve'),stage=$('#stage'),lift=$('#lift');
let base=REST,ry=base,rx=TILT,sdrag=null,busy=false,timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
// the sleeve turns on a spring too: ry/rx say where it's headed, sv where it is now
const sv={ry:REST,rx:TILT,vy:0,vx:0},SK=190,SC=24;let sraf=0;
const paintS=()=>sleeve.style.transform=`rotateX(${sv.rx.toFixed(2)}deg) rotateY(${sv.ry.toFixed(2)}deg)`;
const snapS=(y,x)=>{sv.ry=y;sv.rx=x;sv.vy=sv.vx=0;paintS()};
function stick(t){
  if(sdrag){sraf=0;return}
  const dt=stick.t?Math.min(.032,(t-stick.t)/1000):1/60;stick.t=t;
  sv.vy+=(-SK*(sv.ry-ry)-SC*sv.vy)*dt;sv.ry+=sv.vy*dt;sv.vx+=(-SK*(sv.rx-rx)-SC*sv.vx)*dt;sv.rx+=sv.vx*dt;
  if(Math.abs(sv.ry-ry)<.02&&Math.abs(sv.vy)<.05&&Math.abs(sv.rx-rx)<.02&&Math.abs(sv.vx)<.05){snapS(ry,rx);sraf=0;stick.t=0;return}
  paintS();sraf=requestAnimationFrame(stick);
}
const setS=()=>{if(reduce){snapS(ry,rx);return}if(!sraf){stick.t=0;sraf=requestAnimationFrame(stick)}};
const turn=()=>{base+=180;ry=base;rx=TILT;setS()};
// where the front record sits in the crate, as a transform of the lifted sleeve
function fromCrate(rect){
  const src=rect||$('.rc.cur .fr',stack)?.getBoundingClientRect();if(!src)return'';
  const t=stage.getBoundingClientRect();
  const dx=src.left+src.width/2-(t.left+t.width/2),dy=src.top+src.height/2-(t.top+t.height/2);
  return `translate(${dx}px,${dy}px) scale(${src.width/t.width})`;
}
const prevP=$('#prevP'),nextP=$('#nextP');
function peek(b,r){b.classList.toggle('on',!!r);b.innerHTML=r?coverHTML(r):'';const h=b.nextElementSibling.nextElementSibling;h.innerHTML=r?`<b>${r.title}</b><i>${r.artist}</i>`:''}
prevP.onclick=()=>swap(-1);nextP.onclick=()=>swap(1);
[prevP,nextP].forEach(b=>b.addEventListener('pointerleave',()=>{if(!open.classList.contains('swapping'))open.classList.remove('hush')}));
function fill(r,noInfo){
  sleeve.innerHTML=`<div class="sh"></div><div class="sh b"></div><div class="face fr">${coverHTML(r)}</div><div class="face bk">${backHTML(r)}</div>${edgesHTML(r)}`;
  peek(prevP,order[cur-1]);peek(nextP,order[cur+1]);
  $('#ocount').textContent=`${cur+1} of ${order.length}`;
  if(!noInfo)info(r);
  base=REST;ry=base;rx=TILT;
  document.title=`${r.title} · Records`;
}
// every place a record can be played: Spotify by its ID, the rest by the album's UPC (scripts/vinyl-covers.mjs)
const SERVICES=[['spotify','Spotify'],['appleMusic','Apple Music'],['youtubeMusic','YouTube Music'],['tidal','Tidal'],['amazonMusic','Amazon Music'],['deezer','Deezer']];
const NEW_TAB='<span class="sr"> (opens in a new tab)</span>',PLAY_ICON='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M2.5 1.2v9.6c0 .5.5.8.9.5l7.4-4.8a.6.6 0 0 0 0-1L3.4.7c-.4-.3-.9 0-.9.5Z"/></svg>';
// the service a visitor picks is remembered on their device, and Play goes straight there from then on

crate.addEventListener('pointerdown',e=>{if(PHONE)return;drag={y:e.clientY,x:e.clientX,i:cur,rc:e.target.closest('.rc')};moved=false;crate.setPointerCapture(e.pointerId);crate.classList.add('dragging')});
crate.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dy=e.clientY-drag.y;if(Math.abs(dy)>6&&!moved){moved=true;crate.classList.add('pulling')}
  if(!moved)return;
  aim=Math.max(0,Math.min(order.length-1,drag.i+dy/PULL));kick(); // pull toward you to flip forward
  const j=Math.max(0,Math.min(order.length-1,drag.i+pulled(dy)));if(j!==cur){cur=j;place();setHash()}
});
// a click without a drag always opens the front record; only dragging, scrolling or the arrow keys flip
const end=()=>{if(drag&&!moved&&drag.rc){const j=+drag.rc.dataset.j,from={rect:drag.rc.querySelector('.fr').getBoundingClientRect(),flipped:j<cur};if(j!==cur)go(j);openRecord(false,from)}if(drag&&moved)go(cur,false);drag=null;moved=false;crate.classList.remove('dragging','pulling')};
crate.addEventListener('pointerup',end);crate.addEventListener('pointercancel',end);
// a finger on the pile: down flips the top record toward you, up stands the last one back up, a tap opens it; sideways does nothing
const openTop=()=>{const r=nodes[cur].querySelector('.fr').getBoundingClientRect();off.x=off.y=off.vx=off.vy=0;openRecord(false,{rect:r});render()};
const rub=e=>e*.3/(1+Math.abs(e)/300); // past the ends the pile gives, less the further you go
crate.addEventListener('pointerdown',e=>{
  if(!PHONE||busy||!e.isPrimary)return;
  cancelAnimationFrame(raf);raf=0;tick.t=0; // catch the pile where it is, mid-flight or not
  const now=performance.now();
  dd={x:e.clientX,y:e.clientY,p:pos,b:aim,t:now,lt:now,lx:e.clientX,ly:e.clientY,vx:0,vy:0,ax:null};
  crate.setPointerCapture(e.pointerId);crate.classList.add('pressing');
});
crate.addEventListener('pointermove',e=>{
  if(!dd)return;
  const dx=e.clientX-dd.x,dy=e.clientY-dd.y,now=performance.now(),dt=Math.max(8,now-dd.lt);
  dd.vx=.5*dd.vx+.5*(e.clientX-dd.lx)/dt;dd.vy=.5*dd.vy+.5*(e.clientY-dd.ly)/dt;dd.lt=now;dd.lx=e.clientX;dd.ly=e.clientY;
  if(!dd.ax){if(Math.hypot(dx,dy)<8)return;dd.ax=Math.abs(dx)>=Math.abs(dy)?'x':'y';crate.classList.remove('pressing')}
  if(dd.ax!=='y')return;
  const hi=order.length-1;let p=dd.p+dy/deckS;off.y=0;
  if(p<0){off.y=-rub(-p*deckS);p=0} // nothing before the first: it lifts a little
  if(p>hi)p=hi+rub((p-hi)*deckS)/deckS; // nothing after the last: it tips a little and stands back up
  pos=p;vel=0;
  const j=Math.min(hi,Math.round(p));if(j!==cur){cur=j;aim=j;place();setHash();say()} // the next record takes the top halfway through
  render();
});
const deckEnd=e=>{
  if(!dd)return;const s=dd;dd=null;crate.classList.remove('pressing');
  if(!s.ax){if(e.type==='pointerup'&&performance.now()-s.t<500&&Math.abs(s.p-s.b)<.05)openTop();else kick();return}
  if(s.ax!=='y'){kick();return}
  // one pull, one record: far enough or fast enough and it flips, carrying the flick's speed
  const v=s.vy*1000/deckS,moved=pos-s.p;let to=s.b;
  if(moved>.2||v>.9&&moved>.02)to=s.b+1;else if(moved<-.2||v<-.9&&moved<-.02)to=s.b-1;
  to=Math.max(0,Math.min(order.length-1,to));
  vel=Math.max(-12,Math.min(12,v));
  if(to!==s.b){buzz();crate.classList.add('swiped');try{localStorage.setItem('records-swiped','1')}catch{}}
  go(to);
};
crate.addEventListener('pointerup',deckEnd);crate.addEventListener('pointercancel',deckEnd);
try{if(localStorage.getItem('records-swiped'))crate.classList.add('swiped')}catch{}
// a light tick as a record lands: a vibration where there is one; on an iPhone, the tick a switch makes
function buzz(){
  if(navigator.vibrate){navigator.vibrate(8);return}
  const l=document.createElement('label');l.ariaHidden='true';l.style.display='none';l.innerHTML='<input type="checkbox" switch>';
  document.head.append(l);l.click();l.remove();
}
// a window narrowed past a phone's width becomes one, and back
phoneQ.addEventListener('change',()=>{PHONE=phoneQ.matches;restFor();root.classList.toggle('phone',PHONE);deckS=0;off.x=off.y=0;if(nodes.length){place(true);render();say()}});
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,iframe')||e.metaKey||e.ctrlKey)return;
  if(!open.hidden&&playMenu()){
    const items=$$('#playM a'),i=items.indexOf(document.activeElement),k={ArrowDown:1,ArrowUp:-1}[e.key];
    if(e.key==='Escape'){e.preventDefault();togglePlay(false,true)}
    if(k){e.preventDefault();items[(i+k+items.length)%items.length].focus()}
    if(e.key==='Home'||e.key==='End'){e.preventDefault();items.at(e.key==='Home'?0:-1).focus()}
    return;
  }
  if(!open.hidden){if(e.key==='Escape')closeRecord();const f={ArrowDown:1,ArrowRight:1,j:1,ArrowUp:-1,ArrowLeft:-1,k:-1}[e.key];if(f){e.preventDefault();swap(f)}return}
  if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button,a')){e.preventDefault();openRecord();return}
  const f={ArrowDown:1,ArrowRight:1,j:1,ArrowUp:-1,ArrowLeft:-1,k:-1}[e.key];
  if(f){e.preventDefault();go(cur+f)}
  if(e.key==='Home'){e.preventDefault();go(0)}
  if(e.key==='End'){e.preventDefault();go(order.length-1)}
});

function start(){
  const m=location.hash.match(/^#(record\/)?(.+)$/); // read the address before sorting rewrites it
  sortBy(sortKey);
  const j=m?order.findIndex(r=>r.slug===m[2]):-1;
  if(j>0)go(j,true);
  if(j>=0&&m[1])openRecord(true);
}
// Real covers and Spotify IDs, fetched by scripts/vinyl-covers.mjs; spines take their color from the cover's left edge
// grain: one 128px tile of soft noise, drawn once
{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),d=x.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=14}x.putImageData(d,0,0);
 document.documentElement.style.setProperty('--grain',`url(${c.toDataURL()})`)}
function edgeColor(src){return new Promise(res=>{const i=new Image();i.onload=()=>{try{const c=document.createElement('canvas');c.width=4;c.height=64;const x=c.getContext('2d');x.drawImage(i,0,0,i.naturalWidth*.03,i.naturalHeight,0,0,4,64);const d=x.getImageData(0,0,4,64).data;let r=0,g=0,b=0;for(let k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2]}const n=d.length/4;res(`rgb(${r/n|0},${g/n|0},${b/n|0})`)}catch{res(null)}};i.onerror=()=>res(null);i.crossOrigin='anonymous';i.src=src})}
// Casey's crate, or a visitor's crate when the address carries one (vinyl-make.html builds those links)
Promise.all([fetch('vinyl/covers.json').then(r=>r.ok?r.json():{}).catch(()=>({})),(window.visitorCrate||Promise.resolve(null)).catch(()=>null)]).then(async([m,v])=>{
  if(v&&v.records.length){RECORDS.splice(0,RECORDS.length,...v.records);document.title=VisitorCrate.crateName(v.name)}
  else RECORDS.forEach(r=>Object.assign(r,m[r.slug]||{}));
  // hold the crate back until every cover, front and back, is decoded, so it arrives whole
  const srcs=RECORDS.flatMap(r=>[r.front,r.back].filter(Boolean)).map(img);let n=0;
  const tick=()=>{n++;$('#loadN').textContent=`${n} of ${srcs.length}`;$('#loadBar').style.transform=`scaleX(${n/srcs.length})`};
  const load=src=>{const i=new Image();i.src=src;return i.decode().catch(()=>{}).then(tick)};
  await Promise.race([Promise.all([...srcs.map(load),...RECORDS.filter(r=>r.front).map(async r=>r.spine=await edgeColor(img(r.front)))]),new Promise(r=>setTimeout(r,12000))]);
  start();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
});
</script>
