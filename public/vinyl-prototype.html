<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Records</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
<style>
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Paper Mono';src:url('/fonts/paper-mono.woff2') format('woff2');font-weight:100 800;font-display:swap}
:root{--bg:#f4f2ee;--fg:#1a1a1a;--m:#666;--line:#cfccc6;--soft:#ebe8e2;--accent:#661864;--mono:'Paper Mono',ui-monospace,monospace;--flip:cubic-bezier(.25,1.2,.4,1);--S:min(380px,74vw,46vh)}
html[data-theme=dark]{--bg:#121212;--fg:#ecebe8;--m:#8f8f93;--line:#3a3a3d;--soft:#1c1c1e;--accent:#ca72c7}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
*{font-variant-numeric:tabular-nums}
html{background:var(--bg)}
body{font-family:'Instrument Sans',sans-serif;font-size:16px;line-height:1.55;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.page{height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden}
.page .crate{width:100%;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.top h1{font:500 15px var(--mono)}
.top h1 span{color:var(--m)}
.icon{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--m);transition:transform .5s var(--flip)}
.icon:hover{color:var(--fg)}
.icon:active{transform:scale(.96);transition-duration:.08s}
.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:14px;transition:transform .5s var(--flip),border-color .2s,opacity .2s}
.btn:hover{border-color:var(--m)}
.btn:active{transform:scale(.99);transition-duration:.08s}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed=true]{border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}
.sort{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:28px}

/* the crate */
.crate{position:relative;height:calc(var(--S)*1.95);margin-top:8px;perspective:1100px;perspective-origin:50% -22%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.crate.dragging{cursor:grabbing}
.crate:focus-visible .rc.cur .fr{outline:2px solid var(--accent);outline-offset:4px}
.stack{position:absolute;left:50%;bottom:calc(var(--S)*.75);width:0;height:0;transform-style:preserve-3d;transform:rotateX(var(--tilt,-16deg))}
.rc{position:absolute;left:calc(var(--S)/-2);bottom:0;width:var(--S);height:var(--S);transform-origin:50% 100%;transform-style:preserve-3d;transition:transform .7s var(--flip);cursor:pointer}
.rc.gone{visibility:hidden}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:2px;container-type:inline-size}
.face::after{content:'';position:absolute;inset:0;background:var(--shade,transparent);transition:background .7s;pointer-events:none}
.bk{transform:rotateX(180deg)}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
img.art{object-fit:cover;pointer-events:none;-webkit-user-drag:none;user-select:none}
.cover-type{position:absolute;left:7cqw;right:7cqw;top:6.5cqw;line-height:1.2}
.cover-type b{display:block;font:500 6cqw 'Instrument Sans',sans-serif}
.cover-type i{display:block;font:400 4.4cqw var(--mono);font-style:normal;opacity:.85;margin-top:1.2cqw}
.back-in{position:absolute;inset:0;padding:8cqw;font:400 3.6cqw/1.6 var(--mono);display:flex;flex-direction:column;justify-content:space-between}
.back-in b{display:block;font:500 5cqw/1.25 'Instrument Sans',sans-serif;margin-bottom:3cqw}
.back-in dl{display:grid;grid-template-columns:auto 1fr;gap:.6cqw 4cqw}
.back-in dt{opacity:.7}
.back-in dd{margin:0}
.floor{position:absolute;left:50%;bottom:calc(var(--S)*.75 - 2px);width:calc(var(--S)*1.3);height:calc(var(--S)*.5);transform:translate(-50%,0);background:radial-gradient(50% 30% at 50% 10%,#0000002a,#0000);pointer-events:none}
html[data-theme=dark] .floor{background:radial-gradient(50% 30% at 50% 10%,#00000080,#0000)}

.flips{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:-8px;font-size:14px}
.flips .count{min-width:64px;text-align:center;color:var(--m);font-family:var(--mono);font-size:13px}
.hint{text-align:center;color:var(--m);font-size:13px;margin-top:10px}

/* the record in front */
.caption{text-align:center;margin-top:22px;min-height:50px}
.caption b{display:block;font-weight:500;font-size:18px}
.caption span{color:var(--m);font-size:15px}

/* a record lifted out of the crate */
.open{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.open[hidden]{display:none}
.open.leaving{opacity:0;transition:opacity .18s}
.o-page{max-width:1120px;margin:0 auto;padding:28px 24px 64px}
.o-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start;margin-top:24px}
.o-grid>div:first-child{position:sticky;top:24px}
@media(max-width:860px){.o-grid{grid-template-columns:1fr;gap:16px}.o-grid>div:first-child{position:static}}
.stage{--O:min(460px,80vw);height:calc(var(--O) + 60px);display:grid;place-items:center;perspective:1600px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.sleeve{position:relative;width:var(--O);height:var(--O);transform-style:preserve-3d;transition:transform .25s ease-out}
.sleeve.settle{transition:transform .9s var(--flip)}
.sleeve.dragging{transition:none}
.sleeve.arrive{animation:arrive .9s var(--flip)}
@keyframes arrive{from{transform:translateY(55%) rotateX(58deg) scale(.7)}}
.sleeve .face{border-radius:2px}
.sleeve .bk{transform:rotateY(180deg)}
.sleeve .edge{position:absolute;top:0;left:calc(50% - 2px);width:4px;height:100%;transform:rotateY(-90deg) translateZ(calc(var(--O)/2));filter:brightness(.7)}
.sleeve .sh{position:absolute;inset:3% 3% 0;box-shadow:0 34px 60px -24px #0008;transform:translateZ(-2px)}
.stage-tools{display:flex;justify-content:center;margin-top:-16px}
.o-info h2{font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.o-info .by{font-size:19px;color:var(--m);margin-top:4px}
.facts{display:grid;grid-template-columns:96px 1fr;gap:6px 16px;margin-top:22px;font-size:15px}
.facts dt{color:var(--m)}
.facts dd{margin:0}
.note{margin-top:20px;font-size:14px;color:var(--m)}
.player,.noplayer{margin-top:20px}
.player{display:block;width:100%;height:352px;border:0;border-radius:12px;background:var(--soft)}
.noplayer{display:grid;place-items:center;height:152px;border-radius:12px;background:var(--soft);color:var(--m);font-size:14px;text-align:center;padding:16px}

@media(max-width:600px){
  .page{padding:24px 16px 80px}
  :root{--S:62vw}
  .crate{perspective:900px}
  .o-info h2{font-size:26px}
}
@media(prefers-reduced-motion:reduce){.rc,.face::after,.sleeve,.sleeve.settle{transition:none}.sleeve.arrive{animation:none}}
</style>
</head>
<body>
<main class="page">
  <h1 class="sr">Records</h1>
  <section class="crate" id="crate" tabindex="0" aria-roledescription="record crate" aria-label="Record crate. Arrow keys flip forward and back, Enter pulls out the front record.">
    <div class="floor"></div>
    <div class="stack" id="stack"></div>
  </section>
  <p class="sr" id="pos" aria-live="polite"></p>
</main>

<div class="open" id="open" hidden role="dialog" aria-modal="true" aria-labelledby="oTitle">
  <div class="o-page">
    <button class="btn" id="close">← Back to the crate</button>
    <div class="o-grid">
      <div>
        <div class="stage" id="stage"><div class="sleeve" id="sleeve"></div></div>
        <div class="stage-tools"><button class="btn" id="turn">Turn over</button></div>
      </div>
      <div class="o-info" id="oinfo"></div>
    </div>
  </div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const RECORDS=[
  {artist:'Lucinda Williams',title:'Car Wheels on a Gravel Road',year:1998,label:'Mercury',format:'LP',added:'2024-03-02',pal:['#c9803c','#2a1a10','#f3e4c8'],art:'sun'},
  {artist:'Wilco',title:'Yankee Hotel Foxtrot',year:2002,label:'Nonesuch',format:'2×LP',added:'2023-11-18',pal:['#1f3b57','#e9e1d0','#8fb1c9'],art:'grid'},
  {artist:'Gillian Welch',title:'Time (The Revelator)',year:2001,label:'Acony',format:'LP',added:'2025-06-14',pal:['#d9c9a3','#3d2f22','#9a6b3f'],art:'arch'},
  {artist:'Jason Isbell',title:'Southeastern',year:2013,label:'Southeastern Records',format:'LP',added:'2022-08-09',pal:['#e8e4dc','#232323','#b23a2a'],art:'type'},
  {artist:'Townes Van Zandt',title:'Live at the Old Quarter, Houston, Texas',year:1977,label:'Tomato',format:'2×LP',added:'2021-12-24',pal:['#2b2b2b','#e7d8b8','#b98a4a'],art:'rings'},
  {artist:'Uncle Tupelo',title:'No Depression',year:1990,label:'Rockville',format:'LP',added:'2020-05-30',pal:['#6f7d5a','#f1ead8','#3a4430'],art:'bands'},
  {artist:'Emmylou Harris',title:'Pieces of the Sky',year:1975,label:'Reprise',format:'LP',added:'2025-01-11',pal:['#a9c3cf','#28323a','#f4efe6'],art:'sun'},
  {artist:'Gram Parsons',title:'Grievous Angel',year:1974,label:'Reprise',format:'LP',added:'2023-04-22',pal:['#efe3cf','#5a2a2a','#c79b5b'],art:'stripes'},
  {artist:'Neil Young',title:'Harvest',year:1972,label:'Reprise',format:'LP',added:'2019-09-07',pal:['#e6d6b0','#4a3a26','#a8743a'],art:'rings'},
  {artist:'Sturgill Simpson',title:'Metamodern Sounds in Country Music',year:2014,label:'High Top Mountain',format:'LP',added:'2024-10-05',pal:['#5b2f6b','#f2d36b','#e98a4f'],art:'grid'},
  {artist:'Whiskeytown',title:'Strangers Almanac',year:1997,label:'Outpost',format:'LP',added:'2022-02-19',pal:['#33424a','#e4ddd0','#9fb0a8'],art:'stripes'},
  {artist:'Margo Price',title:'Midwest Farmer’s Daughter',year:2016,label:'Third Man',format:'LP',added:'2025-09-27',pal:['#f0c84b','#1d1d1d','#d4472f'],art:'bands'},
].map(r=>({...r,slug:(r.artist+' '+r.title).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}));

// Made-up cover art: one of a few patterns in each record's colors
function art(r){
  const [bg,fg,ac]=r.pal;let g='';
  if(r.art==='sun'){g=`<circle cx="50" cy="60" r="21" fill="${ac}"/>`;for(let i=0;i<6;i++)g+=`<rect x="0" y="${72+i*5}" width="100" height="${1.2+i*.5}" fill="${fg}" opacity=".85"/>`}
  if(r.art==='grid'){for(let x=0;x<6;x++)for(let y=0;y<5;y++)g+=`<circle cx="${17+x*13.2}" cy="${38+y*13}" r="${(x+y)%3?3.2:5.4}" fill="${(x*y)%4?fg:ac}"/>`}
  if(r.art==='arch'){for(let i=0;i<5;i++){const w=78-i*14;g+=`<path d="M${50-w/2} 100V${62-i*0}a${w/2} ${w/2} 0 0 1 ${w} 0V100z" fill="${i%2?bg:(i?ac:fg)}"/>`}}
  if(r.art==='type'){g=`<text x="7" y="96" font-family="Instrument Sans,sans-serif" font-weight="500" font-size="54" fill="${ac}" letter-spacing="-3">${r.title[0]}</text><rect x="7" y="40" width="40" height="2" fill="${fg}"/>`}
  if(r.art==='rings'){for(let i=6;i>0;i--)g+=`<circle cx="64" cy="66" r="${i*6}" fill="none" stroke="${i%2?ac:fg}" stroke-width="2.4"/>`}
  if(r.art==='bands'){g=`<rect y="44" width="100" height="18" fill="${fg}"/><rect y="62" width="100" height="18" fill="${ac}"/><rect y="80" width="100" height="20" fill="${fg}" opacity=".6"/>`}
  if(r.art==='stripes'){for(let i=-10;i<12;i++)g+=`<path d="M${i*10} 100L${i*10+60} 40" stroke="${i%3?fg:ac}" stroke-width="2.6"/>`;g+=`<rect width="100" height="40" fill="${bg}"/>`}
  return `<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/>${g}</svg>`;
}
const coverHTML=r=>r.front?`<img class="art" src="vinyl/${r.front}" alt="" decoding="async" draggable="false">`:`${art(r)}<div class="cover-type" style="color:${r.pal[1]}"><b>${r.artist}</b><i>${r.title}</i></div>`;
const spineBg=r=>r.spine||r.pal[0];
const spineHTML=r=>`<div class="spine-in" style="background:${r.pal[0]};color:${r.pal[1]}"><span><b>${r.artist}</b> <em>${r.title}</em></span><em>${r.year}</em></div>`;
const fmtDate=s=>new Date(s+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const backHTML=r=>r.back?`<img class="art" src="vinyl/${r.back}" alt="" decoding="async" draggable="false">`:`<div class="back-in" style="background:${spineBg(r)};color:${r.pal[1]}"><div><b>${r.title}</b>${r.artist}</div><dl><dt>Released</dt><dd>${r.year}</dd><dt>Label</dt><dd>${r.label}</dd><dt>Format</dt><dd>${r.format}, 33⅓ rpm</dd></dl></div>`;

// crate geometry, in px
const GAP=7,AHEAD=26,BEHIND=16;
let order=[...RECORDS],cur=0,sortKey='artist';
const stack=$('#stack'),crate=$('#crate');

function sortBy(k){
  sortKey=k;const keep=order[cur];
  const name=a=>a.replace(/^the /i,'');
  order=[...RECORDS].sort(k==='year'?(a,b)=>a.year-b.year:k==='added'?(a,b)=>b.added.localeCompare(a.added):(a,b)=>name(a.artist).localeCompare(name(b.artist)));
  build();go(0,true);
}
function build(){
  stack.innerHTML=order.map((r,j)=>`<div class="rc" data-j="${j}"><div class="face fr">${coverHTML(r)}</div><div class="face bk">${backHTML(r)}</div></div>`).join('');
}
// Records you've flipped past lean toward you, back cover up; the rest stand behind
function place(){
  $$('.rc',stack).forEach((n,j)=>{
    const d=j-cur;let z,a,shade;
    if(d<0){const k=-d-1;z=AHEAD+k*GAP;a=-(58+Math.min(k,8)*2);shade=`#00000000`}
    else if(d===0){z=0;a=10;shade='#0000'}
    else{z=-BEHIND-(d-1)*GAP;a=10+Math.min(d,6)*.5;shade=`rgb(0 0 0/${Math.min(.06*d,.4)})`}
    n.style.transform=`translateZ(${z}px) rotateX(${a}deg)`;
    n.style.zIndex=d<0?100+d:50-d;
    n.style.setProperty('--shade',shade);
    n.classList.toggle('cur',d===0);
    n.classList.toggle('gone',d<-9||d>14);
  });
}
function go(i,now){
  i=Math.max(0,Math.min(order.length-1,i));
  if(i===cur&&!now)return;cur=i;place();
  history.replaceState(null,'','#'+order[cur].slug);
  const r=order[cur];
  $('#pos').textContent=`${r.title}, ${r.artist}, ${r.year}. ${cur+1} of ${order.length}`;
}

// Pull a record out: big sleeve to turn over, details and the Spotify player beside it
const open=$('#open'),sleeve=$('#sleeve'),stage=$('#stage');
let base=18,ry=base,rx=-3,sdrag=null;
const setS=()=>sleeve.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
const settle=()=>{sleeve.classList.add('settle');clearTimeout(settle.t);settle.t=setTimeout(()=>sleeve.classList.remove('settle'),900)};
const turnLabel=()=>$('#turn').textContent=Math.round((base-18)/180)%2?'Turn back over':'Turn over';
function openRecord(){
  const r=order[cur];
  sleeve.innerHTML=`<div class="sh"></div><div class="face fr">${coverHTML(r)}</div><div class="face bk">${backHTML(r)}</div><div class="edge" style="background:${spineBg(r)}"></div>`;
  base=18;ry=base;rx=-3;turnLabel();
  $('#oinfo').innerHTML=`<h2 id="oTitle">${r.title}</h2><p class="by">${r.artist}</p>
      <dl class="facts"><dt>Released</dt><dd>${r.year}</dd><dt>Label</dt><dd>${r.label}</dd><dt>Format</dt><dd>${r.format}</dd><dt>Added</dt><dd>${fmtDate(r.added)}</dd></dl>
      <p class="note">${r.front?'Covers from the Cover Art Archive':'Stand-in cover art until the real covers are fetched'}</p>
    </div>
    ${r.spotify?`<iframe class="player" src="https://open.spotify.com/embed/album/${r.spotify}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="Play ${r.title} on Spotify"></iframe>`:`<div class="noplayer">No Spotify match for this one yet</div>`}`;
  open.classList.remove('leaving');open.hidden=false;open.scrollTop=0;
  document.documentElement.style.overflow='hidden';
  sleeve.classList.remove('arrive');void sleeve.offsetWidth;
  if(!reduce)sleeve.classList.add('arrive');setS();
  document.title=`${r.title} · Records`;
  if(!history.state?.open)history.pushState({open:1},'','#'+r.slug);
  $('#close').focus({preventScroll:true});
}
function closeRecord(fromPop){
  if(open.hidden)return;
  if(!fromPop&&history.state?.open){history.back();return}
  const done=()=>{open.hidden=true;open.classList.remove('leaving');$('#oinfo').innerHTML='';document.documentElement.style.overflow='';crate.focus({preventScroll:true})};
  if(reduce)done();else{open.classList.add('leaving');setTimeout(done,180)}
  document.title='Records';
}
addEventListener('popstate',()=>closeRecord(true));
$('#close').onclick=()=>closeRecord();
sleeve.addEventListener('animationend',()=>sleeve.classList.remove('arrive'));
stage.addEventListener('pointerdown',e=>{sdrag={x:e.clientX,ry};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');sleeve.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{
  if(sdrag){ry=sdrag.ry+(e.clientX-sdrag.x)*.6;rx=-3;setS();return}
  if(reduce||e.pointerType!=='mouse'||sleeve.classList.contains('arrive'))return;
  const b=stage.getBoundingClientRect();ry=base+((e.clientX-b.left)/b.width-.5)*14;rx=-3-((e.clientY-b.top)/b.height-.5)*10;setS();
});
const sEnd=()=>{if(!sdrag)return;const tap=Math.abs(ry-sdrag.ry)<2;sdrag=null;stage.classList.remove('dragging');sleeve.classList.remove('dragging');base=tap?base+180:18+180*Math.round((ry-18)/180);ry=base;rx=-3;settle();setS();turnLabel()};
stage.addEventListener('pointerup',sEnd);stage.addEventListener('pointercancel',sEnd);
stage.addEventListener('mouseleave',()=>{if(!sdrag&&!sleeve.classList.contains('arrive')){ry=base;rx=-3;settle();setS()}});
$('#turn').onclick=()=>{base+=180;ry=base;rx=-3;settle();setS();turnLabel()};

// scroll, drag, keys
let acc=0,lastWheel=0;
crate.addEventListener('wheel',e=>{
  const dir=Math.sign(e.deltaY);
  if((dir>0&&cur===order.length-1)||(dir<0&&cur===0))return; // let the page scroll at the ends
  e.preventDefault();
  const t=performance.now();if(t-lastWheel>200)acc=0;lastWheel=t;
  acc+=e.deltaY;if(Math.abs(acc)>=45){go(cur+Math.sign(acc));acc=0}
},{passive:false});
let drag=null,moved=false;
crate.addEventListener('pointerdown',e=>{drag={y:e.clientY,x:e.clientX,i:cur,rc:e.target.closest('.rc')};moved=false;crate.setPointerCapture(e.pointerId);crate.classList.add('dragging')});
crate.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dy=e.clientY-drag.y;if(Math.abs(dy)>6)moved=true;
  go(drag.i+Math.trunc(dy/48)); // pull toward you to flip forward
});
// a tap without a drag: the record in front flips forward, a flipped one comes back
const end=()=>{if(drag&&!moved&&drag.rc){const j=+drag.rc.dataset.j;j===cur?openRecord():go(j)}drag=null;moved=false;crate.classList.remove('dragging')};
crate.addEventListener('pointerup',end);crate.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,iframe')||e.metaKey||e.ctrlKey)return;
  if(!open.hidden){if(e.key==='Escape')closeRecord();return}
  if((e.key==='Enter'||e.key===' ')&&e.target===crate){e.preventDefault();openRecord();return}
  const f={ArrowDown:1,ArrowRight:1,j:1,ArrowUp:-1,ArrowLeft:-1,k:-1}[e.key];
  if(f){e.preventDefault();go(cur+f)}
  if(e.key==='Home'){e.preventDefault();go(0)}
  if(e.key==='End'){e.preventDefault();go(order.length-1)}
});

function start(){
  sortBy(sortKey);
  const j=order.findIndex(r=>r.slug===location.hash.slice(1));if(j>0)go(j,true);
}
// Real covers and Spotify IDs, fetched by scripts/vinyl-covers.mjs; spines take their color from the cover's left edge
function edgeColor(src){return new Promise(res=>{const i=new Image();i.onload=()=>{try{const c=document.createElement('canvas');c.width=4;c.height=64;const x=c.getContext('2d');x.drawImage(i,0,0,i.naturalWidth*.03,i.naturalHeight,0,0,4,64);const d=x.getImageData(0,0,4,64).data;let r=0,g=0,b=0;for(let k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2]}const n=d.length/4;res(`rgb(${r/n|0},${g/n|0},${b/n|0})`)}catch{res(null)}};i.onerror=()=>res(null);i.src=src})}
start();
fetch('vinyl/covers.json').then(r=>r.ok?r.json():{}).catch(()=>({})).then(async m=>{
  if(!Object.keys(m).length)return;
  RECORDS.forEach(r=>Object.assign(r,m[r.slug]||{}));
  await Promise.all(RECORDS.filter(r=>r.front).map(async r=>r.spine=await edgeColor('vinyl/'+r.front)));
  const keep=order[cur].slug;sortBy(sortKey);go(order.findIndex(r=>r.slug===keep),true);
});
