<style>
/* Search is the page; your crate grows beside it as a little leaning stack (as on the landing page), with Open and Copy link under it.
   On a phone the crate is a bar along the bottom that opens into a sheet. Tokens: /vinyl/tokens.css */
*,*::before,*::after{box-sizing:border-box}*{margin:0}
*{font-variant-numeric:tabular-nums}
html{background:var(--bg)}
body{font-family:var(--sans);font-size:var(--fs-3);line-height:1.45;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ring);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}

.mk{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:100vh;min-height:100dvh}
.find{padding:56px 56px 120px max(64px,env(safe-area-inset-left));min-width:0;max-width:820px}
.home{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-3);font-weight:500;color:var(--t1);margin-bottom:48px}
.home svg{width:22px;height:22px}
.home:hover{color:var(--fg)}
h1{font-size:var(--fs-6);font-weight:500;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.lede{margin-top:10px;color:var(--t2);font-size:var(--fs-4);max-width:34em;text-wrap:pretty}

/* the search: a floating pill, like the crate's */
.q{position:relative;margin-top:28px;max-width:560px}
.q svg{position:absolute;z-index:1;left:16px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--t2);pointer-events:none}
.q input{display:block;width:100%;height:52px;padding:0 20px 0 46px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--float);font-size:16px;outline:none;transition:border-color .2s}
.q input::placeholder{color:#7d7d82}
.q input:focus{border-color:#ffffff38}
.q input::-webkit-search-cancel-button{display:none}
.status{margin-top:14px;font-size:var(--fs-3);color:var(--m);min-height:22px}

/* results: a row per album; the circle on the right adds it or shows it's in */
.res{list-style:none;padding:0;display:grid;max-width:560px}
.hit{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) 32px;gap:14px;align-items:center;padding:8px;margin:0 -8px;border-radius:var(--r-in);transition:background-color .2s}
@media(hover:hover){.hit:hover{background:var(--hov)}}
.hit:active{background:var(--prs)}
.hit:focus-visible{outline:1px solid var(--ring);outline-offset:0}
.hit .cv{width:52px;height:52px;border-radius:var(--r-cover);overflow:hidden;background:var(--soft)}
.hit img{display:block;width:100%;height:100%;object-fit:cover}
.hit .tx{min-width:0;display:grid}
.hit b,.hit .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit b{font-weight:500;font-size:16px;line-height:1.3}
.hit .a{color:var(--m);font-size:14px}
.add{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);transition:background-color .2s,color .2s,border-color .2s,transform .5s var(--ease)}
.add svg{width:14px;height:14px}
.add .on{display:none}
.hit[aria-pressed=true] .add{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.hit[aria-pressed=true] .add .on{display:block}.hit[aria-pressed=true] .add .off{display:none}
.hit[aria-busy=true] .add{opacity:.5}
.hit:active .add{transform:scale(.92);transition-duration:.08s}

/* your crate */
.mine{position:sticky;top:0;height:100vh;height:100dvh;border-left:1px solid var(--line);padding:56px max(40px,env(safe-area-inset-right)) 40px 40px;display:flex;flex-direction:column;min-width:0;overflow-y:auto;scrollbar-width:none}
.bar{display:none}
.stk{position:relative;display:block;width:240px;max-width:100%;aspect-ratio:1/1.28;flex:none}
.stk .r{position:absolute;left:0;right:0;bottom:0;aspect-ratio:1;transform-origin:50% 100%;transform:translateY(calc(var(--j) * -9%)) scale(calc(1 - var(--j) * .05));filter:brightness(calc(1 - var(--j) * .14));box-shadow:0 10px 24px #0007;border-radius:var(--r-cover);overflow:hidden;background:var(--soft);transition:transform .5s var(--ease)}
.stk .r img{display:block;width:100%;height:100%;object-fit:cover}
.stk .r.new{animation:drop .6s var(--ease)}
@keyframes drop{from{transform:translateY(-24%) scale(1.02);opacity:0}}
.stk.empty .r{background:transparent;box-shadow:none;border:1px dashed var(--line2);filter:none;display:grid;place-items:center}
.stk.empty .r:not([style*="--j:0"]){border-color:var(--line)}
.stk.empty svg{width:36px;height:36px;color:var(--t2)}
.who{margin-top:28px;display:grid;gap:4px}
.who label{font-size:var(--fs-2);color:var(--m)}
.nm{display:block;width:100%;height:40px;padding:0;border:0;border-bottom:1px solid var(--line);background:none;font-size:20px;font-weight:500;outline:none;transition:border-color .2s;border-radius:0}
.nm::placeholder{color:var(--t3)}
.nm:hover{border-color:var(--line2)}.nm:focus{border-color:var(--t2)}
.nm:focus-visible{outline:none}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:20px;list-style:none;padding:0}
.shelf li{position:relative;aspect-ratio:1}
.shelf img{display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--r-cover);background:var(--soft)}
.shelf .x{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:1px solid var(--line);color:var(--t1);opacity:0;transition:opacity .2s,transform .5s var(--ease)}
.shelf .x svg{width:10px;height:10px}
.shelf li:hover .x,.shelf .x:focus-visible{opacity:1}
@media(hover:none){.shelf .x{opacity:1}}
.shelf .x:active{transform:scale(.92);transition-duration:.08s}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:44px;padding:0 20px;border-radius:var(--r-pill);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-3);font-weight:500;white-space:nowrap;transition:transform .5s var(--ease),background-color .2s,opacity .2s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97);transition-duration:.08s}
.btn:focus-visible{outline:1px solid var(--ring);outline-offset:2px}
.btn.w{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.btn.w:hover{background:#e7e7e8}
.btn[aria-disabled=true]{opacity:.35;cursor:default;pointer-events:none}
.btn svg{width:16px;height:16px}

@media(max-width:700px){
  .mk{display:block}
  .find{padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 140px max(20px,env(safe-area-inset-left))}
  .home{margin-bottom:28px}
  h1{font-size:var(--fs-5)}
  .lede{font-size:var(--fs-3);margin-top:6px}
  .q{margin-top:20px}
  /* the crate: a bar along the bottom; tap it and it rises as a sheet */
  .mine{position:fixed;z-index:var(--z-pop);left:0;right:0;top:auto;bottom:0;height:auto;max-height:86dvh;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-panel) var(--r-panel) 0 0;background:var(--sheet);box-shadow:var(--float);padding:0 max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  .bar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:14px 0 0;min-height:76px}
  .bar .stk{width:48px}
  .bar .stk.empty svg{width:16px;height:16px}
  .bar .tx{flex:1;min-width:0;display:grid}
  .bar b{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar span{font-size:var(--fs-2);color:var(--m)}
  .bar .chev{width:20px;height:20px;color:var(--t2);transition:rotate .5s var(--ease)}
  .mine.up .bar .chev{rotate:180deg}
  .mine>.stk{display:none}
  .more{display:none;padding-bottom:4px}
  .mine.up .more{display:block}
  .who{margin-top:20px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
  .acts .btn{flex:1;justify-content:center}
  .scrim{position:fixed;inset:0;z-index:var(--z-raised);background:#0008;opacity:0;pointer-events:none;transition:opacity .25s var(--out)}
  .mine.up~.scrim{opacity:1;pointer-events:auto}
}
@media(min-width:701px){.scrim{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="mk">
<main class="find">
  <a class="home" href="/" aria-label="Crate Dig home"><svg viewBox="0 0 350 350" fill="currentColor" aria-hidden="true"><path d="M157.145 0.0252864C160.03 -0.268345 162.5 2.03448 162.5 4.94184V20.1458C162.5 22.7538 160.496 24.9183 157.911 25.2131C83.1157 33.7382 25.0003 97.5464 25 175C25 252.453 83.1156 316.262 157.911 324.787C160.496 325.082 162.5 327.245 162.5 329.853V345.057C162.5 347.965 160.03 350.268 157.145 349.975C68.8822 340.985 0 266.079 0 175C0.000299011 83.9203 68.8823 9.01514 157.145 0.0252864Z"/><path d="M187.5 4.94282C187.5 2.03527 189.97 -0.268454 192.855 0.0252864C281.118 9.01516 350 83.9211 350 175.001C350 266.08 281.118 340.985 192.855 349.975C189.97 350.269 187.5 347.966 187.5 345.058V329.853C187.5 327.245 189.504 325.082 192.089 324.787C266.884 316.262 325 252.454 325 175.001C325 97.5471 266.884 33.7373 192.089 25.2121C189.504 24.9174 187.5 22.7538 187.5 20.1458V4.94282Z"/><path d="M157.017 50.6613C159.943 50.2375 162.5 52.5624 162.5 55.5269V70.8483C162.5 73.3761 160.618 75.495 158.133 75.9195C110.937 83.9772 75.0003 125.27 75 175C75 224.729 110.936 266.022 158.133 274.079C160.618 274.504 162.5 276.623 162.5 279.151V294.473C162.5 297.438 159.943 299.763 157.017 299.34C96.5016 290.577 50 238.246 50 175C50.0003 111.753 96.5018 59.4244 157.017 50.6613Z"/><path d="M187.5 55.5279C187.5 52.5633 190.057 50.2374 192.983 50.6613C253.498 59.4244 300 111.754 300 175.001C300 238.247 253.498 290.576 192.983 299.339C190.057 299.763 187.5 297.438 187.5 294.473V279.151C187.5 276.623 189.381 274.504 191.867 274.079C239.063 266.022 275 224.73 275 175.001C275 125.271 239.064 83.9772 191.867 75.9195C189.381 75.4951 187.5 73.3762 187.5 70.8483V55.5279Z"/><path d="M156.713 101.879C159.712 101.123 162.5 103.489 162.5 106.59V122.448C162.5 124.733 160.947 126.705 158.79 127.447C139.132 134.215 125 152.948 125 175C125 197.051 139.132 215.785 158.79 222.553C160.947 223.295 162.5 225.266 162.5 227.552V243.409C162.5 246.51 159.712 248.877 156.713 248.121C124.13 239.916 100 210.29 100 175C100 139.709 124.13 110.084 156.713 101.879Z"/><path d="M187.5 106.59C187.5 103.489 190.287 101.123 193.286 101.878C225.869 110.083 250 139.709 250 175.001C250 210.291 225.869 239.917 193.286 248.122C190.287 248.877 187.5 246.51 187.5 243.41V227.551C187.5 225.266 189.053 223.294 191.21 222.552C210.868 215.784 225 197.052 225 175.001C225 152.949 210.868 134.215 191.21 127.447C189.053 126.705 187.5 124.734 187.5 122.448V106.59Z"/><path fill-rule="evenodd" d="M174.622 150.689C188.429 150.689 199.622 161.91 199.622 175.751C199.622 189.593 188.429 200.814 174.622 200.814C160.815 200.814 149.622 189.593 149.622 175.751C149.622 161.91 160.815 150.689 174.622 150.689ZM174.622 170.739C171.861 170.739 169.622 172.983 169.622 175.751C169.622 178.52 171.861 180.764 174.622 180.764C177.383 180.764 179.622 178.52 179.622 175.751C179.622 172.983 177.383 170.739 174.622 170.739Z"/></svg><span>Crate Dig</span></a>
  <h1>Make your crate</h1>
  <p class="lede">Find the records you own and add them. Your crate lives in its link.</p>
  <div class="q"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
    <label class="sr" for="q">Search for records</label><input id="q" type="search" autocomplete="off" placeholder="Artist or album" aria-describedby="status"></div>
  <p class="status" id="status" aria-live="polite"></p>

</main>

<aside class="mine" id="mine" aria-labelledby="mineH">
  <button class="bar" id="bar" type="button" aria-expanded="false" aria-controls="more"><span class="stk" id="stk2" aria-hidden="true"></span><span class="tx"><b id="barH">My crate</b><span id="barS">Records you add land here</span></span><svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l5-5 5 5"/></svg></button>

      <a class="btn w" id="openC" aria-disabled="true">Open crate</a>

<script src="vinyl/visitor-crate.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const V=window.VisitorCrate,KEY='vinyl-make';
let crate=[]; // records in the order they were added
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=r=>r.src==='m'&&r.group?'g'+r.group:(r.src||'a')+r.id; // one per album; Discogs and Apple IDs can collide
const has=k=>crate.some(r=>key(r)===k);

const PLUS='<svg class="off" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg>',CHECK='<svg class="on" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
const XS='<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2l6 6M8 2L2 8"/></svg>';
const EMPTY='<span class="r" style="--j:2"></span><span class="r" style="--j:1"></span><span class="r" style="--j:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>';
// the stack shows the last three records added, newest in front
let shown='';
function stack(el){
  const top=crate.slice(-3).reverse(),sig=top.map(key).join();
  el.classList.toggle('empty',!top.length);
  if(!top.length){el.innerHTML=EMPTY;return}
  const fresh=shown&&sig!==shown&&top[0]&&!shown.split(',').includes(key(top[0]));
  el.innerHTML=[...top].reverse().map((r,i)=>{const j=top.length-1-i;return `<span class="r${fresh&&j===0?' new':''}" style="--j:${j}"><img src="${esc(r.thumb)}"${r.fallback?` data-fallback="${esc(r.fallback)}"`:''} alt=""></span>`}).join('');
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({name:$('#name').value,crate}))}catch{}}
function render(){
  const name=$('#name').value,n=crate.length,sig=crate.slice(-3).reverse().map(key).join();
  $('#mineH').textContent=$('#barH').textContent=V.crateName(name);
  $('#barS').textContent=n?'Open it, or copy its link':'Records you add land here';
  stack($('#stk'));stack($('#stk2'));shown=sig;
  $('#row').innerHTML=crate.map(r=>`<li><img src="${esc(r.thumb)}"${r.fallback?` data-fallback="${esc(r.fallback)}"`:''} alt="${esc(r.title)} by ${esc(r.artist)}" width="64" height="64"><button class="x" data-k="${key(r)}" aria-label="Remove ${esc(r.title)}">${XS}</button></li>`).join('');
  const url=n?V.link(name,crate):'';
  $('#openC').toggleAttribute('href',!!n);if(n)$('#openC').href=url;
  $('#openC').setAttribute('aria-disabled',!n);$('#copy').setAttribute('aria-disabled',!n);
  document.querySelectorAll('.hit').forEach(b=>b.setAttribute('aria-pressed',has(b.dataset.k)));
  save();
}

// search: wait for a pause in typing, and keep answers so going back costs nothing
let results=[],timer=0,seq=0;const cache={};
function show(list){
  results=list;
  $('#grid').innerHTML=list.map(r=>`<li><button class="hit" type="button" data-k="${key(r)}" aria-pressed="false"><span class="cv"><img src="${esc(r.thumb)}" alt="" loading="lazy"${r.fallback?` data-fallback="${esc(r.fallback)}"`:''}></span><span class="tx"><b>${esc(r.title)}</b><span class="a">${esc(r.artist)}${r.year?`, ${esc(r.year)}`:''}</span></span><span class="add" aria-hidden="true">${PLUS}${CHECK}</span></button></li>`).join('');
  render();
}
async function find(term){
  const id=++seq;
  if(term.length<2){$('#status').textContent='';show([]);return}
  if(cache[term]){$('#status').textContent='';show(cache[term]);return}
  $('#status').textContent='Searching…';
  try{
    const list=await V.search(term);if(id!==seq)return;
    cache[term]=list;show(list);
    $('#status').textContent=list.length?'':'No records found. Try the artist’s name.';
  }catch{if(id===seq)$('#status').textContent='Search isn’t answering. Try again in a minute.'}
}
// a pressing without its own cover borrows the album's; with neither, the square stays blank
document.addEventListener('error',e=>{const i=e.target;if(i.dataset?.fallback){i.src=i.dataset.fallback;delete i.dataset.fallback}else if(i.tagName==='IMG')i.style.visibility='hidden'},true);
$('#q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>find(e.target.value.trim()),450)});

const adding=new Set();
$('#grid').addEventListener('click',async e=>{
  const b=e.target.closest('.hit');if(!b)return;
  const k=b.dataset.k;
  if(adding.has(k))return;
  if(has(k)){crate=crate.filter(r=>key(r)!==k);render();return}
  if(crate.length>=V.MAX){$('#status').textContent=`A crate holds ${V.MAX} records.`;return}
  let r=results.find(r=>key(r)===k);
  if(r.group){ // a MusicBrainz album: find its best pressing first
    adding.add(k);b.setAttribute('aria-busy','true');
    try{r=await V.pick(r)}catch{$('#status').textContent='Couldn’t add that one. Try again in a moment.';adding.delete(k);b.removeAttribute('aria-busy');render();return}
    adding.delete(k);b.removeAttribute('aria-busy');
  }
  if(!has(k)&&crate.length<V.MAX)crate.push(r);
  render();
});
$('#row').addEventListener('click',e=>{
  const x=e.target.closest('.x');if(!x)return;
  const i=crate.findIndex(r=>key(r)===x.dataset.k);crate.splice(i,1);render();
  const c=$('#row').children[Math.min(i,crate.length-1)];(c?c.querySelector('.x'):$('#q')).focus({preventScroll:true});
});
$('#name').addEventListener('input',render);
// copy: the button says so, with a check, then goes back
$('#copy').addEventListener('click',async()=>{
  const b=$('#copy'),was='Copy link';
  try{await navigator.clipboard.writeText($('#openC').href);b.innerHTML='<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>Copied'}catch{b.textContent='Couldn’t copy'}
  setTimeout(()=>{b.innerHTML=was},1600);
});

// on a phone the crate is a bar; tap it for the sheet, tap outside or the bar again to put it away
const mine=$('#mine');
function sheet(up){mine.classList.toggle('up',up);$('#bar').setAttribute('aria-expanded',up)}
$('#bar').addEventListener('click',()=>sheet(!mine.classList.contains('up')));
$('#scrim').addEventListener('click',()=>sheet(false));
addEventListener('keydown',e=>{if(e.key==='Escape'&&mine.classList.contains('up')){sheet(false);$('#bar').focus({preventScroll:true})}});

// start from a crate in the address (an edit link), or the last one made on this browser
(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('d')||p.get('m')||p.get('c')){
    $('#name').value=p.get('by')||'';$('#status').textContent='Gathering records…';
    try{crate=await V.fromAddress(p);$('#status').textContent=''}catch{$('#status').textContent='Couldn’t load that crate. Try again in a minute.'}
  }else{
    try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){$('#name').value=s.name||'';crate=s.crate||[]}}catch{}
  }
  render();
  // a search started on the landing page carries on here
  const q=(p.get('q')||'').trim();if(q){$('#q').value=q;find(q)}
})();
</script>
</body>
</html>
