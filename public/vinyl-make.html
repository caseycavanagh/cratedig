<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script>
<script defer src="/_vercel/insights/script.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Make your crate</title>
<meta name="description" content="Pick your records and share them as a crate anyone can flip through.">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Records">
<!-- link previews: the card is src/lib/og.tsx, the icons scripts/icons.mjs -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Records">
<meta property="og:title" content="Make your crate">
<meta property="og:description" content="Pick your records and share them as a crate anyone can flip through.">
<meta property="og:url" content="https://cratedig.vercel.app/vinyl-make.html">
<meta property="og:image" content="https://cratedig.vercel.app/og/make">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Make your crate: your records, flipped through like a crate">
<meta name="twitter:card" content="summary_large_image">
<script>document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
<style>
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Paper Mono';src:url('/fonts/paper-mono.woff2') format('woff2');font-weight:100 800;font-display:swap}
:root{--bg:#f4f2ee;--fg:#1a1a1a;--m:#666;--line:#cfccc6;--soft:#ebe8e2;--accent:#661864;--mono:'Paper Mono',ui-monospace,monospace;--flip:cubic-bezier(.25,1.2,.4,1)}
html[data-theme=dark]{--bg:#121212;--fg:#ecebe8;--m:#8f8f93;--line:#3a3a3d;--soft:#1c1c1e;--accent:#ca72c7}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
*{font-variant-numeric:tabular-nums}
html{background:var(--bg)}
body{font-family:'Instrument Sans',sans-serif;font-size:16px;line-height:1.55;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}

.page{max-width:768px;margin:0 auto;padding:56px 24px 120px}
h1{font-size:32px;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.lede{color:var(--m);margin-top:8px;max-width:520px}
label.f{display:block;margin-top:36px;font-size:14px;color:var(--m)}
.in{display:block;width:100%;margin-top:6px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;outline:none;transition:border-color .2s}
.in:hover{border-color:var(--m)}
.in:focus-visible{border-color:var(--fg);outline:2px solid var(--accent);outline-offset:2px}
.in::placeholder{color:var(--m)}
.name{max-width:320px}

.btn{all:unset;cursor:pointer;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:15px;transition:transform .5s var(--flip),border-color .2s,opacity .2s}
.btn:hover{border-color:var(--m)}
.btn:active{transform:scale(.99);transition-duration:.08s}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{border-color:var(--fg)}
.btn[aria-disabled=true]{opacity:.35;cursor:default;pointer-events:none}

/* your crate */
.mine{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.mine-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mine-h h2{font-size:20px;font-weight:500}
.mine-h .n{color:var(--m);font-size:14px}
.row{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 12px;margin:0 -2px;scroll-snap-type:x proximity;min-height:120px}
.row:empty::before{content:'Records you add show up here';color:var(--m);font-size:14px;align-self:center}
.mini{position:relative;flex:none;width:96px;scroll-snap-align:start}
.mini img{display:block;width:96px;height:96px;border-radius:2px;background:var(--soft);box-shadow:0 1px 2px #0000002a}
.mini .x{all:unset;cursor:pointer;position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--m);font-size:14px;line-height:1;transition:transform .5s var(--flip),color .2s}
.mini .x:hover{color:var(--fg);border-color:var(--m)}
.mini .x:active{transform:scale(.96);transition-duration:.08s}
.mini .x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{animation:in .5s var(--flip)}
@keyframes in{from{transform:scale(.9);opacity:0}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.copied{font-size:14px;color:var(--m);align-self:center;opacity:0;transition:opacity .2s}
.copied.on{opacity:1}

/* search */
.status{margin-top:12px;font-size:14px;color:var(--m);min-height:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 16px;margin-top:8px;list-style:none;padding:0}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.page{padding:40px 16px 96px}h1{font-size:28px}}
.alb{all:unset;cursor:pointer;display:block;width:100%;transition:transform .5s var(--flip)}
.alb:active{transform:scale(.99);transition-duration:.08s}
.alb:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
.alb .cv{position:relative;aspect-ratio:1;border-radius:2px;overflow:hidden;background:var(--soft);box-shadow:0 1px 2px #0000002a}
.alb img{display:block;width:100%;height:100%;object-fit:cover}
.alb .tag{position:absolute;right:8px;bottom:8px;height:26px;padding:0 10px;border-radius:999px;display:flex;align-items:center;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .5s var(--flip)}
.alb:hover .tag,.alb:focus-visible .tag,.alb[aria-pressed=true] .tag{opacity:1;transform:none}
@media(hover:none){.alb .tag{opacity:1;transform:none}}
.alb .t{display:block;margin-top:8px;font-size:15px;line-height:1.3;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.alb .a{display:block;font-size:14px;color:var(--m);line-height:1.35;margin-top:2px}
.alb .y{font-family:var(--mono);font-size:12px}
@media(prefers-reduced-motion:reduce){.mini{animation:none}.alb .tag{transition:opacity .2s}}
</style>
</head>
<body>
<main class="page">
  <h1>Make your crate</h1>
  <p class="lede">Search for records you own, add them, and get a link to a crate of your own. The whole crate lives in its link.</p>

  <label class="f" for="name">Your name</label>
  <input class="in name" id="name" autocomplete="given-name" maxlength="40" placeholder="Sam">

  <section class="mine" aria-labelledby="mineH">
    <div class="mine-h"><h2 id="mineH">My crate</h2><span class="n" id="count" aria-live="polite">0 records</span></div>
    <div class="row" id="row" role="list"></div>
    <div class="actions">
      <a class="btn primary" id="openC" aria-disabled="true">Open crate →</a>
      <button class="btn" id="copy" aria-disabled="true">Copy link</button>
      <span class="copied" id="copied" aria-live="polite"></span>
    </div>
  </section>

  <label class="f" for="q">Add records</label>
  <input class="in" id="q" type="search" autocomplete="off" placeholder="Artist or album" aria-describedby="status">
  <p class="status" id="status" aria-live="polite"></p>
  <ul class="grid" id="grid"></ul>
</main>

<script src="vinyl/visitor-crate.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const V=window.VisitorCrate,KEY='vinyl-make';
let crate=[]; // records in the order they were added
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=r=>r.src==='m'&&r.group?'g'+r.group:(r.src||'a')+r.id; // one per album; Discogs and Apple IDs can collide
const has=k=>crate.some(r=>key(r)===k);

function save(){try{localStorage.setItem(KEY,JSON.stringify({name:$('#name').value,crate}))}catch{}}
function render(){
  const name=$('#name').value,n=crate.length;
  $('#mineH').textContent=V.crateName(name);
  $('#count').textContent=n===1?'1 record':`${n} records`;
  $('#row').innerHTML=crate.map(r=>`<div class="mini" role="listitem"><img src="${esc(r.thumb)}"${r.fallback?` data-fallback="${esc(r.fallback)}"`:''} alt="${esc(r.title)} by ${esc(r.artist)}" width="96" height="96"><button class="x" data-k="${key(r)}" aria-label="Remove ${esc(r.title)}">×</button></div>`).join('');
  const url=n?V.link(name,crate):'';
  $('#openC').toggleAttribute('href',!!n);if(n)$('#openC').href=url;
  $('#openC').setAttribute('aria-disabled',!n);$('#copy').setAttribute('aria-disabled',!n);
  document.querySelectorAll('.alb').forEach(b=>{const on=has(b.dataset.k);b.setAttribute('aria-pressed',on);b.querySelector('.tag').textContent=on?'Added':'Add'});
  save();
}

// search: wait for a pause in typing, and keep answers so going back costs nothing
let results=[],timer=0,seq=0;const cache={};
function show(list){
  results=list;
  $('#grid').innerHTML=list.map(r=>`<li><button class="alb" data-k="${key(r)}" aria-pressed="false"><span class="cv"><img src="${esc(r.thumb)}" alt="" loading="lazy"${r.fallback?` data-fallback="${esc(r.fallback)}"`:''}><span class="tag">Add</span></span><span class="t">${esc(r.title)}</span><span class="a">${esc(r.artist)} <span class="y">${esc(r.year)}</span></span></button></li>`).join('');
  render();
}
async function find(term){
  const id=++seq;
  if(term.length<2){$('#status').textContent='';show([]);return}
  if(cache[term]){$('#status').textContent='';show(cache[term]);return}
  $('#status').textContent='Searching…';
  try{
    const list=await V.search(term);if(id!==seq)return;
    cache[term]=list;show(list);
    $('#status').textContent=list.length?'':'No records found. Try the artist’s name.';
  }catch{if(id===seq)$('#status').textContent='Search isn’t answering. Try again in a minute.'}
}
// a pressing without its own cover borrows the album's; with neither, the square stays blank
document.addEventListener('error',e=>{const i=e.target;if(i.dataset?.fallback){i.src=i.dataset.fallback;delete i.dataset.fallback}else if(i.tagName==='IMG')i.style.visibility='hidden'},true);
$('#q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>find(e.target.value.trim()),450)});

const adding=new Set();
$('#grid').addEventListener('click',async e=>{
  const b=e.target.closest('.alb');if(!b)return;
  const k=b.dataset.k;
  if(adding.has(k))return;
  if(has(k)){crate=crate.filter(r=>key(r)!==k);render();return}
  if(crate.length>=V.MAX){$('#status').textContent=`A crate holds ${V.MAX} records.`;return}
  let r=results.find(r=>key(r)===k);
  if(r.group){ // a MusicBrainz album: find its best pressing first
    adding.add(k);b.querySelector('.tag').textContent='Adding…';
    try{r=await V.pick(r)}catch{$('#status').textContent='Couldn’t add that one. Try again in a moment.';adding.delete(k);render();return}
    adding.delete(k);
  }
  if(!has(k)&&crate.length<V.MAX)crate.push(r);
  render();
});
$('#row').addEventListener('click',e=>{
  const x=e.target.closest('.x');if(!x)return;
  const i=crate.findIndex(r=>key(r)===x.dataset.k);crate.splice(i,1);render();
  const c=$('#row').children[Math.min(i,crate.length-1)];(c?c.querySelector('.x'):$('#q')).focus();
});
$('#name').addEventListener('input',render);
$('#copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText($('#openC').href);$('#copied').textContent='Copied'}catch{$('#copied').textContent='Couldn’t copy. Use the Open crate link.'}
  $('#copied').classList.add('on');setTimeout(()=>$('#copied').classList.remove('on'),1800);
});

// start from a crate in the address (an edit link), or the last one made on this browser
(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('d')||p.get('m')||p.get('c')){
    $('#name').value=p.get('by')||'';$('#status').textContent='Gathering records…';
    try{crate=await V.fromAddress(p);$('#status').textContent=''}catch{$('#status').textContent='Couldn’t load that crate. Try again in a minute.'}
  }else{
    try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){$('#name').value=s.name||'';crate=s.crate||[]}}catch{}
  }
  render();
})();
</script>
</body>
</html>
