<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Records: letter index</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Sticker sheet: other ways to jump through the records by letter, phone first, in the Cosmos-feel dress of
   vinyl-cosmos.html. Every phone is live: try each one. Data from vinyl-prototype.html and vinyl/covers.json. */
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 500;font-display:swap}
:root{--bg:#121212;--fg:#fff;--m:#8e8e93;--m2:#5f5f64;--line:rgba(255,255,255,.13);--soft:#232325;--glass:rgba(30,30,32,.74);--spring:cubic-bezier(.2,1.25,.35,1)}
*,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
html{background:var(--bg);color-scheme:dark}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:16px;line-height:1.4;color:var(--fg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:inset(50%);white-space:nowrap}
.wrap{max-width:1500px;margin:0 auto;padding:40px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.top h1{font-size:32px;font-weight:500;letter-spacing:-.02em}
.top p{color:var(--m);max-width:640px;margin-top:6px}
.tools{display:flex;align-items:center;gap:10px;font-size:14px}
.picks{color:var(--m)}
.tool{height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500}
.tool:hover{background:var(--soft)}
.tool:active{transform:scale(.97)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px 20px}
.st{position:relative;padding:44px 14px 16px;border-radius:26px;background:#19191b}
.st .id{position:absolute;top:15px;left:18px;right:52px;font-size:14px;color:var(--m)}.st .id b{color:var(--fg);font-weight:500;margin-right:6px}
.st .use{margin:14px 4px 0;font-size:14px;color:var(--m);line-height:1.45}
.star{position:absolute;top:8px;right:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--m);font-size:17px}
.star:hover{background:var(--soft);color:var(--fg)}
.st.picked{box-shadow:inset 0 0 0 2px #fff}.st.picked .star{color:#fff}

/* a phone */
.ph{position:relative;width:300px;height:620px;margin:0 auto;border-radius:44px;background:var(--bg);overflow:hidden;box-shadow:0 0 0 7px #2a2a2c,0 0 0 8px #3a3a3d;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none}
.ph .stage{position:absolute;left:0;right:0;top:88px;display:grid;justify-items:center}
.ph .pile{position:relative;width:216px;height:216px}
.ph .pile i{position:absolute;inset:0;border-radius:4px;background:#2a2a2d;box-shadow:0 1px 0 #0006}
.ph .pile i:nth-child(1){transform:translate(0,-12px) scale(.94);background:#232325}
.ph .pile i:nth-child(2){transform:translate(0,-6px) scale(.97);background:#2c2c2f}
.ph .pile img,.ph .pile .pl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 18px 30px -12px #000c}
.ph .pile .pl{display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-weight:500;font-size:15px;line-height:1.15}
.ph .pile .pl small{font-weight:400;opacity:.7}
.ph .t{margin-top:18px;width:216px;text-align:left}
.ph .t b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .t span{color:var(--m);font-size:14px}
.ph .pos{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:13px;color:var(--m)}
.ph .q{position:absolute;left:14px;right:14px;bottom:18px;height:50px;border-radius:99px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;padding:0 18px;color:#7d7d82;font-size:15px}
.ph .q svg{width:18px;height:18px;color:#a5a5aa}
.ph .flip{animation:in .45s var(--spring)}
@keyframes in{from{transform:translateY(10px) scale(.97);opacity:.4}}
.dim{opacity:.28;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

/* shared: a bottom sheet inside a phone */
.ph .scrim{position:absolute;inset:0;z-index:5;background:#0008;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.ph .scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.ph .sh{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#1e1e20;border-radius:30px 30px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 14px 18px;transform:translateY(105%);transition:transform .5s var(--spring)}
.ph .sh.on{transform:none}
.ph .sh .grab{width:38px;height:5px;border-radius:9px;background:#48484c;margin:0 auto 12px}
.ph .sh h3{font-size:13px;font-weight:400;color:var(--m);margin:0 4px 10px}

/* L1 one circle, the letter you're in; it opens a grid of letters */
.l1 .now{position:absolute;right:14px;bottom:80px;z-index:4;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:20px;font-weight:500;display:grid;place-items:center;transition:transform .5s var(--spring)}
.l1 .now:active{transform:scale(.92)}
.l1 .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.l1 .grid button{aspect-ratio:1;border-radius:50%;background:#2a2a2d;font-size:17px;font-weight:500;transition:transform .45s var(--spring),background-color .2s}
.l1 .grid button:active{transform:scale(.9)}
.l1 .grid button[aria-current=true]{background:#fff;color:#111}

/* L2 a dotted rail; hold and slide, the letter shows big */
.l2 .rail{position:absolute;right:6px;top:110px;bottom:96px;width:30px;z-index:4;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 0}
.l2 .rail i{width:4px;height:4px;border-radius:50%;background:#55555a;transition:transform .3s var(--spring),background-color .15s}
.l2 .rail i.on{background:#fff;transform:scale(1.8)}
.l2 .rail i.no{opacity:.35}
.l2 .big{position:absolute;right:48px;z-index:4;width:64px;height:64px;margin-top:-32px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:30px;font-weight:500;opacity:0;scale:.7;transition:opacity .12s,scale .4s var(--spring);pointer-events:none}
.l2 .big.on{opacity:1;scale:1}

/* L3 a row of letters above the search, swiped sideways */
.l3 .row{position:absolute;left:0;right:0;bottom:80px;z-index:4;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 14px;scroll-snap-type:x proximity;touch-action:pan-x}
.l3 .row::-webkit-scrollbar{display:none}
.l3 .row button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:15px;font-weight:500;scroll-snap-align:center;transition:transform .45s var(--spring),background-color .2s}
.l3 .row button[aria-current=true]{background:#fff;color:#111;border-color:#fff}

/* L4 a dial: drag the letters under a fixed mark */
.l4 .dial{position:absolute;left:0;right:0;bottom:80px;height:58px;z-index:4;overflow:hidden;cursor:grab;-webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.l4 .tape{position:absolute;left:50%;top:0;height:100%;display:flex;align-items:center;will-change:transform}
.l4 .tape span{width:36px;flex:none;text-align:center;font-size:18px;font-weight:500;color:#6c6c71;transition:color .15s,scale .3s var(--spring)}
.l4 .tape span.on{color:#fff;scale:1.35}
.l4 .tape span.no{opacity:.35}
.l4 .mark{position:absolute;left:50%;bottom:136px;width:2px;height:10px;margin-left:-1px;border-radius:2px;background:#fff;z-index:4}

/* L5 a contents sheet: every artist under its letter */
.l5 .toc{position:absolute;right:14px;bottom:80px;z-index:4;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.l5 .sh{height:78%;display:flex;flex-direction:column}
.l5 .list{flex:1;overflow:auto;margin:0 -14px;padding:0 14px;touch-action:pan-y;scrollbar-width:none}
.l5 .list h4{position:sticky;top:0;background:#1e1e20;padding:10px 4px 6px;font-size:13px;font-weight:500;color:var(--m);z-index:1}
.l5 .list button{display:flex;align-items:center;gap:12px;width:100%;padding:6px 4px;border-radius:12px;text-align:left}
.l5 .list button:hover{background:#2a2a2d}
.l5 .list img,.l5 .list .sw{width:40px;height:40px;border-radius:4px;object-fit:cover;flex:none;background:#2c2c2e}
.l5 .list b{display:block;font-weight:500;font-size:15px}.l5 .list span span{color:var(--m);font-size:13px}
.l5 .side{position:absolute;right:4px;top:60px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--m);z-index:2}

/* L6 dividers: letter cards stick up out of the pile, like a record store's */
.l6 .stage{z-index:2;top:110px}
.l6 .tabs{position:absolute;left:0;right:0;top:70px;height:44px;z-index:1;display:flex;align-items:flex-end;overflow-y:hidden;gap:3px;overflow-x:auto;scrollbar-width:none;padding:0 20px;touch-action:pan-x}
.l6 .tabs::-webkit-scrollbar{display:none}
.l6 .tabs button{flex:none;width:30px;height:32px;border-radius:7px 7px 0 0;background:#e9e5dc;color:#222;font-size:13px;line-height:1;font-weight:500;padding:7px 0 0;display:flex;align-items:flex-start;justify-content:center;transition:height .45s var(--spring)}
.l6 .tabs button:nth-child(3n+2){background:#d9d3c4}.l6 .tabs button:nth-child(3n){background:#cfc7b4}
.l6 .tabs button:hover{height:38px}
.l6 .tabs button[aria-current=true]{height:44px;background:#fff}

/* L7 the letter, huge, behind the record; swipe it */
.l7 .ghost{position:absolute;left:-40px;right:-40px;top:6px;z-index:-1;text-align:center;font-size:460px;line-height:1;font-weight:500;letter-spacing:-.04em;color:#26262a;transition:transform .5s var(--spring),opacity .2s}
.l7 .ghost.go{transform:translateY(-30px);opacity:0;transition:none}
.l7 .hintx{position:absolute;left:0;right:0;bottom:84px;text-align:center;font-size:13px;color:var(--m)}

/* L8 search first: tapping the pill lays out the letters as keys */
.l8 .q{cursor:pointer}
.l8 .keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.l8 .keys button{height:44px;border-radius:12px;background:#2c2c2f;font-size:17px;font-weight:500;transition:transform .4s var(--spring),background-color .2s}
.l8 .keys button:active{transform:scale(.92)}
.l8 .keys button[aria-current=true]{background:#fff;color:#111}
.l8 .sh .fake svg{width:18px;height:18px;flex:none}
.l8 .sh .fake{height:44px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;color:#7d7d82;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Records: letter index</h1><p>Eight other ways to jump to a letter, built for a phone first. Every phone is live, so try each one. Star the ones worth taking further.</p></div>
    <div class="tools"><span class="picks" id="picks"></span><button class="tool" id="copy" type="button">Copy picks</button><button class="tool" id="clear" type="button">Clear</button></div></div>
  <div class="sheet" id="sheet"></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AZ=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const img=f=>/^(https?:|\/)/.test(f)?f:'vinyl/'+f;
const slugOf=r=>(r.artist+' '+r.title).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const name=r=>(r.sortAs||r.artist).replace(/^the /i,'');
const letter=r=>{const c=name(r).normalize('NFD').toUpperCase().replace(/[^A-Z0-9]/g,'')[0]||'#';return /[A-Z]/.test(c)?c:'#'};
const ink=hex=>{const n=parseInt((hex||'#333').slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255>.6?'#111':'#fff'};
const SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.6-4.6"/></svg>';
let R=[],FIRST={};

// one phone: a pile with the front record, its title, the search pill, and whatever index the concept adds
function phone(cls,extra){
  const ph=document.createElement('div');ph.className='ph '+cls;
  ph.innerHTML=`<p class="pos"></p><div class="stage"><div class="pile"><i></i><i></i><span class="front"></span></div><div class="t"></div></div><div class="q">${SEARCH}Search</div>${extra||''}`;
  ph.cur=0;
  ph.show=i=>{i=Math.max(0,Math.min(R.length-1,i));const ch=i!==ph.cur;ph.cur=i;const r=R[i],f=$('.front',ph);
    f.innerHTML=r.front?`<img src="${img(r.front)}" alt="">`:`<span class="pl" style="background:${r.spine||'#2c2c2e'};color:${ink(r.spine)}">${esc(r.title)}<small>${esc(r.artist)}</small></span>`;
    if(ch){f.classList.remove('flip');void f.offsetWidth;f.classList.add('flip')}
    $('.t',ph).innerHTML=`<b>${esc(r.title)}</b><span>${esc(r.artist)}</span>`;$('.pos',ph).textContent=`${i+1} of ${R.length}`;ph.onshow?.(letter(r))};
  ph.go=L=>{if(FIRST[L]!=null)ph.show(FIRST[L])};
  // a swipe up or down on the pile flips one record, like the crate
  let y0=null;const stage=$('.stage',ph);
  stage.addEventListener('pointerdown',e=>{y0=e.clientY});
  stage.addEventListener('pointerup',e=>{if(y0==null)return;const d=e.clientY-y0;y0=null;if(Math.abs(d)>24)ph.show(ph.cur+(d>0?1:-1))});
  stage.addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)>8)ph.show(ph.cur+Math.sign(e.deltaY))},{passive:false});
  return ph;
}
function sheet(ph,title,body){
  ph.insertAdjacentHTML('beforeend',`<div class="scrim"></div><div class="sh" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3>${body}</div>`);
  const sc=$('.scrim',ph),sh=$('.sh',ph);
  ph.open=on=>{sc.classList.toggle('on',on);sh.classList.toggle('on',on)};
  sc.onclick=()=>ph.open(false);
  let y0=null;sh.addEventListener('pointerdown',e=>{if(!e.target.closest('.list'))y0=e.clientY});sh.addEventListener('pointerup',e=>{if(y0!=null&&e.clientY-y0>50)ph.open(false);y0=null});
  return sh;
}
const has=L=>FIRST[L]!=null;
const letters=(tag,cls='')=>AZ.map(L=>`<${tag} data-l="${L}"${has(L)?'':` class="no ${cls}"`}${tag==='button'?` type="button"${has(L)?'':' disabled'}`:''}>${tag==='i'?'':L}</${tag}>`).join('');

const V=[
 ['One circle, a grid of letters','l1',ph=>{
   ph.insertAdjacentHTML('beforeend',`<button class="now" type="button" aria-label="Jump to a letter"></button>`);
   const sh=sheet(ph,'Jump to',`<div class="grid">${letters('button')}</div>`);
   $('.now',ph).onclick=()=>ph.open(true);
   $('.grid',sh).onclick=e=>{const b=e.target.closest('[data-l]');if(b){ph.go(b.dataset.l);setTimeout(()=>ph.open(false),120)}};
   ph.onshow=L=>{$('.now',ph).textContent=L;$$('.grid button',sh).forEach(b=>b.setAttribute('aria-current',b.dataset.l===L))};
 },'Nothing down the side. One round button above the search shows the letter you’re in; tap it for every letter as big round keys, letters with no records dimmed. Thumb-sized, out of the way.'],
 ['A dotted rail','l2',ph=>{
   ph.insertAdjacentHTML('beforeend',`<div class="rail" aria-hidden="true">${letters('i')}</div><span class="big"></span>`);
   const rail=$('.rail',ph),big=$('.big',ph);let on=false;
   const at=e=>{const b=rail.getBoundingClientRect(),k=Math.max(0,Math.min(25,Math.floor((e.clientY-b.top)/b.height*26))),L=AZ[k];
     big.textContent=L;big.style.top=(e.clientY-ph.getBoundingClientRect().top)+'px';big.classList.add('on');ph.go(L)};
   rail.addEventListener('pointerdown',e=>{on=true;rail.setPointerCapture(e.pointerId);at(e)});
   rail.addEventListener('pointermove',e=>{if(on)at(e)});
   const end=()=>{on=false;big.classList.remove('on')};rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);
   ph.onshow=L=>$$('.rail i',ph).forEach(i=>i.classList.toggle('on',i.dataset.l===L));
 },'The letters become quiet dots on the right edge, so the record gets the screen. Hold and slide: the letter you’re on shows big beside your thumb and the pile follows.'],
 ['A row of letters','l3',ph=>{
   ph.insertAdjacentHTML('beforeend',`<div class="row" role="group" aria-label="Jump to a letter">${letters('button')}</div>`);
   const row=$('.row',ph);row.onclick=e=>{const b=e.target.closest('[data-l]');if(b)ph.go(b.dataset.l)};
   ph.onshow=L=>{$$('button',row).forEach(b=>b.setAttribute('aria-current',b.dataset.l===L));const b=$(`[data-l="${L}"]`,row);b&&row.scrollTo({left:b.offsetLeft-row.clientWidth/2+20,behavior:'smooth'})};
 },'Letters ride in a row just above the search, swiped sideways like pills. The one you’re in stays centered and white as you flip.'],
 ['A dial','l4',ph=>{
   ph.insertAdjacentHTML('beforeend',`<div class="dial" aria-label="Turn to a letter"><div class="tape">${letters('span')}</div></div><span class="mark" aria-hidden="true"></span>`);
   const dial=$('.dial',ph),tape=$('.tape',ph),W=36;let x=0,d=null;
   const set=(k,anim)=>{x=-k*W-W/2;tape.style.transition=anim?'transform .5s cubic-bezier(.2,1.2,.35,1)':'none';tape.style.transform=`translateX(${x}px)`};
   dial.addEventListener('pointerdown',e=>{d={x:e.clientX,x0:x};dial.setPointerCapture(e.pointerId)});
   dial.addEventListener('pointermove',e=>{if(!d)return;x=d.x0+e.clientX-d.x;tape.style.transition='none';tape.style.transform=`translateX(${x}px)`;
     const k=Math.max(0,Math.min(25,Math.round((-x-W/2)/W)));let j=k;while(j<25&&!has(AZ[j]))j++;if(has(AZ[j])&&letter(R[ph.cur])!==AZ[j])ph.go(AZ[j]);
     $$('span',tape).forEach((s,i)=>s.classList.toggle('on',i===k))});
   const end=()=>{if(!d)return;d=null;set(AZ.indexOf(letter(R[ph.cur])),true)};
   dial.addEventListener('pointerup',end);dial.addEventListener('pointercancel',end);
   ph.onshow=L=>{if(!d)set(AZ.indexOf(L),true);$$('span',tape).forEach(s=>s.classList.toggle('on',s.dataset.l===L))};
 },'A strip of letters you drag sideways under a fixed mark, like tuning a radio. It snaps to the letter, and the pile changes as letters pass the mark.'],
 ['A contents sheet','l5',ph=>{
   ph.insertAdjacentHTML('beforeend',`<button class="toc" type="button">A–Z</button>`);
   const groups=AZ.filter(has).map(L=>{const as=[...new Map(R.filter(r=>letter(r)===L).map(r=>[r.artist,r])).values()];
     return`<h4 id="${ph.dataset.k}-${L}">${L}</h4>${as.map(r=>`<button type="button" data-i="${R.indexOf(r)}">${r.front?`<img src="${img(r.front)}" alt="" loading="lazy">`:'<span class="sw"></span>'}<span><b>${esc(r.artist)}</b><span>${R.filter(x=>x.artist===r.artist).length} record${R.filter(x=>x.artist===r.artist).length>1?'s':''}</span></span></button>`).join('')}`}).join('');
   const sh=sheet(ph,'Contents',`<div class="list">${groups}</div>`);
   $('.toc',ph).onclick=()=>{ph.open(true);const h=$(`#${ph.dataset.k}-${letter(R[ph.cur])}`,sh);if(h)$('.list',sh).scrollTop=h.offsetTop-4};
   $('.list',sh).onclick=e=>{const b=e.target.closest('[data-i]');if(b){ph.show(+b.dataset.i);setTimeout(()=>ph.open(false),120)}};
 },'A real table of contents: one pill opens a sheet of every artist under their letter, with a cover and a count, already scrolled to where you are. Tap an artist to land on them.'],
 ['Dividers','l6',ph=>{
   ph.insertAdjacentHTML('beforeend',`<div class="tabs" role="group" aria-label="Jump to a letter">${AZ.filter(has).map(L=>`<button type="button" data-l="${L}">${L}</button>`).join('')}</div>`);
   const tabs=$('.tabs',ph);tabs.onclick=e=>{const b=e.target.closest('[data-l]');if(b)ph.go(b.dataset.l)};
   ph.onshow=L=>{$$('button',tabs).forEach(b=>b.setAttribute('aria-current',b.dataset.l===L));const b=$(`[data-l="${L}"]`,tabs);b&&tabs.scrollTo({left:b.offsetLeft-tabs.clientWidth/2+15,behavior:'smooth'})};
 },'The letter cards record stores put in their bins, sticking up out of the top of the pile. The one you’re in stands tallest. Only letters with records get a card.'],
 ['The letter, huge','l7',ph=>{
   ph.insertAdjacentHTML('afterbegin',`<span class="ghost" aria-hidden="true"></span>`);
   ph.insertAdjacentHTML('beforeend',`<p class="hintx">Swipe sideways for the next letter</p>`);
   let x0=null;ph.addEventListener('pointerdown',e=>{x0=e.clientX});
   ph.addEventListener('pointerup',e=>{if(x0==null)return;const d=e.clientX-x0;x0=null;if(Math.abs(d)<30)return;const L=AZ.filter(has),k=L.indexOf(letter(R[ph.cur]));ph.go(L[Math.max(0,Math.min(L.length-1,k+(d<0?1:-1)))])});
   let last='';ph.onshow=L=>{const g=$('.ghost',ph);if(L===last)return;last=L;g.classList.add('go');g.textContent=L;void g.offsetWidth;g.classList.remove('go')};
 },'No index at all on screen: the letter you’re in sits huge and faint behind the pile. Swipe up and down for records, sideways for letters.'],
 ['Search first','l8',ph=>{
   const sh=sheet(ph,'Jump to a letter, or type',`<div class="fake">${SEARCH}Artist, title, label or year</div><div class="keys">${letters('button')}</div>`);
   $('.q',ph).onclick=()=>ph.open(true);
   $('.keys',sh).onclick=e=>{const b=e.target.closest('[data-l]');if(b){ph.go(b.dataset.l);setTimeout(()=>ph.open(false),120)}};
   ph.onshow=L=>$$('.keys button',sh).forEach(b=>b.setAttribute('aria-current',b.dataset.l===L));
 },'The index lives inside search. Tap the pill and, before you type, the letters wait as a keyboard of their own. One control instead of two.'],
];

async function load(){
  const [src,meta]=await Promise.all([fetch('vinyl-prototype.html').then(r=>r.text()),fetch('vinyl/covers.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]);
  const m=src.match(/const RECORDS=\[([\s\S]*?)\]\.map\(/);
  R=(m?Function('return ['+m[1]+']')():[]).map(r=>({...meta[slugOf(r)],...r}));
  R.sort((a,b)=>name(a).localeCompare(name(b),'en',{sensitivity:'base'})||(+a.year||9999)-(+b.year||9999));
  R.forEach((r,i)=>{const L=letter(r);if(FIRST[L]==null)FIRST[L]=i});
  V.forEach(([n,c,make,use],i)=>{const id='L'+(i+1),st=document.createElement('div');st.className='st';st.dataset.id=id;
    st.innerHTML=`<span class="id"><b>${id}</b>${esc(n)}</span><button class="star" type="button" aria-label="Pick ${id} ${esc(n)}">★</button><p class="use">${use}</p>`;
    const ph=phone(c);ph.dataset.k=id;st.insertBefore(ph,$('.use',st));$('#sheet').append(st);make(ph);ph.show(0)});
  wire();
}
function wire(){
  let picks=new Set();try{picks=new Set(JSON.parse(localStorage.getItem('records-index-picks')||'[]'))}catch{}
  const save=()=>{try{localStorage.setItem('records-index-picks',JSON.stringify([...picks]))}catch{}};
  const show=()=>{$('#picks').textContent=picks.size?[...picks].sort().join(' · '):'No picks yet';$$('.st').forEach(s=>s.classList.toggle('picked',picks.has(s.dataset.id)))};
  $$('.st').forEach(s=>{$('.star',s).onclick=()=>{const id=s.dataset.id;picks.has(id)?picks.delete(id):picks.add(id);save();show()}});
  $('#copy').onclick=()=>{navigator.clipboard?.writeText([...picks].sort().join(', ')).catch(()=>{});$('#copy').textContent='Copied';setTimeout(()=>$('#copy').textContent='Copy picks',1200)};
  $('#clear').onclick=()=>{picks.clear();save();show()};
  show();
}
load();
</script>
